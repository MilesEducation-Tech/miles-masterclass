<div class="flex flex-col gap-6">
  <div class="flex flex-wrap items-center gap-3">
    <div class="relative">
      <select
        class="w-48 cursor-pointer appearance-none rounded-lg border border-white/10 bg-neutral-900 py-2.5 pr-10 pl-4 text-sm text-white"
        aria-label="Filter by field of study"
        [value]="studyFilter()"
        (change)="onStudyFilter($event)"
      >
        @for (opt of studyFilterOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
      <ng-icon
        name="lucideChevronDown"
        class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-gray-400"
        aria-hidden="true"
      />
    </div>

    <div class="relative">
      <select
        class="w-40 cursor-pointer appearance-none rounded-lg border border-white/10 bg-neutral-900 py-2.5 pr-10 pl-4 text-sm text-white"
        aria-label="Select year"
        [value]="selectedYear()"
        (change)="onYear($event)"
      >
        @for (year of yearOptions(); track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
      <ng-icon
        name="lucideChevronDown"
        class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-gray-400"
        aria-hidden="true"
      />
    </div>
  </div>

  <div class="flex flex-col items-stretch gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div
      class="flex w-full items-center justify-between gap-6 rounded-xl bg-[#0B1838] px-6 py-5 lg:w-auto lg:min-w-[520px]"
    >
      <div class="flex flex-col gap-3">
        <div class="flex items-baseline">
          <span class="text-5xl font-extrabold text-white">
            @if (credits(); as c) {
              {{ c.earned | number: '1.0-2' }}
            } @else {
              0
            }
          </span>
          &nbsp;
          <span class="text-lg font-semibold text-amber-400">CPE Credits</span>
        </div>

        <p class="max-w-[240px] text-right text-xs text-gray-300">
          Total credits that you have earned so far.
        </p>
      </div>
      <div class="hidden flex-col items-end gap-2 md:flex">
        <app-button
          size="sm"
          variant="ghost"
          class="rounded-md text-black bg-white"
          (clicked)="openCompliance.emit()"
        >
          View Compliance
        </app-button>
      </div>
    </div>

    <div class="flex flex-wrap items-end gap-3">
      <app-button [variant]="'default'" (clicked)="downloadNasba.emit()">
        <ng-icon name="lucideDownload" class="mr-2" aria-hidden="true" />
        Download NASBA Template
      </app-button>
      <app-button [variant]="'default'" (clicked)="downloadAll.emit()">
        <ng-icon name="lucideDownload" class="mr-2" aria-hidden="true" />
        Download All CPE Certificates
      </app-button>
    </div>
  </div>
</div>
