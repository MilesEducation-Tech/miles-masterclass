<section class="min-h-screen bg-background text-white pt-32">
  <app-badge-swiper
    [badges]="heroBadges()"
    (claim)="onClaimBadge($event)"
    (share)="onShareBadge($event)"
  />

  <div class="mx-auto container sm:px-6 py-10">
    <app-tracker-toolbar
      [category]="category()"
      [level]="level()"
      [contentType]="contentType()"
      [contentTypeOptions]="contentTypeOptions()"
      [credits]="credits()"
      (categoryChange)="onCategory($event)"
      (levelChange)="onLevel($event)"
      (contentTypeChange)="onContentType($event)"
      (openCompliance)="openCompliance()"
    />

    <div class="mt-8">
      <app-tracker-table
        [rows]="pagedRows()"
        [titleNavigable]="false"
        [isLoading]="cpe.isLoadingBadges()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageWindow]="pageWindow()"
        (rowAction)="onRowAction($event)"
        (prevPage)="prevPage()"
        (nextPage)="nextPage()"
      />
    </div>
  </div>
</section>
