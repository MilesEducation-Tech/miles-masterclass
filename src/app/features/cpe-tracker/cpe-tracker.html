<section class="min-h-screen bg-background text-white pt-32">
  <app-badge-swiper
    [badges]="facade.badges()"
    (claim)="facade.claimBadge($event)"
    (share)="facade.shareBadge($event)"
    (openInfo)="facade.openBadgeInfo()"
  />

  <div class="mx-auto container sm:px-6 py-10">
    <app-tracker-toolbar
      [selectedYear]="facade.selectedYear()"
      [yearOptions]="facade.yearOptions()"
      [credits]="facade.credits()"
      [studyFilter]="facade.studyFilter()"
      (yearChange)="facade.setYear($event)"
      (studyFilterChange)="facade.setStudyFilter($event)"
      (openCompliance)="facade.openCompliance()"
      (downloadNasba)="facade.downloadNasba()"
      (downloadAll)="facade.downloadAllCertificates()"
    />

    <div class="mt-8">
      <app-tracker-table
        [rows]="facade.pagedTableRows()"
        [isLoading]="facade.isLoadingReport()"
        [currentPage]="facade.currentPage()"
        [totalPages]="facade.totalPages()"
        [pageWindow]="facade.pageWindow()"
        (rowAction)="onRowAction($event)"
        (titleClick)="onTitleClick($event)"
        (prevPage)="facade.prevPage()"
        (nextPage)="facade.nextPage()"
      />
    </div>
  </div>
</section>
