<div
  class="rounded-2xl border border-(--accent)/40 bg-linear-to-br from-(--accent)/15 to-transparent p-5"
>
  <div class="flex items-center gap-4">
    <!-- 3D discount badge -->
    <div class="shrink-0 perspective-[600px]">
      <div
        class="flex -rotate-6 flex-col items-center justify-center rounded-2xl bg-linear-to-br from-[#FFE375] via-[#FFCF00] to-[#E0A400] px-3.5 py-2.5 ring-1 ring-white/40 shadow-[0_10px_20px_-4px_rgba(0,0,0,0.55),0_4px_6px_-2px_rgba(0,0,0,0.4),inset_0_2px_2px_rgba(255,255,255,0.6),inset_0_-3px_4px_rgba(180,120,0,0.55)] transition-transform duration-300 hover:-rotate-3 hover:scale-105"
      >
        <span
          class="text-3xl font-black leading-none text-[#3A2A00] drop-shadow-[0_1px_0_rgba(255,255,255,0.6)]"
          >25%</span
        >
        <span class="mt-0.5 text-[0.7rem] font-extrabold uppercase tracking-[0.2em] text-[#5A4200]"
          >Off</span
        >
      </div>
    </div>

    <div>
      <p class="text-lg font-bold text-white leading-snug">
        Attend the Webinar &amp; Claim your discount
      </p>
      <p class="mt-1 text-sm text-neutral-400">
        Join the live 2-hour interactive workshop to build your first functional accounting AI agent
        and unlock 25% off your membership upon completion.
      </p>
    </div>
  </div>
