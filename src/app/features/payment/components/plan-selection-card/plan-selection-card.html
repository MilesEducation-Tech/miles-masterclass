<button
  type="button"
  class="group relative w-full h-full text-left rounded-2xl border bg-[#0F141A] px-5 py-4 transition-colors cursor-pointer"
  [class]="
    selected()
      ? 'border-(--accent) ring-1 ring-(--accent)'
      : 'border-white/10 hover:border-white/20'
  "
  [attr.aria-pressed]="selected()"
  (click)="onSelect()"
>
  @if (selected()) {
    <span
      class="absolute -top-2 -right-2 grid h-6 w-6 place-items-center rounded-full bg-(--accent) text-white shadow-md"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 16 16"
        class="h-3.5 w-3.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 8.5l2.5 2.5L12 5" />
      </svg>
    </span>
  }

  <p class="text-sm font-medium text-neutral-300">
    {{ title() }}
  </p>

  <p
    class="mt-1 font-semibold text-white transition-all"
    [class]="selected() ? 'text-4xl' : 'text-2xl'"
  >
    @if (priceDisplay().label) {
      {{ priceDisplay().label }}
    } @else {
      @if (priceDisplay().baseAmount! > priceDisplay().amount!) {
        <span class="mr-2 text-base font-normal text-neutral-500 line-through">
          {{ priceDisplay().baseAmount | currency: priceDisplay().currency! : 'symbol' : '1.0-0' }}
        </span>
      }
      {{ priceDisplay().amount | currency: priceDisplay().currency! : 'symbol' : '1.0-0'
      }}<span class="text-base font-normal text-neutral-400">/{{ priceDisplay().duration }}</span>
    }
  </p>

  <p class="mt-1 flex items-center gap-1 text-xs text-neutral-400">
    <span>{{ subtitle() }}</span>
    @if (infoNote(); as note) {
      <span class="group relative inline-flex shrink-0">
        <span
          tabindex="0"
          class="inline-flex text-neutral-400 hover:text-white cursor-help"
          aria-label="Plan details"
        >
          <ng-icon name="matInfoRound" class="text-sm" />
        </span>
        <span
          role="tooltip"
          class="pointer-events-none absolute bottom-full left-1/2 z-20 mb-2 w-56 -translate-x-1/2 rounded-lg bg-[#0B0F14] p-2 text-left text-xs leading-relaxed text-neutral-300 opacity-0 shadow-lg ring-1 ring-white/15 transition-opacity duration-150 group-hover:opacity-100"
        >
          {{ note }}
        </span>
      </span>
    }
  </p>
</button>
