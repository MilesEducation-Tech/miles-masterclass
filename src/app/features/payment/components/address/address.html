<!-- Radio indicator -->
<span
  class="shrink-0 flex items-center justify-center w-5 h-5 rounded-full border-2 border-gray-600 transition-colors duration-200"
  aria-hidden="true"
  [class.border-action]="selected()"
>
  <span
    class="w-2.5 h-2.5 rounded-full transition-all duration-200"
    [class.bg-action]="selected()"
    [class.scale-100]="selected()"
    [class.scale-0]="!selected()"
  ></span>
</span>

<!-- Address details -->
<div class="flex-1 min-w-0">
  @if (userName()) {
    <p class="text-lg font-bold text-white m-0 mb-1 leading-tight">{{ userName() }}</p>
  }
  <p class="text-sm text-gray-400 m-0 leading-relaxed truncate">{{ formattedAddress() }}</p>
</div>

<!-- Action buttons -->
<div class="shrink-0 flex gap-1 ml-auto">
  <button
    type="button"
    class="flex items-center justify-center w-8 h-8 p-0 border-none rounded-md bg-transparent text-gray-500 cursor-pointer transition-colors duration-150 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-gray-500"
    aria-label="Edit address"
    [disabled]="actionsDisabled()"
    (click)="onEdit($event)"
  >
    <ng-icon name="matEditOutline" size="24" />
  </button>
  <button
    type="button"
    class="flex items-center justify-center w-8 h-8 p-0 border-none rounded-md bg-transparent text-gray-500 cursor-pointer transition-colors duration-150 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-gray-500"
    aria-label="Delete address"
    [disabled]="actionsDisabled()"
    (click)="onDelete($event)"
  >
    <ng-icon name="matDeleteOutline" size="24" />
  </button>
</div>
