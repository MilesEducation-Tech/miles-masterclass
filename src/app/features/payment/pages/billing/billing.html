<p class="text-xl text-white font-semibold">Billing Address</p>
<hr class="border-gray-800" />
@for (address of billingAddress(); track address.id) {
  <app-address
    [address]="address"
    [userName]="userName()"
    [selected]="selectedAddressId() === address.id"
    [actionsDisabled]="!!editingAddressId()"
    (selectedChange)="selectAddress($event)"
    (edit)="onEditAddress($event)"
    (delete)="onDeleteAddress($event)"
  />
} @empty {
  <!-- The empty state IS the primary action: with no address saved there is
       nothing else to do on this page, so the whole card opens the form rather
       than pointing at a link below it. Still a real <button>, so it's
       keyboard-reachable and announced as an action.

       Hidden once the form is open — it has done its job, and leaving a
       "no address saved" placard above the form the user is filling in reads
       as an error rather than a prompt. -->
  @if (!showForm()) {
    <button
      type="button"
      class="no-file-found flex w-full flex-col items-center justify-center py-8 px-4 text-center bg-surface-state rounded-lg shadow-md cursor-pointer border border-transparent transition-colors hover:border-action hover:bg-[#1a2634] focus-visible:outline-none focus-visible:border-action focus-visible:ring-2 focus-visible:ring-action/40"
      (click)="showForm.set(true)"
    >
      <svg
        class="w-12 h-12 text-gray-400"
        stroke="currentColor"
        fill="currentColor"
        stroke-width="0"
        viewBox="0 0 24 24"
        height="200px"
        width="200px"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g id="File_Off">
          <g>
            <path
              d="M4,3.308a.5.5,0,0,0-.7.71l.76.76v14.67a2.5,2.5,0,0,0,2.5,2.5H17.44a2.476,2.476,0,0,0,2.28-1.51l.28.28c.45.45,1.16-.26.7-.71Zm14.92,16.33a1.492,1.492,0,0,1-1.48,1.31H6.56a1.5,1.5,0,0,1-1.5-1.5V5.778Z"
            ></path>
            <path
              d="M13.38,3.088v2.92a2.5,2.5,0,0,0,2.5,2.5h3.07l-.01,6.7a.5.5,0,0,0,1,0V8.538a2.057,2.057,0,0,0-.75-1.47c-1.3-1.26-2.59-2.53-3.89-3.8a3.924,3.924,0,0,0-1.41-1.13,6.523,6.523,0,0,0-1.71-.06H6.81a.5.5,0,0,0,0,1Zm4.83,4.42H15.88a1.5,1.5,0,0,1-1.5-1.5V3.768Z"
            ></path>
          </g>
        </g>
      </svg>
      <!-- Spans, not h3/p: `<button>` takes phrasing content only, and flow
           elements inside it are invalid HTML. -->
      <span class="block text-xl font-medium mt-4 text-gray-200">No billing address saved</span>
      <!-- Required, not suggested: checkout can't proceed without one, so the
           copy states that plainly instead of hedging with "please". -->
      <span class="block text-gray-400 mt-2">
        A billing address is required to complete your purchase.
      </span>
      <span class="mt-4 text-sm font-medium text-action">+ Add billing address</span>
    </button>
  }
}

<div class="pt-4 border-t border-gray-800 flex">
  <button
    app-button
    type="button"
    class="w-auto text-action hover:bg-transparent"
    variant="ghost"
    (click)="showForm() ? cancelEditing() : showForm.set(true)"
  >
    {{
      showForm() && !editingAddressId()
        ? '- Cancel Adding Billing Address'
        : '+ Add new billing address'
    }}
  </button>
</div>

@if (showForm()) {
  <div class="auth-card max-w-full!">
    @if (editingAddressId()) {
      <p class="text-sm text-action font-medium mb-2">✏️ Editing address</p>
    }
    <form class="space-y-4 flex flex-col rounded-lg" (submit)="$event.preventDefault(); save()">
      <app-field [errors]="billingForm.name().errors()">
        <label ngpLabel for="name">Name</label>

        <input app-input id="name" type="text" [formField]="billingForm.name" />
      </app-field>
      <app-field [errors]="billingForm.email_id().errors()">
        <label ngpLabel for="email">Email</label>

        <input app-input id="email" type="email" [formField]="billingForm.email_id" />
      </app-field>
      <app-field [errors]="billingForm.phone_no().errors()">
        <label ngpLabel for="phone">Phone Number</label>

        <input app-input id="phone" type="tel" [formField]="billingForm.phone_no" />
      </app-field>

      <!-- Standard two-line postal layout. The payload has no `address2`
           field, so line 2 maps onto `locality` — same meaning (street / area),
           no backend change. Line 2 and landmark stay optional, which is why
           only line 1 carries a `required` rule. -->
      <app-field [errors]="billingForm.address1().errors()">
        <label ngpLabel for="address1">Address line 1</label>
        <p ngpDescription>Flat / house no, floor, building</p>
        <input app-input id="address1" type="text" [formField]="billingForm.address1" />
      </app-field>

      <app-field [errors]="billingForm.locality().errors()">
        <label ngpLabel for="locality">Address line 2 (optional)</label>
        <p ngpDescription>Street, area or locality</p>
        <input app-input id="locality" type="text" [formField]="billingForm.locality" />
      </app-field>

      <app-field [errors]="billingForm.landmark().errors()">
        <label ngpLabel for="landmark">Nearby landmark (optional)</label>

        <input app-input id="landmark" type="text" [formField]="billingForm.landmark" />
      </app-field>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-field [errors]="billingForm.country().errors()">
          <label ngpLabel for="country">Country</label>

          <app-combobox
            id="country"
            [placeholder]="countryPlaceholder()"
            [options]="countryOptions()"
            [formField]="billingForm.country"
          />
        </app-field>
        <app-field [errors]="billingForm.state().errors()">
          <label ngpLabel for="state">State</label>

          <app-combobox
            id="state"
            placeholder="Select State"
            [options]="stateOptions()"
            [formField]="billingForm.state"
          />
        </app-field>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-field [errors]="billingForm.city().errors()">
          <label ngpLabel for="city">City</label>

          <app-combobox
            id="city"
            placeholder="Select City"
            [options]="cityOptions()"
            [formField]="billingForm.city"
          />
        </app-field>
        <app-field [errors]="billingForm.zipcode().errors()">
          <label ngpLabel for="postal_code">Pin Code/ Zip code</label>

          <input app-input id="postal_code" type="text" [formField]="billingForm.zipcode" />
        </app-field>
      </div>

      <div class="flex gap-3 mt-4 w-full">
        @if (editingAddressId()) {
          <button
            app-button
            type="button"
            class="w-full"
            variant="destructive"
            (click)="cancelEditing()"
          >
            Cancel
          </button>
        }
        <button
          app-button
          class="w-full"
          type="submit"
          variant="default"
          [disabled]="billingForm().invalid()"
        >
          Save Address
        </button>
      </div>
    </form>
  </div>
}
