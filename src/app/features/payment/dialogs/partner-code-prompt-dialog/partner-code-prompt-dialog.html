<app-dialog
  [ariaLabel]="
    data?.codeOnly ? 'Apply a partner code' : 'Continue to subscribe or apply a partner code'
  "
  panelClass="p-0 max-w-[95vw]"
>
  <div
    class="bg-linear-to-b from-sheet-top to-sheet-bottom flex flex-col md:max-w-[640px] w-[95svw] max-h-[85svh] mx-auto overflow-hidden relative rounded-xl"
  >
    <button
      app-button
      type="button"
      class="rounded-full"
      [class]="'absolute top-3 end-3 z-10'"
      aria-label="Close dialog"
      variant="ghost"
      size="icon"
      (click)="close()"
    >
      <ng-icon name="heroXMark" aria-hidden="true" />
    </button>

    <div class="flex-1 overflow-y-auto px-6 py-10 sm:px-12">
      <p class="text-base sm:text-lg text-white text-center leading-relaxed">
        If your firm or institution has partnered with Miles Masterclass, you may have received a
        partner code for exclusive access.
      </p>

      @if (showSubscribe) {
        <p class="text-base sm:text-lg font-semibold text-white text-center mt-8">
          Choose an option to continue:
        </p>

        <div class="flex justify-center mt-6">
          <button
            app-button
            type="button"
            class="w-full sm:w-auto"
            variant="default"
            size="lg"
            (click)="continueToSubscribe()"
          >
            Continue to subscribe
          </button>
        </div>

        <p class="text-center text-white mt-6 mb-4">OR</p>
      } @else {
        <p class="text-base sm:text-lg font-semibold text-white text-center mt-8 mb-4">
          Enter your partner code
        </p>
      }

      <form (submit)="$event.preventDefault(); applyCode()">
        <div class="flex items-stretch gap-0 rounded-lg overflow-hidden max-w-md mx-auto relative">
          <app-field class="flex-1" [errors]="partnerCodeForm.partner_code().errors()">
            <label ngpLabel for="partner_code">Enter Partner Code</label>

            <input
              app-input
              id="partner_code"
              type="text"
              placeholder="Enter Partner Code"
              [formField]="partnerCodeForm.partner_code"
            />
          </app-field>
          <button
            app-button
            class="absolute top-1 end-1"
            variant="secondary"
            type="submit"
            [disabled]="!canSubmit()"
          >
            {{ loading() ? 'Applying…' : 'Submit' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</app-dialog>
