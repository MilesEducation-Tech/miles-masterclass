<app-dialog ariaLabel="Apply a coupon" panelClass="p-0 w-[460px] max-w-[95vw]">
  <div
    class="bg-linear-to-l from-plan-1 to-plan-4 flex flex-col md:max-w-[460px] w-[95svw] mx-auto overflow-hidden relative rounded-xl"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10 shrink-0">
      <h2 class="text-lg font-bold text-white">Apply a coupon</h2>
      <button
        app-button
        type="button"
        class="rounded-full"
        aria-label="Close dialog"
        variant="ghost"
        size="icon"
        (click)="close()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <div class="p-5 space-y-2">
      <!-- dir="ltr" on the row: a code reads left-to-right, and the input's end padding is
           reserved for the Apply button beside it, so the two must flip together or not at all. -->
      <div class="relative flex items-center" dir="ltr">
        <input
          #codeInput
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Enter coupon code"
          aria-label="Coupon code"
          [attr.maxlength]="maxLength"
          [attr.aria-invalid]="error() ? true : null"
          [attr.aria-describedby]="error() ? 'coupon-error' : null"
          class="w-full rounded-lg bg-surface-inset ps-4 pe-20 py-3 text-sm text-white placeholder:text-gray-500 ring-1 ring-white/10 outline-none focus:ring-blue-500 transition-colors"
          (input)="error.set(null)"
          (keydown.enter)="apply(codeInput.value)"
        />
        <button
          app-button
          type="button"
          variant="ghost"
          [class]="'absolute end-1.5 h-auto top-1/2 -translate-y-1/2 px-3 text-xs font-bold text-blue-500 hover:bg-transparent hover:text-blue-400'"
          [disabled]="applying()"
          (click)="apply(codeInput.value)"
        >
          {{ applying() ? 'APPLYING…' : 'APPLY' }}
        </button>
      </div>
      @if (error(); as message) {
        <p id="coupon-error" role="alert" class="text-sm text-red-400">{{ message }}</p>
      }
    </div>
  </div>
</app-dialog>
