<app-partner-content-list
  [content]="[
    {
      subHeading: 'Masters of the AI Accounting Era',
      paragraph: 'Industry legends. AI visionaries. Your new mentors in accounting mastery',
      subHeadingClass: 'text-white md:text-5xl text-3xl font-bold ',
      itemClass: 'text-center py-4 md:w-2/3 w-full mx-auto leading-relaxed',
      paragraphClass: 'text-white md:text-lg text-base font-normal mt-2',
    },
  ]"
/>
<div class="flex justify-end mb-6">
  <label
    class="inline-flex items-center gap-2 h-10 px-4 rounded-full bg-secondary/60 border border-border/40 backdrop-blur-sm text-sm w-full max-w-sm focus-within:ring-2 focus-within:ring-accent transition-shadow"
  >
    <ng-icon name="heroMagnifyingGlass" size="16" class="text-muted-foreground shrink-0" />
    <input
      type="search"
      [value]="searchInput()"
      (input)="onSearchInput($event)"
      placeholder="Search instructors"
      class="flex-1 bg-transparent outline-none text-foreground placeholder:text-muted-foreground"
      aria-label="Search instructors"
    />
    @if (searchInput()) {
      <button
        type="button"
        (click)="clearSearch()"
        aria-label="Clear search"
        class="text-xs font-medium text-muted-foreground hover:text-foreground"
      >
        Clear
      </button>
    }
  </label>
</div>

<p class="text-center text-muted-foreground py-8">No instructors found.</p>
