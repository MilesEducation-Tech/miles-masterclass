<div class="w-full h-full relative flex items-end justify-end flex-col" #badgeRoot>
  @for (star of stars(); track $index) {
    <div
      class="absolute pointer-events-none"
      [class.animate-slide-fade-left]="star.slideDirection === 'left'"
      [class.animate-slide-fade-right]="star.slideDirection === 'right'"
      [style.left.%]="star.x"
      [style.top.%]="star.y"
      [style.width.px]="star.width"
      [style.height.px]="star.height"
      [style.animation-delay.s]="1 + star.delay"
      [class.animate-blink]="star.shouldAnimate"
      [innerHTML]="star.svg"
    ></div>
  }
  @for (badge of badges(); track $index) {
    <div
      class="absolute pointer-events-none z-50"
      [class.animate-slide-fade-left]="badge.slideDirection === 'left'"
      [class.animate-slide-fade-right]="badge.slideDirection === 'right'"
      [class.animate-float]="badge.shouldAnimate"
      [style.left.%]="badge.x"
      [style.top.%]="badge.y"
      [style.width.px]="badge.width"
      [style.height.px]="badge.height"
      [style.animation-delay.s]="0.5 + badge.delay"
      [style.transform]="
        'rotate(' +
        badge.rotate +
        'deg) scale(' +
        badge.scale +
        ') skewX(' +
        badge.skewX +
        'deg) skewY(' +
        badge.skewY +
        'deg)'
      "
    >
      <img [src]="badge.image" alt="badge" class="w-full h-full object-contain" />
    </div>
  }
  <div
    class="h-[15%] w-10/12 mx-auto bg-accent rounded-[100%] relative animate-slide-fade-up"
    style="animation-delay: 0.1s"
  >
    <div
      class="h-[80%] absolute top-0 left-1/2 -translate-x-1/2 w-10/12 mx-auto bg-accent rounded-[100%] border-b-[3px] border-[#26272C]"
    ></div>
    <div
      class="h-[60%] absolute top-0 left-1/2 -translate-x-1/2 w-8/12 mx-auto bg-[#3399FF]/80 rounded-[100%] border-4 border-[#2BBADD]/50 bg-blend-screen z-10"
    ></div>
    <div
      class="h-[60%] absolute -top-1/2 left-1/2 -translate-x-1/2 w-9/12 mx-auto bg-transparent rounded-[100%] border-b-4 border-l-4 -rotate-3 z-10 border-white"
    ></div>
  </div>
  <div
    class="h-[65%] w-[55%] mx-auto absolute bottom-[10%] left-1/2 z-0 -translate-x-1/2 border-x-2 bg-[linear-gradient(0deg,rgb(51_153_255/0.7)_0%,transparent_100%)] border-[#2BBADD]/30 animate-slide-fade-up"
    style="animation-delay: 0.5s"
  ></div>
  <div
    class="absolute left-1/2 top-1/2 -translate-1/2 w-2/5 aspect-square flex items-center justify-center animate-slide-fade-up"
    style="animation-delay: 0.7s"
  >
    <img
      [src]="S3_BUCKET_URL + 'static-assests/web-app/commons/linkedin3d.webp'"
      alt=""
      class="animate-float"
    />
  </div>
</div>
