<section class="badge-hero mb-8">
  <div class="w-full aspect-video grid md:grid-cols-5 grid-cols-1 md:gap-10 gap-6">
    <div class="flex-col flex md:space-y-10 space-y-6 col-span-3 justify-center">
      <div class="text-xl font-semibold text-white flex items-center space-x-3 max-md:hidden">
        Powered By
        <span>
          <img
            [src]="S3_BUCKET_URL + 'static-assests/web-app/commons/credly.webp'"
            alt="Credly Logo"
            class="w-28"
          />
        </span>
      </div>
      <div
        class="flex justify-center items-center md:w-1/2 w-10/12 mx-auto md:space-x-6 space-x-2 relative h-max md:hidden"
      >
        <img
          [src]="S3_BUCKET_URL + 'static-assests/web-app/commons/miles-masterclass-logo.webp'"
          alt="Miles Masterclass Logo"
          class="md:w-1/4 w-[28%] h-auto"
        />
        <div class="block w-px md:h-[70px] h-[50px] bg-white/50"></div>
        <img
          [src]="S3_BUCKET_URL + 'static-assests/web-app/commons/credly.webp'"
          alt="Credly Logo"
          class="md:w-1/4 w-[28%] h-auto"
        />
        <div class="block w-px md:h-[70px] h-[50px] bg-white/50"></div>
        <img
          [src]="S3_BUCKET_URL + 'static-assests/web-app/commons/linkedin.webp'"
          alt="LinkedIn logo"
          class="md:w-1/4 w-[28%] h-auto"
        />
      </div>
      <h1 class="md:text-6xl text-4xl font-bold leading-tight! max-md:text-center">
        Introducing
        <br />
        <span class="font-normal md:text-5xl text-3xl">MILES MASTERCLASS DIGITAL CREDENTIALS</span>
      </h1>
      <p class="md:text-lg text-sm font-normal max-md:text-center">
        Explore badge-enabled courses, claim what you’ve earned, and flex it on LinkedIn all in one
        tap.
      </p>
    </div>
    <div class="flex-col flex space-y-10 col-span-2 relative max-lg:hidden overflow-hidden">
      <app-badge-spot-animation />
    </div>
  </div>
</section>
