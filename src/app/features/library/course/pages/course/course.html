<div #listSection class="grid md:grid-cols-[16rem_1fr] gap-6 scroll-mt-24">
  <!-- Sidebar (desktop only) -->
  <aside
    class="hidden md:block sticky top-24 self-start max-h-[calc(100vh-7rem)] overflow-y-auto pe-2"
  ></aside>

  <!-- Main column -->
  <div class="flex flex-col gap-6 min-w-0">
    <div
      class="sticky top-24 z-10 -mx-4 px-4 py-2 bg-background/95 backdrop-blur-sm flex items-center justify-between gap-4 flex-wrap"
    >
      <app-tabs [value]="currentLabel() ?? ''" (valueChange)="onTabChange($event)">
        @for (tab of tabLabels(); track tab) {
          <app-tab [value]="tab" [label]="tab" />
        }
      </app-tabs>
    </div>

    <p class="text-center text-muted-foreground py-8">No courses found.</p>
  </div>
</div>
