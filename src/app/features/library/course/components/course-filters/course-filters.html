<div class="flex items-center justify-between mb-3">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-muted-foreground">Filters</h2>
  @if (hasActiveFilters()) {
    <button
      type="button"
      class="text-xs font-medium text-accent hover:underline"
      (click)="onClear()"
    >
      Clear all
    </button>
  }
</div>

<div
  ngpAccordion
  ngpAccordionType="multiple"
  ngpAccordionCollapsible
  class="flex flex-col divide-y divide-border/40"
>
  @for (group of groups(); track group.key) {
    <section ngpAccordionItem [ngpAccordionItemValue]="group.key" class="py-2">
      <button
        ngpAccordionTrigger
        class="group w-full flex items-center justify-between gap-2 py-2 px-1 text-start text-sm font-medium text-foreground rounded-md bg-transparent border-0 outline-none data-[focus-visible]:ring-2 data-[focus-visible]:ring-accent"
      >
        <span class="flex items-center gap-2">
          {{ group.label }}
          @if (selectedFor(group.key).length) {
            <span
              class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-accent text-white text-[10px] font-semibold"
            >
              {{ selectedFor(group.key).length }}
            </span>
          }
        </span>
        <ng-icon
          name="heroChevronDown"
          size="16"
          class="text-muted-foreground transition-transform group-data-[open]:rotate-180"
        />
      </button>

      <div ngpAccordionContent class="mt-1">
        <!-- Checkbox rows in a scroll area, as production. The primitive reflects selection
             as data-selected only, so aria-selected is bound from each option's state. -->
        <div
          ngpListbox
          ngpListboxMode="multiple"
          [ngpListboxValue]="selectedFor(group.key)"
          (ngpListboxValueChange)="update(group.key, $event)"
          [attr.aria-label]="group.label"
          class="flex max-h-72 flex-col gap-1 overflow-y-auto pe-1 outline-none"
        >
          @for (option of group.options; track option.value) {
            <div
              ngpListboxOption
              #item="ngpListboxOption"
              [ngpListboxOptionValue]="option.value"
              [attr.aria-selected]="item.selected()"
              class="group/option flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-sm text-foreground outline-none select-none data-hover:bg-secondary/40 data-active:bg-secondary/60"
            >
              <span
                class="inline-flex size-4 shrink-0 items-center justify-center rounded border border-border/60 bg-secondary/30 transition-colors group-data-selected/option:border-accent group-data-selected/option:bg-accent"
                aria-hidden="true"
              >
                <ng-icon
                  name="heroCheck"
                  size="12"
                  class="text-white opacity-0 group-data-selected/option:opacity-100"
                />
              </span>
              <span class="truncate">{{ option.label }}</span>
            </div>
          }
        </div>
      </div>
    </section>
  }
</div>
