<!-- The panel carries the sheet's width (`max-w-sm`) and the sheet fills it, so no panel shows
     beside it and its scrollbar doesn't push the sheet sideways. -->
<app-dialog position="right" ariaLabel="Course filters" panelClass="p-0 max-w-sm">
  <div class="flex flex-col h-full w-full">
    <header
      class="flex items-center justify-between px-4 py-3 border-b border-border/40 sticky top-0 bg-card z-10"
    >
      <h2 class="text-base font-semibold">Filters</h2>
      <button
        app-button
        type="button"
        variant="close"
        size="icon"
        aria-label="Close filters"
        (click)="close()"
      ></button>
    </header>

    <div class="flex-1 overflow-y-auto px-4 py-4">
      <app-course-filters
        [groups]="data.groups()"
        [selection]="data.selection()"
        (selectionChange)="onSelectionChange($event)"
        (clear)="onClear()"
      />
    </div>

    <footer class="sticky bottom-0 bg-card border-t border-border/40 p-3">
      <button
        type="button"
        class="w-full h-11 rounded-md bg-primary text-white font-semibold transition-colors hover:bg-primary/90"
        (click)="close()"
      >
        Done
      </button>
    </footer>
  </div>
</app-dialog>
