<div class="flex flex-col h-full w-screen max-w-sm">
  <header
    class="flex items-center justify-between px-4 py-3 border-b border-border/40 sticky top-0 bg-card z-10"
  >
    <h2 class="text-base font-semibold">Filters</h2>
    <button
      type="button"
      aria-label="Close filters"
      (click)="close()"
      class="size-8 inline-flex items-center justify-center rounded-md hover:bg-secondary/40 outline-none focus-visible:ring-2 focus-visible:ring-accent"
    >
      <ng-icon name="heroXMark" size="18" />
    </button>
  </header>

  <div class="flex-1 overflow-y-auto px-4 py-4">
    <app-course-filters
      [groups]="data.groups()"
      [selection]="data.selection()"
      (selectionChange)="onSelectionChange($event)"
      (clear)="onClear()"
    />
  </div>

  <footer class="sticky bottom-0 bg-card border-t border-border/40 p-3">
    <button
      type="button"
      class="w-full h-11 rounded-md bg-primary text-white font-semibold transition-colors hover:bg-primary/90"
      (click)="close()"
    >
      Done
    </button>
  </footer>
</div>
