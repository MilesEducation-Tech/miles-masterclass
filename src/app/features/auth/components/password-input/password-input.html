<!-- `[direction:ltr]` and `rtl:text-right` repeat the global rule for `type="password"` (styles.css),
     which stops applying while the password is shown as text. -->
<input
  app-input
  [id]="inputId()"
  [type]="visible() ? 'text' : 'password'"
  [formField]="field()"
  [attr.autocomplete]="autocomplete()"
  [placeholder]="placeholder()"
  spellcheck="false"
  autocapitalize="off"
  class="pe-12 [direction:ltr] rtl:text-right"
/>
<button
  app-button
  type="button"
  variant="ghost"
  size="icon"
  class="absolute end-0 top-0 text-muted-foreground data-hover:bg-transparent data-hover:text-foreground"
  [attr.aria-controls]="inputId()"
  [attr.aria-pressed]="visible()"
  [attr.aria-label]="(visible() ? 'auth.password.hide' : 'auth.password.show') | transloco"
  (click)="visible.set(!visible())"
>
  <ng-icon [name]="visible() ? 'heroEyeSlash' : 'heroEye'" class="text-lg" aria-hidden="true" />
</button>
