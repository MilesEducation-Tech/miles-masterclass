<div class="flex flex-col px-8 py-4 h-screen w-full">
  <ng-icon [svg]="icons().logo" class="w-24! h-10! z-10" />
  <div
    class="absolute inset-0 w-full h-full object-cover z-0 select-none pointer-events-none opacity-70"
  >
    <img
      [ngSrc]="S3_BUCKET_URL + 'static-assests/web-app/payment/plab-bg.webp'"
      alt="Background"
      class="w-full h-full object-cover"
      fill
    />
  </div>
  <!-- Scrim: lifts contrast of the logo / "Back to Home" / card over the busy bg. -->
  <div class="absolute inset-0 z-0 bg-black/40 pointer-events-none"></div>
  <div class="max-w-xl m-auto flex flex-col space-y-4 z-10">
    <button
      type="button"
      class="flex space-x-2 items-center cursor-pointer w-max bg-transparent border-0 p-0 text-left"
      (click)="handleBackOrLogout()"
    >
      <ng-icon [svg]="icons().faSolidAngleLeft" class="w-5! h-5!" />
      <p class="text-white">{{ buttonLabel() }}</p>
    </button>
    <div class="auth-card max-h-[80vh] overflow-auto">
      <router-outlet />
    </div>
  </div>
</div>
