<section
  class="flex flex-col gap-6 rounded-2xl border border-border/50 bg-muted/50 p-6 md:flex-row md:items-start md:justify-between md:p-8"
  aria-labelledby="cpe-portfolio-credits"
>
  <div class="min-w-0">
    @if (isLoading()) {
      <div class="h-9 w-48 animate-pulse rounded bg-secondary"></div>
      <div class="mt-3 h-3 w-80 max-w-full animate-pulse rounded bg-secondary"></div>
    } @else {
      <p id="cpe-portfolio-credits" class="flex items-baseline gap-2">
        <span class="text-4xl font-extrabold text-accent">
          {{ creditsEarned() | number: '1.0-2' }}
        </span>
        <span class="text-lg font-bold text-white">Credits Earned</span>
      </p>
      <p class="mt-2 max-w-lg text-sm text-muted-foreground">{{ blurb() }}</p>
    }
  </div>

  <div class="flex shrink-0 flex-col gap-3 md:items-end">
    <app-button class="md:w-72" variant="primary" (clicked)="viewCompliance.emit()">
      View Compliance
    </app-button>

    <div class="flex flex-wrap gap-3">
      <app-button variant="outline" class="gap-2 text-white" (clicked)="downloadAll.emit()">
        <ng-icon name="lucideDownload" size="16" aria-hidden="true" />
        All Certificate
      </app-button>
      <app-button variant="outline" class="gap-2 text-white" (clicked)="downloadNasba.emit()">
        <ng-icon name="lucideDownload" size="16" aria-hidden="true" />
        Nasba Template
      </app-button>
    </div>
  </div>
</section>
