<a [routerLink]="link()" [class]="cardClass()">
  @if (iconUrl(); as src) {
    <img
      [ngSrc]="src"
      alt=""
      width="72"
      height="72"
      draggable="false"
      class="size-18 shrink-0 rounded-full object-cover"
    />
  } @else {
    <span class="size-18 shrink-0 rounded-full bg-secondary" aria-hidden="true"></span>
  }

  <span class="min-w-0 flex-1">
    <!-- The bar is a background on the TEXT, not a box under it, so it hugs the words and
         `box-decoration-clone` carries it onto a wrapped line. Same classes as the chapter
         lists' title underline; only the group name differs, because this one answers to
         hovering the card rather than the title. -->
    <span class="line-clamp-1 text-base font-semibold text-white">
      <span
        class="box-decoration-clone bg-linear-to-r from-accent to-accent bg-size-[0%_3px] bg-bottom-left bg-no-repeat transition-all duration-500 ease-out group-hover/card:bg-size-[100%_3px] rtl:bg-bottom-right"
      >
        {{ badge().badge_name }}
      </span>
    </span>

    @if (badge().subtitle; as subtitle) {
      <span class="mt-1 line-clamp-1 text-sm text-muted-foreground">{{ subtitle }}</span>
    }

    <span class="mt-3 flex flex-wrap items-center gap-2">
      <span
        class="rounded-md bg-accent/15 px-2.5 py-1 text-xs font-semibold whitespace-nowrap text-accent"
      >
        {{ credits() }}
      </span>
      <span
        class="rounded-md bg-secondary/70 px-2.5 py-1 text-xs whitespace-nowrap text-muted-foreground"
      >
        {{ badge().cta.label }}
      </span>
    </span>
  </span>
</a>
