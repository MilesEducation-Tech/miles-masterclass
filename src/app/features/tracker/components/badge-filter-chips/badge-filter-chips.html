<div class="flex flex-wrap items-center gap-3" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.label) {
    <button
      type="button"
      [class]="chipClass(option.value === value())"
      [attr.aria-pressed]="option.value === value()"
      (click)="onSelect(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
