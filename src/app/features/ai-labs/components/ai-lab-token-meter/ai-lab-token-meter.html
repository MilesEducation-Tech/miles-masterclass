<!-- Floating, on every surface that shows it.
     Why not in flow: on the landing page the only sensible slot is the hero, and `.ai-reveal-hero`
     is an `overflow:hidden`, absolutely-positioned overlay pinned to 100vh — a card added there
     grows upward and collides with the copy above it on short screens.
     Why bottom-start: the bottom-end corner already belongs to the utils icon cluster
     (`FooterOverlay`, z-51), which is not route-gated and so is present here too. Logical
     properties, so it mirrors under RTL instead of landing on top of that cluster. -->
@if (balance(); as tokens) {
  <div
    class="fixed start-4 z-50 bottom-[calc(1rem+env(safe-area-inset-bottom))] sm:start-6 sm:bottom-[calc(1.5rem+env(safe-area-inset-bottom))]"
  >
    <div
      class="w-60 max-w-[calc(100vw-6rem)] rounded-2xl border border-border bg-card/95 p-3 shadow-xl backdrop-blur-sm"
    >
      <div class="flex items-baseline justify-between gap-2">
        <p class="truncate text-[12px] font-semibold text-foreground">
          @if (tokens.locked) {
            Paused &middot; credits used up
          } @else {
            {{ tokens.remaining | number: '1.0-2' }} credits left
          }
        </p>
        @if (!tokens.pending_request) {
          <button
            app-button
            type="button"
            class="shrink-0 text-[11px] font-semibold"
            variant="link"
            size="sm"
            [disabled]="submitting()"
            (click)="topUp.emit()"
          >
            {{ submitting() ? 'Requesting…' : 'Top up' }}
          </button>
        }
      </div>

      <app-progress
        class="mt-1.5 block"
        size="sm"
        [value]="usedPercent()"
        [variant]="meterVariant()"
        [ariaLabel]="tokens.used + ' of ' + tokens.cap + ' AI Lab credits used'"
      />

      @if (tokens.pending_request; as pending) {
        <p class="mt-1.5 text-[10.5px] text-muted-foreground" role="status" aria-live="polite">
          +{{ pending.credits_requested | number }} requested — pending
        </p>
      }
    </div>
  </div>
}
