<a
  [routerLink]="['/blog', post().slug]"
  class="group flex flex-col gap-4 border-b border-border py-6 sm:flex-row sm:gap-6"
>
  <div class="relative aspect-[16/10] w-full shrink-0 overflow-hidden rounded-xl bg-muted sm:w-56">
    @if (post().featuredImage) {
      <img
        [src]="post().featuredImage"
        [alt]="post().featuredImageAlt"
        loading="lazy"
        decoding="async"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      />
    }
  </div>

  <div class="flex flex-1 flex-col gap-2">
    <div class="flex items-center gap-2 text-[11px] text-muted-foreground">
      <span>{{ post().displayDate }}</span>
      <span aria-hidden="true">|</span>
      <span>{{ post().readingMinutes }} mins Read</span>
    </div>

    @if (post().categories.length) {
      <span class="text-xs font-medium text-accent">{{ post().categories[0].name }}</span>
    }

    <h3
      class="line-clamp-2 text-base font-semibold leading-snug text-foreground transition-colors group-hover:text-accent md:text-lg"
    >
      {{ post().title }}
    </h3>

    <p class="line-clamp-2 text-sm leading-relaxed text-muted-foreground">{{ post().excerpt }}</p>

    <div class="mt-1 flex items-center gap-2">
      @if (post().authorAvatar) {
        <img
          [src]="post().authorAvatar"
          [alt]="post().author"
          class="h-6 w-6 rounded-full object-cover"
        />
      } @else {
        <span
          class="flex h-6 w-6 items-center justify-center rounded-full bg-accent/20 text-[10px] font-semibold text-accent"
        >
          {{ post().author.charAt(0) }}
        </span>
      }
      <span class="text-xs text-foreground">{{ post().author }}</span>
    </div>
  </div>
</a>
