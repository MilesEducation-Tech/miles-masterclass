<a [routerLink]="['/blog', post().slug]" class="group flex gap-3">
  <div
    class="relative h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-muted sm:h-[88px] sm:w-[88px]"
  >
    @if (post().featuredImage) {
      <img
        [src]="post().featuredImage"
        [alt]="post().featuredImageAlt"
        loading="lazy"
        decoding="async"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      />
    }
  </div>

  <div class="flex flex-1 flex-col gap-1">
    @if (post().categories.length) {
      <span class="text-[11px] font-medium text-accent">{{ post().categories[0].name }}</span>
    }
    <h4
      class="line-clamp-2 text-sm font-semibold leading-snug text-foreground transition-colors group-hover:text-accent"
    >
      {{ post().title }}
    </h4>
    @if (showExcerpt() && post().excerpt) {
      <p class="line-clamp-2 text-xs leading-relaxed text-muted-foreground">{{ post().excerpt }}</p>
    }
    <div class="mt-0.5 flex items-center gap-2 text-[10px] text-muted-foreground">
      <span>{{ post().displayDate }}</span>
      <span aria-hidden="true">|</span>
      <span>{{ post().readingMinutes }} mins Read</span>
    </div>
  </div>
</a>
