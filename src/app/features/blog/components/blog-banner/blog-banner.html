<div class="relative w-full overflow-hidden" [class]="tall() ? 'min-h-[460px]' : 'min-h-[220px]'">
  @if (images().length) {
    <div class="pointer-events-none absolute inset-0 flex" aria-hidden="true">
      @for (image of images(); track $index) {
        <img [src]="image" alt="" loading="lazy" class="h-full flex-1 object-cover opacity-30" />
      }
    </div>
  }
  <div
    class="absolute inset-0 bg-gradient-to-b from-background/60 via-background/85 to-background"
  ></div>
  <div class="relative z-10">
    <ng-content />
  </div>
</div>
