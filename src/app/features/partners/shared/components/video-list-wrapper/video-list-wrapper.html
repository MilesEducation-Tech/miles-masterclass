<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<div class="w-full relative flex flex-col items-center justify-center">
  <div [class]="aspectContainerClasses()">
    <!-- Bottom-fade so the video edge melts into the page background and the
         overlapping thumbnail strip reads cleanly. Inside the aspect container
         so it stays aligned with the contained width on mobile. -->
    <div
      class="absolute inset-0 bg-linear-to-t from-background to-transparent from-12% to-50% z-10 pointer-events-none"
    ></div>
    <div [class]="videoWrapperClasses()">
      @if (hasMobileVideo()) {
        <!-- Mobile-optimised (portrait) source, hidden at md+. The wrapper div
             owns the responsive hide because `app-video-poster`'s host injects
             `block` which would win over `md:hidden` on the same element. -->
        <div class="md:hidden absolute inset-0">
          <app-video-poster
            [videoSrc]="activeVideo().mobileVideoSrc!"
            [posterSrc]="activeVideo().mobilePosterSrc ?? activeVideo().posterSrc"
            [showControls]="true"
            [controlsPosition]="side() === 'left' ? 'bottom-right' : 'bottom-left'"
          />
        </div>
        <!-- Desktop source, hidden below md. -->
        <div class="max-md:hidden absolute inset-0">
          <app-video-poster
            [videoSrc]="activeVideo().videoSrc"
            [posterSrc]="activeVideo().posterSrc"
            [showControls]="true"
            [controlsPosition]="side() === 'left' ? 'bottom-right' : 'bottom-left'"
          />
        </div>
      } @else {
        <app-video-poster
          [videoSrc]="activeVideo().videoSrc"
          [posterSrc]="activeVideo().posterSrc"
          [showControls]="true"
          [controlsPosition]="side() === 'left' ? 'bottom-right' : 'bottom-left'"
        />
      }
    </div>
    @if (side()) {
      <div [class]="overlayClasses()">
        <ng-content />
      </div>
    }
  </div>
  @if (videoList().length > 1) {
    <div class="flex z-20 gap-4 overflow-x-auto w-full px-2 relative mx-auto justify-center -mt-10">
      @for (video of videoList(); track $index) {
        <div
          class="w-32 h-20 rounded-lg overflow-hidden relative shrink-0 cursor-pointer"
          [class.border-4]="activeVideoIndex() === $index"
          [class.border-blue-500]="activeVideoIndex() === $index"
          (click)="activeVideoIndex.set($index)"
        >
          <img
            [ngSrc]="video.posterSrc"
            alt="Video Thumbnail"
            fill
            class="w-full h-full object-cover"
            draggable="false"
          />
        </div>
      }
    </div>
  }
</div>
