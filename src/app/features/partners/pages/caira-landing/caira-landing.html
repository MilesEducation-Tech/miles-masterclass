<div
  class="flex flex-col justify-end gap-4 text-white pointer-events-auto pb-20 xl:w-4/5 w-full mt-40 lg:hidden"
>
  <app-partner-content-list
    [content]="heroContent"
    containerClass="text-center items-center justify-center"
  />
</div>
<app-video-list-wrapper [videoList]="videoList" side="right">
  <div
    class="flex flex-col justify-end gap-4 text-white pointer-events-auto pb-20 xl:w-4/5 w-full ml-auto max-lg:hidden"
  >
    <app-partner-content-list
      [content]="heroContent"
      containerClass="text-center items-center justify-center"
    />
  </div>
</app-video-list-wrapper>

<div class="flex flex-col space-y-20 items-center relative w-full overflow-hidden z-0">
  <section class="md:w-9/12 w-11/12 mx-auto flex flex-col items-center gap-14">
    <app-partner-content-list [content]="cairaFeaturesHeading" />
    <app-caira-feature-grid [items]="cairaFeatures" />
  </section>

  <section class="md:w-9/12 w-11/12 mx-auto flex flex-col items-center">
    <app-partner-content-list [content]="cairaStepsHeading" />
    <div class="mt-14">
      <app-caira-steps-grid [steps]="cairaSteps" />
    </div>
  </section>
  <section id="content-section" class="flex w-11/12 mx-auto flex-col space-y-10">
    <app-partner-content-list [content]="sampleContent" />
    <app-partnership-content [content]="partnershipContent" />
  </section>
  <app-faq [standalone]="false" />
</div>
