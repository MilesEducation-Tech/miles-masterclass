<app-video-list-wrapper [videoList]="videoList" side="bottom">
  <div
    class="flex max-sm:flex-col sm:items-end items-start sm:justify-between justify-end w-11/12 gap-4 text-white pointer-events-none mx-auto"
  >
    <app-partner-content-list
      [content]="heroContent"
      containerClass="text-left items-start pointer-events-auto"
    />
    <div
      class="flex items-center gap-4 max-sm:gap-2 pl-5 max-sm:pl-3 pr-2 py-2 max-sm:py-1 rounded-full bg-white/15 backdrop-blur-[6.4px] shrink-0 pointer-events-auto"
    >
      <span
        class="text-sm max-sm:text-xs font-semibold tracking-[-0.374px] text-pill-label whitespace-nowrap"
        ><span class="text-[#0680d1]">CPA Canada</span> Members Access</span
      >

      <app-button
        class="bg-pill-cta hover:bg-pill-cta/90 text-white rounded-full font-semibold px-5 max-sm:px-3 max-sm:h-8 max-sm:text-xs"
        variant="ghost"
        (clicked)="scrollTo('cpa-canada-section')"
        >Activate</app-button
      >
    </div>
  </div>
</app-video-list-wrapper>
<div class="flex flex-col space-y-20 items-center relative w-full overflow-hidden z-0">
  <section id="cpa-canada-content-section" class="flex w-11/12 mx-auto flex-col space-y-10">
    <app-partnership-content [content]="partnershipContent" />
  </section>
  <section class="flex w-11/12 mx-auto flex-col space-y-10">
    <app-plan-benefits [planPointers]="planPointers" iconClass="size-6!">
      <ng-container slot="heading"
        >Exclusive Benefits for Members of
        <span class="text-[#0064A7]">CPA Canada</span></ng-container
      >
      <h3 class="text-gray-400 md:text-lg text-sm">
        This isn't just more content to consume. This is how you stay relevant in an AI-driven
        market.
      </h3>
      <app-button
        variant="ghost"
        class="text-black bg-white rounded-full px-5 w-fit min-w-56 md:text-base text-sm"
        (clicked)="scrollTo('cpa-canada-section')"
      >
        Schedule Discovery Call
      </app-button>
    </app-plan-benefits>
  </section>
  <section class="flex w-11/12 mx-auto flex-col space-y-10">
    <app-partner-content-list [content]="offeringContent" />
    <app-offerings [offerings]="offerings"></app-offerings>
  </section>
  <section
    id="cpa-canada-section"
    class="flex w-11/12 mx-auto flex-col space-y-10 scroll-mt-24 mb-32"
  >
    <app-partner-content-list [content]="footerContent" />
    <div class="w-full mx-auto flex justify-center">
      <app-enquiry-form
        [enquiry_type]="'Canada CPA'"
        keepUpdatedLabel="Keep me up to date on Miles Masterclass offerings."
      />
    </div>
  </section>
</div>
