<app-dialog-shell maxWidth="100%" ariaLabel="Choose a CPE mode" [dismissible]="false">
  <div
    class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] rounded-lg shadow-2xl flex flex-col md:w-[50svw] w-[95svw] mx-auto md:overflow-hidden"
  >
    <!-- Header -->
    <div
      class="flex justify-between items-center px-6 md:py-4 py-2 bg-[#162033] border-b border-gray-700"
    >
      <div class="flex items-center gap-3">
        <!-- <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div> -->
        <h1 id="modal-title" class="text-white md:text-xl text-lg font-semibold capitalize">
          Choose Your {{ data.type }} Mode
        </h1>
      </div>
      <app-button variant="close" size="sm" (clicked)="close()" />
    </div>

    <!-- Content -->
    <div class="flex flex-col p-6 space-y-6 max-h-[80dvh] overflow-y-auto">
      <!-- <p id="modal-description" class="text-gray-300 text-center text-sm">
      Select how you'd like to experience this course. You can always change
      your mode later.
    </p> -->

      <div class="space-y-4">
        <!-- Preview Mode Option (selectedMode = false) -->
        <label
          for="preview-mode"
          class="group relative block cursor-pointer rounded-lg border-2 transition-all duration-300 p-5"
          [class.border-blue-500]="selectedMode() === false"
          [class.bg-blue-500/10]="selectedMode() === false"
          [class.border-gray-600]="selectedMode() !== false"
          [class.hover:border-gray-500]="selectedMode() !== false"
          [class.bg-gray-800/50]="selectedMode() !== false"
          [class.hover:bg-gray-700/50]="selectedMode() !== false"
        >
          <div class="flex gap-4">
            <div class="shrink-0 mt-1">
              <input
                autocomplete="off"
                type="radio"
                name="mode"
                id="preview-mode"
                class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600"
                [checked]="selectedMode() === false"
                (change)="selectedMode.set(false)"
              />
            </div>
            <div class="flex-1 space-y-2">
              <div class="flex items-center gap-3">
                <h3 class="text-white font-semibold text-lg">🎭 Preview Mode</h3>

                <span
                  class="px-2 py-1 text-green-100 text-xs font-medium rounded-full bg-green-600"
                >
                  FREE
                </span>
              </div>
              <p class="text-gray-300 md:text-sm text-xs leading-relaxed">
                Preview Mode lets you go at your own pace, no strings attached. No certificate here,
                but if you change your mind and want that CPE cert, you can switch—just know you’ll
                have to start from scratch!
              </p>
              <div class="flex flex-wrap gap-2 mt-3">
                <span
                  class="inline-flex items-center px-2 py-1 bg-gray-700 text-gray-300 md:text-xs text-[10px] rounded"
                >
                  ✓ Self-paced learning
                </span>
                <span
                  class="inline-flex items-center px-2 py-1 bg-gray-700 text-gray-300 md:text-xs text-[10px] rounded"
                >
                  ✓ No time restrictions
                </span>
                <span
                  class="inline-flex items-center px-2 py-1 bg-gray-700 text-gray-300 md:text-xs text-[10px] rounded"
                >
                  ✗ No certificate
                </span>
              </div>
            </div>
          </div>
        </label>

        <!-- CPE Mode Option (selectedMode = true) -->
        <label
          for="cpe-mode"
          class="group relative block cursor-pointer rounded-lg border-2 transition-all duration-300 p-5"
          [class.border-blue-500]="selectedMode() === true"
          [class.bg-blue-500/10]="selectedMode() === true"
          [class.border-gray-600]="selectedMode() !== true"
          [class.hover:border-gray-500]="selectedMode() !== true"
          [class.bg-gray-800/50]="selectedMode() !== true"
          [class.hover:bg-gray-700/50]="selectedMode() !== true"
        >
          <div class="flex gap-4">
            <div class="shrink-0 mt-1">
              <input
                autocomplete="off"
                type="radio"
                name="mode"
                id="cpe-mode"
                class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600"
                [checked]="selectedMode() === true"
                (change)="selectedMode.set(true)"
              />
            </div>
            <div class="flex-1 space-y-2">
              <div class="flex items-center gap-3">
                <h3 class="text-white font-semibold text-lg">🏆 CPE Certification Mode</h3>
              </div>
              <p class="text-gray-300 md:text-sm text-xs leading-relaxed">
                Ready to earn that CPE certificate?
                {{ data.type === 'Podcast' && data.format === 'audio' ? 'listen' : 'watch' }} at the
                set speed, tackle quizzes, and ace the final exam. It’s a straight path to
                certification, but hey, it’s an investment in your future!
              </p>
              <div class="flex flex-wrap gap-2 mt-3">
                <span
                  class="inline-flex items-center px-2 py-1 bg-blue-700 text-blue-100 md:text-xs text-[10px] rounded"
                >
                  ✓ CPE Certificate
                </span>
                <span
                  class="inline-flex items-center px-2 py-1 bg-blue-700 text-blue-100 md:text-xs text-[10px] rounded"
                >
                  ✓ Quizzes & Assessments
                </span>
                <span
                  class="inline-flex items-center px-2 py-1 bg-blue-700 text-blue-100 md:text-xs text-[10px] rounded"
                >
                  ✓ Progress tracking
                </span>
              </div>
            </div>
          </div>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-700">
        <app-button variant="secondary" (clicked)="close()"> Cancel </app-button>
        <app-button
          variant="default"
          [disabled]="selectedMode() === null"
          (clicked)="confirmSelection()"
        >
          Continue with
          {{
            selectedMode() === false
              ? 'Preview Mode'
              : selectedMode() === true
                ? 'CPE Mode'
                : 'Selected Mode'
          }}
        </app-button>
      </div>
    </div>
  </div>
</app-dialog-shell>
