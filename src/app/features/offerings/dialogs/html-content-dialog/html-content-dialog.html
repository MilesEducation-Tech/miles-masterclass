<app-dialog [ariaLabel]="data.title" panelClass="p-0 max-w-full">
  <div class="flex flex-col h-[90vh] md:min-w-[50vw] w-[95vw] md:w-auto bg-background">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-border shrink-0">
      <h2 id="html-dialog-title" class="text-lg font-semibold text-foreground truncate pe-4">
        {{ data.title }}
      </h2>
      <button
        app-button
        type="button"
        class="rounded-full"
        size="sm"
        variant="ghost"
        size="icon"
        aria-label="Close"
        (click)="close()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <!-- Content -->
    <div class="min-h-0 flex-1 overflow-y-auto px-6 py-4">
      <!-- API/CMS HTML, bound as-is so Angular sanitizes it (no bypass). The sanitizer drops the
           CMS's inline `style` attributes, so the look they set (14px / 1.6 body, 24px headings,
           20px gaps, the closing logo divider) is restored here. -->
      <div
        class="text-sm leading-[1.6] text-white [&_h3]:mb-5 [&_h3]:text-2xl [&_h3]:leading-[1.2] [&_hr]:my-5 [&_hr]:h-px [&_hr]:border-0 [&_hr]:bg-white [&_img]:mx-auto [&_img]:h-auto [&_img]:w-37.5 [&_p]:mb-5"
        [innerHTML]="data.htmlContent"
      ></div>
    </div>
  </div>
</app-dialog>
