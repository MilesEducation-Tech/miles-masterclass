<div
  class="lg:w-9/12 sm:w-10/12 w-full mx-auto overflow-hidden flex flex-col gap-6 rounded-2xl bg-[#18181b] p-6 text-white border border-[#27272a]"
>
  <h2 class="text-2xl font-bold">Class Resources</h2>

  <div class="flex flex-col gap-3">
    @for (resource of resources(); track resource.label) {
      @let isDownloading =
        resource.action === 'exercise' && masterclassFacade.downloadingExerciseFiles();
      <button
        (click)="handleResourceClick(resource)"
        [disabled]="isDownloading"
        class="group flex items-center justify-between rounded-lg bg-[#27272a] p-4 transition-colors hover:bg-[#3f3f46] disabled:cursor-not-allowed disabled:opacity-60"
      >
        <div class="flex items-center gap-3">
          <ng-icon [name]="resource.icon" class="text-xl text-white"></ng-icon>
          <span class="font-medium text-white">{{ resource.label }}</span>
        </div>

        @if (resource.isDownload) {
          @if (isDownloading) {
            <span
              class="size-5 animate-spin rounded-full border-2 border-[#a1a1aa] border-t-transparent"
            ></span>
          } @else {
            <ng-icon
              name="lucideDownload"
              class="text-xl text-[#a1a1aa] transition-colors group-hover:text-white"
            ></ng-icon>
          }
        }
      </button>
    }
  </div>
</div>
