<div class="flex flex-col h-full bg-[#272D37] text-white p-4 md:p-8 overflow-y-auto space-y-4">
  <div class="flex items-center w-full rounded-lg overflow-hidden h-28 space-x-4 p-4 bg-card">
    @if (current().chapter_thumbnail) {
      <div class="h-full aspect-video relative">
        <img [ngSrc]="current().chapter_thumbnail" [alt]="current().chapter_name" fill />
      </div>
    }
    <div class="flex flex-col justify-center">
      <h2 class="title">{{ current().chapter_name }}</h2>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <app-button
        variant="link"
        class="underline text-accent"
        (clicked)="togglePreviewMode.emit('video')"
        >Watch Again</app-button
      >
    </div>
  </div>
  <!-- Progress -->
  <div class="opacity-60 text-sm font-medium">
    {{ progressText() }}
  </div>

  <!-- Question -->
  <h2 class="text-xl md:text-2xl font-semibold">
    {{ currentQuestion().question }}
  </h2>

  <!-- Options -->
  <div class="flex flex-col gap-2">
    @for (option of ['a', 'b', 'c', 'd']; track option) {
      @if (getOptionText(currentQuestion(), option)) {
        <button
          class="flex items-start gap-4 p-3 rounded-lg border text-left transition-all"
          [class.border-quiz-line]="selectedOption() !== option"
          [class.bg-transparent]="selectedOption() !== option"
          [class.border-blue-500]="selectedOption() === option && !isSubmitted()"
          [class.bg-quiz-selected]="selectedOption() === option"
          [disabled]="isSubmitted()"
          (click)="selectOption(option)"
        >
          <div class="flex flex-col w-full gap-2">
            <div class="flex items-start gap-2">
              <!-- Radio Indicator -->
              <div
                class="relative w-5 h-5 rounded-full border-2 mt-0.5 shrink-0"
                [class.border-gray-500]="selectedOption() !== option"
                [class.border-blue-500]="selectedOption() === option"
              >
                @if (selectedOption() === option) {
                  <div class="absolute inset-1 rounded-full bg-blue-500"></div>
                }
              </div>

              <span class="text-base leading-relaxed text-gray-200">
                {{ getOptionText(currentQuestion(), option) }}
              </span>
            </div>

            <!-- Description (Visible on submission) -->
            @if (isSubmitted() && getDescription(currentQuestion(), option)) {
              <div class="ml-9 text-sm text-gray-400 border-t border-gray-700 pt-2 mt-1">
                <span
                  class="font-semibold text-xs uppercase tracking-wider mb-1 block"
                  [class.text-green-400]="option === currentQuestion().correct_option"
                  [class.text-red-400]="option !== currentQuestion().correct_option"
                >
                  {{
                    option === currentQuestion().correct_option ? 'Correct Answer' : 'Explanation'
                  }}
                </span>
                {{ getDescription(currentQuestion(), option) }}
              </div>
            }
          </div>
        </button>
      }
    }
  </div>

  <!-- Footer Actions -->
  <div class="mt-auto flex justify-between items-center pt-6 border-t border-quiz-line">
    <button
      class="px-6 py-2 rounded bg-quiz-line text-white hover:bg-quiz-line-hover disabled:opacity-50"
      [disabled]="currentQuestionIndex() === 0"
      (click)="prevQuestion()"
    >
      BACK
    </button>

    @if (isSubmitted()) {
      <button
        class="relative min-w-44 text-[#161E25] font-semibold py-3 px-6 rounded-lg text-sm md:text-base hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 overflow-hidden"
        [class]="isLastQuestion() ? 'bg-gray-400' : 'bg-gray-200'"
        [disabled]="!selectedOption() || !isSubmitted()"
        (click)="nextQuestion()"
      >
        <span class="relative z-10 font-bold">
          @if (isLastQuestion()) {
            @if (isLastChapter()) {
              START FINAL ASSESSMENT
            } @else {
              PROCEED TO NEXT
            }
          } @else {
            NEXT
          }
        </span>
        @if (isLastQuestion() && autoNavTimer() !== null) {
          <div
            class="absolute top-0 bottom-0 left-0 h-full bg-white transition-all duration-1000 ease-linear z-0"
            [style.width.%]="(10 - autoNavTimer()!) * 10"
          ></div>
        }
      </button>
    }
  </div>
</div>
