<!-- The panel's frame (header, progress, question, options, footer) with nothing bound. -->
<div class="flex flex-col h-full bg-[#272D37] text-white p-4 md:p-8 space-y-4" aria-hidden="true">
  <div class="h-28 rounded-lg bg-card"></div>
  <div class="h-4 w-32 rounded bg-quiz-line"></div>
  <div class="h-7 w-3/4 rounded bg-quiz-line"></div>
  <div class="flex flex-col gap-2">
    @for (row of [1, 2, 3, 4]; track row) {
      <div class="h-12 rounded-lg border border-quiz-line"></div>
    }
  </div>
  <div class="mt-auto pt-6 border-t border-quiz-line"></div>
</div>
