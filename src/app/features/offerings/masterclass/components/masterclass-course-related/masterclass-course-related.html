<div class="container mx-auto flex flex-col gap-10">
  @for (rail of rails(); track rail.id) {
    <app-carousel
      [cards]="rail.courses"
      [heading]="{ text: rail.heading, subText: '' }"
      [swiperConfig]="swiperConfig"
      skeletonClass="aspect-video"
    >
      <ng-template let-card>
        <!-- The shared `app-horizontal` design (its course branch), without Trailer and badges.
             The image link is labelled, so the image itself is decorative (alt=""). -->
        <div class="flex flex-col space-y-2 group/card">
          <a
            class="w-full aspect-video overflow-hidden rounded-lg flex flex-col relative bg-muted"
            [routerLink]="['../..', card.id, card.slug]"
            [attr.aria-label]="card.name"
          >
            <div class="relative inset-0 w-full h-full z-0">
              @if (card.thumbnail_url) {
                <img
                  [ngSrc]="card.thumbnail_url"
                  alt=""
                  class="object-cover w-full h-full group-hover/card:scale-105 transition-transform duration-300 relative z-0"
                  fill
                  draggable="false"
                />
              }
            </div>
            <div
              class="absolute inset-0 w-full h-full bg-linear-to-t from-black to-50% to-transparent z-10 group-hover/card:opacity-100 transition-opacity duration-300 opacity-0"
            ></div>
          </a>
          <a
            class="flex flex-col space-y-1"
            [routerLink]="['../..', card.id, card.slug]"
            [attr.aria-label]="card.name + ' details'"
          >
            <h3 class="text-white text-sm font-medium line-clamp-2">
              {{ card.mini_description }}
            </h3>
            <div class="flex items-center justify-between gap-2 min-w-0 min-h-10">
              <app-categories-list
                class="text-muted-foreground text-sm min-w-0 flex-1 truncate"
                [items]="card.field_of_study"
              />
            </div>
          </a>
          <div class="flex items-center justify-end">
            <button
              app-button
              type="button"
              class="text-accent hover:bg-transparent border-accent rounded-md cursor-default"
              variant="outline"
            >
              {{ card.total_cpe_credits }} CPE
            </button>
          </div>
        </div>
      </ng-template>
    </app-carousel>
  }
</div>
