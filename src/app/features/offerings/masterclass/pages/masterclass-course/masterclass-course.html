<div class="w-full overflow-hidden">
  @if (facade.course(); as course) {
    <app-masterclass-course-hero
      [course]="course"
      (watch)="facade.watch()"
      (trailer)="facade.openTrailer()"
      (sample)="facade.openSample()"
      (share)="facade.share()"
    />
  } @else if (facade.notFound()) {
    <div role="alert" class="container mx-auto flex flex-col items-center gap-4 py-24 text-center">
      <p class="text-muted-foreground">We couldn't find this masterclass.</p>
      <a routerLink="../.." class="text-accent underline underline-offset-4"
        >Browse masterclasses</a
      >
    </div>
  } @else if (facade.loadError()) {
    <div role="alert" class="container mx-auto flex flex-col items-center gap-4 py-24 text-center">
      <p class="text-muted-foreground">We couldn't load this masterclass. Please try again.</p>
      <button app-button type="button" variant="outline" (click)="facade.reload()">
        Try again
      </button>
    </div>
  } @else {
    <app-masterclass-course-hero-skeleton />
  }

  <!-- Section Navigation (shows here until it reaches header trigger point, then shows in header) -->
  <div class="w-full h-20 backdrop-blur-md">
    <div class="container mx-auto py-3">
      <app-section-nav [items]="sectionNavItems()" mode="inline" />
    </div>
  </div>

  <!-- About Section -->
  @if (facade.course(); as course) {
    <section id="about" class="container mx-auto md:py-10 py-5 scroll-mt-32">
      <app-masterclass-course-about [course]="course" />
    </section>
  }

  <!-- FAQ Section -->
  <section id="faq" class="md:py-10 py-5 scroll-mt-32">
    <app-faq [standalone]="false" />
  </section>
</div>
