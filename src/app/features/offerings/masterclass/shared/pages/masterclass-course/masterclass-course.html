<div class="w-full overflow-hidden">
  @if (masterclassService.courseDetails() !== null) {
    <app-masterclass-course-hero [courseId]="courseId()" [courseTitle]="courseTitle()" />
  } @else {
    <app-masterclass-course-hero-skeleton />
  }

  <!-- Section Navigation (shows here until it reaches header trigger point, then shows in header) -->
  <div class="w-full h-20 backdrop-blur-md">
    <div class="container mx-auto py-3">
      <app-section-nav [items]="sectionNavItems()" mode="inline" />
    </div>
  </div>

  <!-- Masterclass Section (Chapters) -->
  @if (masterclassService.courseChapters().length > 0) {
    <section id="masterclass" class="container mx-auto md:py-10 py-5 scroll-mt-32">
      <app-course-chapter-list courseType="masterclass" />
    </section>
  }

  <!-- Resource Section -->
  <section id="resource" class="container mx-auto md:py-10 py-5 scroll-mt-32">
    <app-course-resources courseType="masterclass" />
  </section>

  <!-- About Section -->
  @if (masterclassService.courseDetails() !== null) {
    <section id="about" class="container mx-auto md:py-10 py-5 scroll-mt-32">
      <app-course-about [card]="masterclassService.courseDetails()!" />
    </section>
  }

  <!-- Related Section -->
  @if (masterclassService.courseDetails(); as course) {
    <section id="related" class="md:py-10 py-5 scroll-mt-32">
      <app-course-related-section
        [courseId]="course.id"
        courseType="masterclass"
        [instructors]="course.instructor_details"
      />
    </section>
  }

  <!-- FAQ Section -->
  <section id="faq" class="md:py-10 py-5 scroll-mt-32">
    <app-faq [standalone]="false" />
  </section>
</div>
