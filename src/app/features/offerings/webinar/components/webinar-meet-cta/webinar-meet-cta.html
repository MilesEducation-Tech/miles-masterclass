<section class="mx-auto w-full max-w-360">
  <!-- The artwork bleeds above and below the panel, so the panel cannot clip
       and needs vertical room reserved around it on the breakpoints where the
       artwork shows. -->
  <div
    class="relative rounded-2xl bg-muted px-6 py-10 sm:px-10 md:rounded-3xl lg:py-12 lg:pr-[46%]"
  >
    <div class="flex max-w-xl flex-col items-start gap-4 lg:gap-6">
      <h2 class="text-2xl font-bold sm:text-3xl lg:text-4xl">{{ heading() }}</h2>
      <p class="text-sm leading-relaxed text-pretty text-muted-foreground lg:text-base">
        {{ description() }}
      </p>
      <app-button class="mt-2 w-full rounded-xl sm:w-auto" size="lg" (clicked)="onBook()">
        {{ ctaLabel() }}
      </app-button>
    </div>

    <!-- Hidden below `lg`: the design drops the artwork entirely on phones
         rather than shrinking it, and at tablet widths it would collide with
         the copy column. -->
    <img
      src="/features/webinar/gmeet-scheduling.webp"
      alt=""
      aria-hidden="true"
      class="pointer-events-none absolute right-2 -bottom-2 hidden w-[44%] max-w-2xl select-none lg:block xl:right-6"
      loading="lazy"
      decoding="async"
      width="1158"
      height="782"
    />
  </div>
</section>
