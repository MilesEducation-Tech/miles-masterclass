<div
  class="w-full max-w-[720px] rounded-2xl bg-[#222222] p-6 shadow-2xl sm:p-8"
  role="dialog"
  [attr.aria-label]="copy().title"
>
  <h2 class="text-xl font-bold text-white sm:text-2xl">{{ copy().title }}</h2>

  <hr class="my-4 border-white/10" />

  <p class="text-sm leading-relaxed text-neutral-400 sm:text-base">
    {{ copy().bodyPrefix }}<span class="font-medium text-white">{{ webinarTitle() }}</span
    >{{ copy().bodySuffix }}
  </p>

  <div class="mt-6 flex items-center gap-4">
    <button
      type="button"
      class="cursor-pointer rounded-md px-5 py-2.5 text-sm font-semibold transition-colors"
      [class]="copy().ctaClass"
      (click)="onPrimary()"
    >
      {{ copy().ctaLabel }}
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-md px-3 py-2.5 text-sm font-medium text-white transition-colors hover:text-neutral-300"
      (click)="onCancel()"
    >
      Cancel
    </button>
  </div>
</div>
