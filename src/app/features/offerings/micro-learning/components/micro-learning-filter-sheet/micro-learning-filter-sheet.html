<app-dialog-shell [ariaLabel]="'Filter by ' + data.title.toLowerCase()">
  <section
    class="w-full sm:w-[420px] bg-secondary/95 backdrop-blur-md text-foreground rounded-2xl p-5 space-y-5"
  >
    <header class="flex items-center justify-between">
      <h2 id="filter-sheet-title" class="text-sm text-muted-foreground uppercase tracking-wider">
        {{ data.title }}
      </h2>
    </header>

    <div class="flex flex-wrap gap-2 items-center">
      @for (option of visibleOptions(); track option.id) {
        <button
          type="button"
          [class]="
            cn(
              'px-3 py-1.5 rounded-full text-xs font-medium border transition-colors cursor-pointer',
              option.selected
                ? 'bg-accent text-white border-accent'
                : 'bg-background/40 text-foreground border-border/40 hover:bg-background/70'
            )
          "
          [attr.aria-pressed]="option.selected"
          (click)="toggle(option.id)"
        >
          {{ option.label }}
        </button>
      }
      @if (hasMore()) {
        <button
          type="button"
          class="text-xs font-medium text-accent hover:underline cursor-pointer"
          (click)="showMore()"
        >
          Show more
        </button>
      }
    </div>

    <footer class="flex items-center justify-end gap-3 pt-2">
      <app-button variant="secondary" (clicked)="back()">Back</app-button>
      <app-button (clicked)="apply()">Apply</app-button>
    </footer>
  </section>
</app-dialog-shell>
