<app-dialog position="right" ariaLabel="About this reel" panelClass="p-0">
  <section
    class="w-full xl:w-[50vw] sm:w-[80vw] h-full bg-secondary/95 backdrop-blur-md text-foreground overflow-y-auto"
  >
    <header
      class="flex items-center justify-between px-6 py-4 border-b border-border/30 sticky top-0 bg-secondary/95 backdrop-blur-md z-10"
    >
      <div class="flex items-center gap-2">
        <ng-icon name="matInfoRound" size="20" aria-hidden="true" />
        <h2 id="about-panel-title" class="text-lg font-semibold">About</h2>
      </div>
      <button
        app-button
        type="button"
        variant="close"
        size="icon"
        aria-label="Close"
        (click)="close()"
      ></button>
    </header>

    <div class="px-6">
      @if (facade.course()) {
        <!-- It injects this panel's own CourseDetailFacade, so it shows this reel. -->
        <app-masterclass-course-about />
      } @else if (facade.notFound()) {
        <p role="alert" class="py-10 text-center text-muted-foreground">
          This reel is no longer available.
        </p>
      } @else if (facade.loadError()) {
        <div role="alert" class="flex flex-col items-center gap-4 py-10 text-center">
          <p class="text-muted-foreground">
            We couldn't load the reel's details. Please try again.
          </p>
          <button app-button type="button" variant="outline" (click)="facade.reload()">
            Try again
          </button>
        </div>
      } @else {
        <div class="flex flex-col gap-6 py-10 animate-pulse" aria-hidden="true">
          <div class="h-8 w-1/3 rounded-lg bg-muted"></div>
          <div class="h-24 w-full rounded-lg bg-muted"></div>
          <div class="h-64 w-full rounded-lg bg-muted"></div>
        </div>
      }
    </div>
  </section>
</app-dialog>
