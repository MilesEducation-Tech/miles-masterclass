@let r = item();
<div
  class="relative overflow-hidden rounded-xl text-foreground shadow-[0_20px_56px_-24px_rgb(0_0_0/0.55)] h-full"
  [class.bg-card]="variant() === 'thumbnail'"
  [class.bg-accent]="variant() === 'concept'"
  [class.text-accent-foreground]="variant() === 'concept'"
  [class.bg-foreground]="variant() === 'quote'"
  [class.text-background]="variant() === 'quote'"
>
  @switch (variant()) {
    @case ('thumbnail') {
      @if (r.thumbnail) {
        <img
          [ngSrc]="r.thumbnail"
          alt=""
          fill
          sizes="(max-width: 640px) 80vw, 25vw"
          class="object-cover"
        />
      } @else {
        <div
          class="absolute inset-0 bg-[radial-gradient(120%_70%_at_50%_30%,rgb(var(--accent-rgb)/0.2),transparent_60%),linear-gradient(180deg,var(--card)_0%,var(--background)_100%)]"
        ></div>
        <div
          class="absolute inset-0 bg-[repeating-linear-gradient(135deg,rgb(255_255_255/0.04)_0_2px,transparent_2px_14px)]"
        ></div>
        <div class="absolute left-1/2 bottom-0 w-[72%] -translate-x-1/2 aspect-3/4">
          <span
            class="absolute left-1/2 top-[18%] aspect-square w-[38%] -translate-x-1/2 rounded-full bg-foreground/15"
          ></span>
          <span
            class="absolute left-1/2 top-[52%] w-[90%] aspect-[1.3/1] -translate-x-1/2 rounded-t-[44%/60%] bg-foreground/10"
          ></span>
        </div>
      }
      <div
        class="absolute inset-x-0 bottom-0 h-1/2 bg-linear-to-t from-black/85 via-black/40 to-transparent"
      ></div>
      <h3
        class="absolute left-3.5 right-3.5 bottom-9 text-[20px] leading-[1.15] font-semibold tracking-[-0.01em] text-white line-clamp-1"
      >
        {{ r.title }}
      </h3>
    }

    @case ('concept') {
      <div class="absolute inset-0 grid place-items-center p-6">
        <p class="text-center font-bold text-[34px] leading-none tracking-[-0.025em] line-clamp-1">
          {{ r.conceptBody }}
        </p>
      </div>
    }

    @case ('quote') {
      <div class="absolute inset-0 grid place-items-center p-6">
        <p
          class="text-center font-semibold font-serif italic text-[22px] leading-snug tracking-[-0.015em] line-clamp-1"
        >
          &ldquo;{{ r.title }}&rdquo;
        </p>
      </div>
    }
  }

  <span
    class="absolute top-3 left-3 line-clamp-1 rounded px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.14em] bg-accent text-accent-foreground"
  >
    {{ r.tag }}
  </span>
  <span
    class="absolute top-3 right-3 line-clamp-1 rounded px-1.5 py-1 text-[10px] font-medium text-white bg-black/55 backdrop-blur-sm"
  >
    {{ r.duration }}
  </span>

  @if (r.caption) {
    <span
      class="absolute left-3 right-3 bottom-3.5 text-[11px] font-medium opacity-70 line-clamp-1"
      [class.text-white]="variant() === 'thumbnail'"
    >
      {{ r.caption }}
    </span>
  }

  <span class="absolute left-3 right-3 bottom-1.5 h-0.5 overflow-hidden rounded-full bg-white/20">
    <span class="block h-full bg-accent" [style.width]="progressWidth()"></span>
  </span>
</div>
