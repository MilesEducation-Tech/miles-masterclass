<ul
  class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4 p-1"
  role="list"
  aria-label="Episodes"
>
  @for (reel of episodes(); track reel.id) {
    <li
      class="rounded-lg"
      [class.ring-2]="reel.id === activeId()"
      [class.ring-accent]="reel.id === activeId()"
    >
      <app-vertical
        [card]="reel"
        type="micro-learning"
        [disableNavigation]="true"
        (cardClicked)="episodeSelected.emit(reel)"
      />
    </li>
  } @empty {
    <li class="col-span-full text-center text-sm text-muted-foreground py-6">
      No episodes available yet.
    </li>
  }
</ul>
