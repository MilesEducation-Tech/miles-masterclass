<div class="w-full h-full bg-background text-foreground flex flex-col overflow-hidden">
  <app-micro-learning-top-bar (filterToggled)="openFilters()" />

  <main class="flex-1 min-h-0 w-full">
    <div
      class="h-full min-h-0 container mx-auto px-4 sm:px-6 py-2 sm:py-4 flex flex-col md:items-stretch"
    >
      <!--
        Reel column: a 9:16 frame centered in the available column, sized so
        it always fits the viewport height (height-bound at narrow columns,
        width-bound at wide ones). `flex-1` makes the section claim the
        remaining height under the top bar on mobile (flex-col parent); in
        grid mode the cell stretches by default via `items-stretch`.
      -->
      <section class="w-full flex-1 min-h-0 max-h-full flex gap-3 items-center justify-center">
        <div
          #reelScroller
          class="h-full aspect-9/16 max-w-full min-h-0 overflow-y-auto snap-y snap-mandatory scroll-smooth hide-scrollbar"
          (scrollend)="onReelScroll()"
        >
          @for (episode of facade.detailsList(); track episode.id) {
            <div class="snap-start snap-always h-full shrink-0 flex items-center justify-center">
              <app-micro-learning-reel-card
                [episode]="episode"
                [muted]="muted()"
                [active]="episode.id === facade.courseDetails()?.id"
                [preloaded]="preloadedIds().has(episode.id)"
                [rewatchToken]="rewatchTokenFor(episode.id)"
                [pauseToken]="pauseTokenFor(episode.id)"
                [ctaDisabled]="facade.ctaLoading()"
                (muteToggled)="toggleMute()"
                (shared)="facade.openShareDialog()"
                (optionSelected)="onOptionSelected($event)"
                (bookmarkToggled)="facade.toggleBookmark()"
                (cartToggled)="facade.addToCart()"
                (actionInvoked)="facade.handleActionStatus($event)"
                (timeUpdate)="facade.handleTimeUpdate($event)"
                (exited)="facade.handleExited($event)"
              />
            </div>
          } @empty {
            @if (facade.loading()) {
              <div class="h-full flex items-center justify-center text-sm text-muted-foreground">
                Loading…
              </div>
            } @else if (facade.error(); as err) {
              <div class="h-full flex items-center justify-center text-sm text-destructive">
                {{ err }}
              </div>
            }
          }
        </div>

        <div class="hidden md:flex shrink-0 items-center justify-center max-h-full overflow-auto">
          <app-micro-learning-reel-nav
            [canGoPrev]="canGoPrev()"
            [canGoNext]="canGoNext()"
            (prev)="goPrev()"
            (next)="goNext()"
          />
        </div>
      </section>
      <!-- <div
        #gridScroller
        class="hidden md:block min-h-0 overflow-y-auto max-h-full"
        (scroll)="onGridScroll(gridScroller)"
      >
        @if (facade.detailsList().length) {

              <div class="aspect-9/16 rounded-xl bg-muted animate-pulse"></div>
            }
          </div>
        }
      </div> -->
    </div>
  </main>
</div>
