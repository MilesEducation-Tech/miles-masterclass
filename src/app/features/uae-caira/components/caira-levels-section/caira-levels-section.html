<section class="w-11/12 mx-auto space-y-8">
  <header class="text-center">
    <h2 class="text-2xl sm:text-3xl md:text-4xl font-semibold text-foreground">
      CAIRA Certification — <span class="text-accent">Levels 1, 2 &amp; 3</span>
    </h2>
    <p class="text-sm md:text-base text-muted-foreground mt-2 max-w-2xl mx-auto">
      Progress through three levels of AI-readiness for accountants — each backed by curated Master
      Classes from the Miles course library.
    </p>
  </header>

  @for (group of facade.levels(); track group.id) {
    <app-carousel
      [cards]="group.courses"
      [heading]="{ text: group.name, subText: '' }"
      [swiperConfig]="swiperConfigEven"
      [filterConfig]="{ filterEnabled: false }"
      skeletonClass="aspect-video"
    >
      <ng-template let-card>
        <app-horizontal [card]="card" type="masterclass" />
      </ng-template>
    </app-carousel>
  } @empty {
    <p class="text-center text-sm text-muted-foreground">
      CAIRA level courses will appear here soon.
    </p>
  }
</section>
