<!-- Box ratios per width. The header is fixed over the top 80px and the copy
     is centred below it (`sm:pt-20`), so each box has to hold the copy at that
     width's type size plus 136px of header + bottom inset: the medium range
     (md–lg) needs the taller 16:9 / 10:5 boxes with the smaller type below;
     the design's 10:4 only fits from xl, where the type is full size. -->
<div
  class="relative w-full overflow-hidden aspect-9/14 sm:aspect-10/6 md:aspect-video lg:aspect-10/5 xl:aspect-10/4"
>
  <!-- Backdrop: the first three tracks' thumbnails as the design's tilted
       grid (Figma 2175:21141). Decorative; the vignettes below keep the copy
       on solid background. -->
  <app-home-hero-grid />

  <!-- The design's four #0e0e0e overlays (Figma 2175:21162–21165), in its
       stops: top fade, a 60% dim from the top, bottom fade, and the diagonal
       that keeps the copy (bottom-left) on solid background while the grid
       stays brightest top-right. -->
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-[37%] bg-linear-to-b from-background from-1% to-transparent to-68%"
  ></div>
  <div
    class="pointer-events-none absolute inset-0 bg-linear-to-b from-background/60 from-[19.5%] to-transparent to-61%"
  ></div>
  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 h-[79%] bg-linear-to-t from-background to-transparent to-46%"
  ></div>
  <div
    class="pointer-events-none absolute inset-0 bg-linear-[44.4deg] from-background from-26% to-transparent to-[75.4%] max-md:from-12%"
  ></div>

  <div
    class="relative z-10 mx-auto flex h-full w-11/12 flex-col items-start sm:justify-center justify-end pb-10 sm:pt-20 md:w-full md:px-16 md:pb-14 xl:px-[4%]"
  >
    <!-- `priority`: the one image that must win the first paint — it is the LCP
         candidate beside the <h1>, and on the server it becomes a preload link. -->
    <img
      [ngSrc]="assets.cairaLogo"
      alt="CAIRA — Certified AI-Ready Accountant"
      width="2616"
      height="838"
      priority
      class="h-14 w-auto md:h-16 xl:h-24"
      draggable="false"
    />

    <!-- The page's single <h1>: the visible headline is the topic, so it needs
         no sr-only stand-in. -->
    <h1 class="mt-5 text-3xl font-bold leading-tight md:text-4xl xl:mt-6 xl:text-[47px]">
      <span class="block">The AI Credential</span>
      <span class="block text-amber-400">Built for Accountants</span>
    </h1>

    <p class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm font-medium xl:text-base">
      <span>30 CPE Credits per Level</span>
      <span class="size-2 rounded-full bg-white hidden md:block" aria-hidden="true"></span>
      <span>Build AI Agents &amp; Workflows on Miles AI Labs</span>
    </p>

    <!-- Links, not buttons: crawlable, and no JS needed to follow them. Styled
         as the design's white and glass pills (app-button is button-only). -->
    <div class="mt-8 flex flex-wrap gap-4 xl:mt-10">
      <a
        [routerLink]="aiLabsLink()"
        class="inline-flex h-11 items-center justify-center rounded-xl bg-white px-5 text-sm font-bold whitespace-nowrap text-black transition-colors duration-200 hover:bg-white/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/60 motion-reduce:transition-none"
      >
        Build your 1st AI agent, free
      </a>
      <a
        [routerLink]="cairaLink()"
        class="inline-flex h-11 items-center justify-center rounded-xl bg-white/7 px-5 text-sm font-semibold whitespace-nowrap text-white transition-colors duration-200 hover:bg-white/12 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/60 motion-reduce:transition-none md:min-w-[267px]"
      >
        Explore CAIRA
      </a>
    </div>
  </div>
</div>
