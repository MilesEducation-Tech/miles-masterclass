<div class="h-dvh relative z-10 background">
  <video
    src="https://d1pp0977rsxmiq.cloudfront.net/static-assests/web-app/commons/404_3d_dance_sm.mp4"
    autoplay
    loop
    muted
    class="z-0 absolute inset-0 w-full h-full object-cover bg-no-repeat"
  ></video>
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2">
    <button
      class="relative inline-flex w-max px-6 py-2 items-center justify-center rounded-full border border-white/30 bg-gradient-to-br from-black/20 via-black/8 to-black/5 [backdrop-filter:url(#glass)] [-webkit-backdrop-filter:url(#glass)] transition-transform duration-[800ms] [transition-timing-function:cubic-bezier(0.175,0.885,0.32,2.2)] hover:scale-[1.05] cursor-pointer"
      role="link"
      routerLink="/"
    >
      <span class="pointer-events-none absolute inset-0 z-[1] opacity-[0.03] bg-noise"></span>

      <span
        class="relative z-[2] select-none flex items-center font-[600] uppercase tracking-[0.1em] text-white text-xl cursor-pointer"
      >
        <ng-icon [svg]="icons().arrowLeft" class="size-8 mr-2" />
        <span>Return Home</span>
      </span>
    </button>
  </div>
</div>
