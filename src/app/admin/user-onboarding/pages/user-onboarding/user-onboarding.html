<section class="admin-theme flex flex-col gap-6 p-6 text-white min-h-full">
  <app-deprecation-banner to="/admin/partner-v2/superadmin/onboarding" />
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div class="flex flex-col gap-2">
      <h1 class="text-2xl font-bold leading-tight">Create User</h1>
      <p class="text-sm text-white/70">
        Onboard learner users, edit their profile, and record offline invoice payments.
      </p>
    </div>
    <app-button variant="primary" size="default" (clicked)="onCreate()">Create user</app-button>
  </header>

  <!-- Filters bar -->
  <div class="flex w-full max-w-md items-center">
    <app-aria-input
      id="user-onboarding-search"
      type="search"
      label="Search name or email"
      class="w-full"
      [(value)]="searchInput"
    />
  </div>

  <!-- Error banner -->
  @if (facade.error()) {
    <div
      class="px-3 py-2 text-sm rounded-md"
      style="background: var(--mm-danger-bg); color: var(--mm-danger-fg)"
      role="alert"
    >
      Failed to load users. Try refreshing the page or check your connection.
    </div>
  }

  <app-user-onboarding-table
    [rows]="facade.users()"
    [isLoading]="facade.isLoading()"
    [currentPage]="currentPage()"
    [totalCount]="totalCount()"
    [hasNext]="hasNextPage()"
    [hasPrev]="hasPrevPage()"
    (edit)="onEdit($event)"
    (recordPayment)="onRecordPayment($event)"
    (applyPartnerCode)="onApplyPartnerCode($event)"
    (prevPage)="goPrev()"
    (nextPage)="goNext()"
  />
</section>
