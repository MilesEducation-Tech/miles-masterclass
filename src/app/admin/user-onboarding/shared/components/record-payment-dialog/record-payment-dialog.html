<div
  class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[480px] mx-auto overflow-hidden relative rounded-xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="record-payment-title"
>
  <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 shrink-0">
    <h2 id="record-payment-title" class="text-xl font-bold text-white">Record offline payment</h2>
    <app-button variant="close" size="sm" (clicked)="close()" aria-label="Close dialog" />
  </div>

  <div class="flex flex-col gap-4 px-6 py-6">
    <p class="text-sm text-white/70">
      Record the payment for
      <span class="font-medium text-white break-all">{{ data.userEmail }}</span
      >. This activates the user's subscription.
    </p>

    <label class="flex flex-col gap-2">
      <span class="text-sm font-medium text-white">Invoice file</span>
      <input
        type="file"
        accept="image/*,application/pdf"
        (change)="onFileSelected($event)"
        class="block w-full text-sm text-neutral-300 file:mr-3 file:rounded-md file:border-0 file:bg-white/10 file:px-3 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-white/15 cursor-pointer"
        aria-label="Invoice file"
      />
      @if (file()) {
        <span class="text-xs text-neutral-400 break-all">Selected: {{ file()!.name }}</span>
      }
    </label>

    <label class="flex flex-col gap-2">
      <span class="text-sm font-medium text-white">Comment</span>
      <textarea
        id="record-payment-comment"
        rows="3"
        [value]="comment()"
        (input)="onCommentInput($event)"
        class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700/60 rounded-xl text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm shadow-inner resize-y min-h-[80px]"
        placeholder="e.g. Paid by bank transfer on 12 Aug, ref TXN-8842."
        aria-describedby="record-payment-requirement"
      ></textarea>
    </label>

    <p
      id="record-payment-requirement"
      class="text-xs"
      [class]="canSubmit() ? 'text-neutral-400' : 'text-amber-300/90'"
      [attr.role]="canSubmit() ? null : 'status'"
    >
      @if (hasBoth()) {
        <span style="color: var(--mm-danger-fg)">
          Send an invoice <em>or</em> a comment, not both.
        </span>
      } @else {
        Provide an invoice file or a comment — exactly one is required.
      }
    </p>
  </div>

  <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-white/10 bg-white/3">
    <app-button variant="outline" size="default" class="text-white" (clicked)="close()">
      Cancel
    </app-button>
    <app-button variant="primary" size="default" [disabled]="!canSubmit()" (clicked)="submit()">
      Record &amp; activate
    </app-button>
  </div>
</div>
