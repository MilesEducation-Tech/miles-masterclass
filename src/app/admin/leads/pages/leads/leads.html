<section class="admin-theme flex flex-col gap-6 p-6 text-white min-h-full">
  <header class="flex flex-col gap-2">
    <h1 class="text-2xl font-bold leading-tight">Leads</h1>
    <p class="text-sm text-white/70">
      Firm enquiries captured from the marketing site. Track and update their status here.
    </p>
  </header>

  <!-- Filters bar -->
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div class="flex w-full max-w-md items-center">
      <app-field class="w-full">
        <label ngpLabel for="lead-search">Search name, email or firm</label>

        <input
          app-input
          id="lead-search"
          type="search"
          [value]="searchInput()"
          (input)="searchInput.set($any($event.target).value)"
        />
      </app-field>
    </div>

    <div class="flex items-center gap-3">
      <app-tabs
        aria-label="Lead status filter"
        [value]="activeTabLabel() ?? ''"
        (valueChange)="onTabChange($event)"
      >
        @for (tab of tabLabels; track tab) {
          <app-tab [value]="tab" [label]="tab" />
        }
      </app-tabs>

      <ng-container *hasPermission="PERM.LEADS_EXPORT">
        <button
          app-button
          type="button"
          class="h-9 rounded-md border-white/15 bg-transparent text-xs text-white hover:bg-white/5"
          variant="outline"
          size="sm"
          [disabled]="facade.isExporting()"
          (click)="onExport()"
        >
          Export CSV
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Error banner -->
  @if (facade.error()) {
    <div class="px-3 py-2 text-sm rounded-md bg-danger-bg text-danger-foreground" role="alert">
      {{ facade.error() }}
    </div>
  }

  <!-- Table -->
  <app-leads-table
    [rows]="facade.rows()"
    [isLoading]="facade.isLoading()"
    [currentPage]="facade.currentPage()"
    [pageSize]="facade.pageSize"
    [totalCount]="facade.totalCount()"
    [hasNext]="facade.hasNext()"
    [hasPrev]="facade.hasPrev()"
    (statusChange)="onStatusChange($event)"
    (notesChange)="onNotesChange($event)"
    (prevPage)="goPrev()"
    (nextPage)="goNext()"
  />
</section>
