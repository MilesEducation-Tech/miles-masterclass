<div class="admin-theme min-h-screen text-foreground flex font-sans gap-2 h-screen p-2">
  <!-- Desktop sidebar -->
  <div class="hidden md:flex md:shrink-0 sticky top-0">
    <app-admin-sidebar [collapsed]="desktopCollapsed()" />
  </div>

  <!-- Mobile drawer -->
  @if (mobileNavOpen()) {
    <div
      class="fixed inset-0 z-40 md:hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile navigation"
    >
      <button
        type="button"
        class="absolute inset-0 bg-background/70 backdrop-blur-sm cursor-default"
        (click)="closeMobileNav()"
        aria-label="Close navigation"
      ></button>
      <div class="relative h-full w-64 max-w-[80vw]">
        <app-admin-sidebar [collapsed]="false" />
      </div>
    </div>
  }

  <div class="flex-1 flex flex-col min-w-0">
    <app-admin-topbar (toggleSidebar)="toggleSidebar()" />

    <main class="flex-1 overflow-y-auto min-w-0 py-2 no-scrollbar" role="main">
      <router-outlet />
    </main>
  </div>
</div>
