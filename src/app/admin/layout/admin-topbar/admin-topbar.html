<header
  class="sticky top-0 z-10 flex items-center gap-4 border-b border-border px-8 py-2 backdrop-blur rounded-lg"
  style="background: rgba(14, 39, 66, 0.6)"
  role="banner"
>
  <button
    type="button"
    class="flex h-9 w-9 items-center justify-center rounded-md border border-border transition-colors hover:bg-(--mm-surface-2) focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    style="background: var(--mm-surface-2)"
    (click)="toggleSidebar.emit()"
    aria-label="Toggle sidebar"
  >
    <ng-icon name="lucidePanelLeft" class="text-base text-foreground" aria-hidden="true" />
  </button>

  <div class="min-w-0 flex-1">
    <nav
      aria-label="Breadcrumb"
      class="flex items-center text-[12px] font-semibold mb-0.5"
      style="color: var(--mm-fg-3)"
    >
      <span>Workspace · </span>
      <b class="ml-1 text-foreground font-semibold">{{ workspaceLabel }}</b>
      @for (crumb of crumbs(); track crumb.label) {
        <span class="mx-2" style="color: var(--mm-fg-3)">·</span>
        @if (crumb.link) {
          <a [href]="crumb.link" class="hover:text-foreground transition-colors">
            {{ crumb.label }}
          </a>
        } @else {
          <span class="text-foreground" aria-current="page">{{ crumb.label }}</span>
        }
      }
    </nav>
    <h1
      class="text-[24px] font-bold leading-tight text-white truncate"
      style="font-family: var(--font-numeric, var(--font-sans))"
    >
      {{ title() }}
    </h1>
  </div>
