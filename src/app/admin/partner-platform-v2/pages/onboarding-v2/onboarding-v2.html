<section class="admin-theme flex flex-col gap-6 p-6 text-white min-h-full">
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div class="flex flex-col gap-2">
      <h1 class="text-2xl font-bold leading-tight">User Onboarding</h1>
      <p class="text-sm text-white/70">
        Onboard learner users, edit their profile, apply partner codes, and record offline invoice
        payments.
      </p>
    </div>
    <button app-button type="button" variant="primary" (click)="onCreate()">Create user</button>
  </header>

  <!-- Filters bar -->
  <div class="flex flex-col gap-3 md:flex-row md:items-center">
    <div class="flex w-full max-w-md items-center">
      <app-field class="w-full">
        <label ngpLabel for="onboarding-v2-search">Search name or email</label>

        <input
          app-input
          id="onboarding-v2-search"
          type="search"
          [value]="searchInput()"
          (input)="searchInput.set($any($event.target).value)"
        />
      </app-field>
    </div>
    <div class="flex w-full max-w-md items-center">
      <app-field class="w-full">
        <label ngpLabel for="onboarding-v2-domain">Filter by email domain (comma-separated)</label>

        <input
          app-input
          id="onboarding-v2-domain"
          type="search"
          [value]="domainInput()"
          (input)="domainInput.set($any($event.target).value)"
        />
      </app-field>
    </div>
  </div>

  <!-- Error banner -->
  @if (facade.error()) {
    <div class="px-3 py-2 text-sm rounded-md bg-danger-bg text-danger-foreground" role="alert">
      {{ facade.error() }}
    </div>
  }

  <app-user-onboarding-table
    [rows]="facade.users()"
    [isLoading]="facade.isLoading()"
    [currentPage]="currentPage()"
    [totalCount]="totalCount()"
    [hasNext]="hasNextPage()"
    [hasPrev]="hasPrevPage()"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (recordPayment)="onRecordPayment($event)"
    (applyPartnerCode)="onApplyPartnerCode($event)"
    (prevPage)="goPrev()"
    (nextPage)="goNext()"
  />
</section>
