<app-dialog [ariaLabel]="'Add seats to ' + data.firm.name" panelClass="p-0 max-w-[520px]">
  <div
    class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[520px] mx-auto overflow-hidden relative rounded-xl"
  >
    <div class="flex items-start justify-between px-5 py-3 border-b border-white/10 shrink-0">
      <div class="min-w-0">
        <h2 id="allocate-seats-title" class="text-base font-semibold text-white truncate">
          Add seats
        </h2>
        <p class="text-xs text-white/60 truncate">{{ data.firm.name }}</p>
      </div>
      <button
        app-button
        type="button"
        class="rounded-full"
        size="sm"
        aria-label="Close dialog"
        variant="ghost"
        size="icon"
        (click)="close()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <div class="px-5 py-5">
      <form class="space-y-0 flex flex-col gap-4" (submit)="$event.preventDefault(); submit()">
        <app-field [errors]="form.partner_code().errors()">
          <label ngpLabel for="alloc-code">Partner code</label>

          <app-select id="alloc-code" [options]="codeOptions()" [formField]="form.partner_code" />
        </app-field>
        <app-field [errors]="form.count().errors()">
          <label ngpLabel for="alloc-count">Seats</label>

          <input app-input id="alloc-count" type="number" [formField]="form.count" />
        </app-field>
        <app-field [errors]="form.expiry_date().errors()">
          <label ngpLabel for="alloc-expiry">Expiry date (optional)</label>

          <input app-input id="alloc-expiry" type="date" [formField]="form.expiry_date" />
        </app-field>
        <p class="-mt-1 text-xs text-fg-3">
          Seats are priced from the selected plan and minted straight to this firm.
        </p>

        <div class="flex items-center justify-end gap-3">
          <button app-button type="button" class="text-white" variant="outline" (click)="close()">
            Cancel
          </button>
          <button app-button variant="primary" type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Minting…' : 'Add seats' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</app-dialog>
