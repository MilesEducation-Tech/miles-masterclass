<app-dialog ariaLabel="Create partner code" panelClass="p-0 max-w-[520px]">
  <div
    class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[520px] mx-auto overflow-hidden relative rounded-xl"
  >
    <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 shrink-0">
      <h2 id="create-partner-code-title" class="text-xl font-bold text-white">
        Create partner code
      </h2>
      <button
        app-button
        type="button"
        class="rounded-full"
        size="sm"
        aria-label="Close dialog"
        variant="ghost"
        size="icon"
        (click)="close()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <form class="space-y-0 flex flex-col" (submit)="$event.preventDefault(); submit()">
      <div class="flex flex-col gap-5 px-6 py-6">
        <app-field [errors]="form.code().errors()">
          <label ngpLabel for="pc-code">Code</label>

          <input
            app-input
            id="pc-code"
            type="text"
            placeholder="ALLINIAL-STD"
            [formField]="form.code"
          />
        </app-field>

        <app-field [errors]="form.discounted_price().errors()">
          <label ngpLabel for="pc-price">Discounted price</label>

          <input
            app-input
            id="pc-price"
            type="number"
            placeholder="299"
            step="0.01"
            [formField]="form.discounted_price"
          />
        </app-field>

        <app-field [errors]="form.scope().errors()">
          <label ngpLabel for="pc-scope">Assign to</label>

          <app-select id="pc-scope" [options]="scopeOptions()" [formField]="form.scope" />
        </app-field>

        <app-field [errors]="form.description().errors()">
          <label ngpLabel for="pc-description">Description (optional)</label>

          <input
            app-input
            id="pc-description"
            type="text"
            placeholder="Allinial standard plan"
            [formField]="form.description"
          />
        </app-field>

        <app-field [errors]="form.stripe_price_id().errors()">
          <label ngpLabel for="pc-stripe-price">Stripe price ID (optional)</label>

          <input
            app-input
            id="pc-stripe-price"
            type="text"
            placeholder="price_1N…"
            [formField]="form.stripe_price_id"
          />
        </app-field>

        <app-field [errors]="form.valid_to().errors()">
          <label ngpLabel for="pc-valid-to">Valid to (optional)</label>

          <input app-input id="pc-valid-to" type="datetime-local" [formField]="form.valid_to" />
        </app-field>
        <p class="-mt-3 text-xs text-fg-3">
          Expiry for direct (non-seat) redemption. Seats minted from this plan are unaffected.
        </p>

        <app-field class="flex-row items-start gap-3" [errors]="form.auto_subscribe().errors()">
          <app-checkbox id="pc-auto-subscribe" [formField]="form.auto_subscribe" />
          <div class="flex flex-col gap-0.5">
            <span ngpLabel>Auto-subscribe on redemption</span>
          </div>
        </app-field>
      </div>

      <div
        class="flex items-center justify-end gap-3 px-6 py-4 border-t border-white/10 bg-white/3"
      >
        <button app-button type="button" class="text-white" variant="outline" (click)="close()">
          Cancel
        </button>
        <button app-button variant="primary" type="submit">Create code</button>
      </div>
    </form>
  </div>
</app-dialog>
