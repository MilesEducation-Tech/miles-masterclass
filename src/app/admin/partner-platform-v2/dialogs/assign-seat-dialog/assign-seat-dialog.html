<app-dialog ariaLabel="Assign a pool seat to a firm" panelClass="p-0 max-w-[480px]">
  <div
    class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[480px] mx-auto overflow-hidden relative rounded-xl"
  >
    <div class="flex items-start justify-between px-5 py-3 border-b border-white/10 shrink-0">
      <div class="min-w-0">
        <h2 id="assign-seat-title" class="text-base font-semibold text-white truncate">
          Assign a pool seat
        </h2>
        <p class="text-xs text-white/60 truncate">Move an unassigned seat onto a member firm</p>
      </div>
      <button
        app-button
        type="button"
        class="rounded-full"
        size="sm"
        aria-label="Close dialog"
        variant="ghost"
        size="icon"
        (click)="close()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <div class="px-5 py-5">
      <form class="space-y-0 flex flex-col gap-4" (submit)="$event.preventDefault(); submit()">
        <app-field [errors]="form.seat_id().errors()">
          <label ngpLabel for="assign-seat-id">Seat ID</label>

          <input app-input id="assign-seat-id" type="number" [formField]="form.seat_id" />
        </app-field>
        <app-field [errors]="form.firm_id().errors()">
          <label ngpLabel for="assign-seat-firm">Assign to firm</label>

          <app-select id="assign-seat-firm" [options]="firmOptions()" [formField]="form.firm_id" />
        </app-field>
        <p class="-mt-1 text-xs text-fg-3">
          Enter the seat's numeric ID — it's on the minting confirmation and in the Seat Tracker
          row. Only unassigned network-pool seats (no firm yet) can be moved.
        </p>

        <div class="flex items-center justify-end gap-3">
          <button app-button type="button" class="text-white" variant="outline" (click)="close()">
            Cancel
          </button>
          <button app-button variant="primary" type="submit" [disabled]="!canSubmit()">
            Assign seat
          </button>
        </div>
      </form>
    </div>
  </div>
</app-dialog>
