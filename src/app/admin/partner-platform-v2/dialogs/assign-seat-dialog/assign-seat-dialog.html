<div
  class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[480px] mx-auto overflow-hidden relative rounded-xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="assign-seat-title"
>
  <div class="flex items-start justify-between px-5 py-3 border-b border-white/10 shrink-0">
    <div class="min-w-0">
      <h2 id="assign-seat-title" class="text-base font-semibold text-white truncate">
        Assign a pool seat
      </h2>
      <p class="text-xs text-white/60 truncate">Move an unassigned seat onto a member firm</p>
    </div>
    <app-button variant="close" size="sm" (clicked)="close()" aria-label="Close dialog" />
  </div>

  <div class="px-5 py-5">
    <app-forms type="signal" class="space-y-0 flex flex-col gap-4" (submitted)="submit()">
      <app-aria-input
        id="assign-seat-id"
        type="number"
        label="Seat ID"
        [formField]="form.seat_id"
      />
      <app-aria-select
        id="assign-seat-firm"
        label="Assign to firm"
        [options]="firmOptions()"
        [formField]="form.firm_id"
      />
      <p class="-mt-1 text-xs" style="color: var(--mm-fg-3)">
        Enter the seat's numeric ID — it's on the minting confirmation and in the Seat Tracker row.
        Only unassigned network-pool seats (no firm yet) can be moved.
      </p>

      <div class="flex items-center justify-end gap-3">
        <app-button variant="outline" size="default" class="text-white" (clicked)="close()">
          Cancel
        </app-button>
        <app-button variant="primary" size="default" type="submit" [disabled]="!canSubmit()">
          Assign seat
        </app-button>
      </div>
    </app-forms>
  </div>
</div>
