<app-dialog [ariaLabel]="'Edit roles for ' + data.email" panelClass="p-0 max-w-[480px]">
  <div
    class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col md:max-w-[480px] w-[95svw] mx-auto overflow-hidden relative rounded-xl"
  >
    <div class="flex items-center justify-between px-5 py-3 border-b border-white/10 shrink-0">
      <div class="min-w-0">
        <h2 id="edit-roles-title" class="text-base font-semibold text-white">Edit roles</h2>
        <p class="text-xs text-white/60 truncate">{{ data.email }}</p>
      </div>
      <button
        app-button
        type="button"
        class="rounded-full"
        size="sm"
        aria-label="Close dialog"
        variant="ghost"
        size="icon"
        (click)="cancel()"
      >
        <ng-icon name="heroXMark" aria-hidden="true" />
      </button>
    </div>

    <form novalidate (submit)="$event.preventDefault(); save()">
      <div class="px-5 py-5 space-y-4">
        <p class="text-sm text-white/70 leading-relaxed">
          Permissions are the union of every role ticked. Partner roles are exclusive — one Django
          partner-admin row per login.
        </p>

        <fieldset class="flex flex-col gap-2">
          <legend class="sr-only">Roles</legend>
          @for (role of data.roles; track role.slug) {
            <app-field class="flex-row items-start gap-3">
              <app-checkbox
                [id]="'edit-role-' + role.slug"
                [disabled]="isLocked(role.slug)"
                [checked]="isChecked(role.slug)"
                (checkedChange)="toggle(role.slug, $event)"
              />
              <div class="flex flex-col gap-0.5">
                <span ngpLabel>{{ role.name }}</span>
                <p ngpDescription>{{ role.description ?? '' }}</p>
              </div>
            </app-field>
          }
        </fieldset>
      </div>

      <div class="flex items-center justify-end gap-3 px-5 py-4 border-t border-white/10">
        <button
          app-button
          class="border-white/15 text-white hover:bg-white/5"
          type="button"
          variant="outline"
          (click)="cancel()"
        >
          Cancel
        </button>
        <button app-button type="submit" variant="default" [disabled]="!canSave()">
          Save roles
        </button>
      </div>
    </form>
  </div>
</app-dialog>
