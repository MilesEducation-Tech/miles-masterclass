@let s = section();

<section [id]="s.navId" class="scroll-mt-24 mb-10">
  @switch (s.level) {
    @case (2) {
      <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4">{{ s.title }}</h2>
    }
    @case (3) {
      <h3 class="text-xl font-semibold text-white mt-6 mb-3">{{ s.title }}</h3>
    }
    @case (4) {
      <h4 class="text-lg font-semibold text-white mt-5 mb-2">{{ s.title }}</h4>
    }
  }

  @if (s.body.length > 0) {
    <app-faq-content [content]="s.body" />
  }

  @if (s.sections?.length) {
    @for (child of s.sections ?? []; track child.navId) {
      <app-legal-section [section]="child" />
    }
  }
</section>
