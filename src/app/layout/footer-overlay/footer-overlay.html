<div class="pointer-events-none" role="region" aria-label="Floating utilities">
  @if (routeAllowed()) {
    <div
      class="fixed inset-x-0 bottom-0 z-50 w-full px-4 pb-4 transition-all duration-300 ease-out"
      [class]="
        cardKind() !== 'none'
          ? 'translate-y-0 opacity-100 pointer-events-auto'
          : 'translate-y-[110%] opacity-0 pointer-events-none'
      "
      aria-live="polite"
    >
      <div class="mx-auto w-full max-w-[1200px]">
        @switch (cardKind()) {
          @case ('continue') {
            <app-continue-learning-card
              [course]="inProgressCourse()!"
              (resume)="onResume($event)"
            />
          }
          @case ('subscribe') {
            <app-subscribe-card
              data-click-tag="overlay_subscribe"
              data-type-tag="cta"
              [title]="subscribeCopy.title"
              [subtitle]="subscribeCopy.subtitle"
              [ctaLabel]="subscribeCopy.cta"
              (ctaClick)="onSubscribe()"
            />
          }
          @case ('corporate') {
            <app-subscribe-card
              data-click-tag="overlay_book_demo"
              data-type-tag="cta"
              [title]="corporateCopy.title"
              [subtitle]="corporateCopy.subtitle"
              [ctaLabel]="corporateCopy.cta"
              (ctaClick)="onScheduleDiscoveryCall()"
            />
          }
        }
      </div>
    </div>
  }

  @if (!consent.bannerOpen()) {
    <div
      class="fixed right-6 z-51 pointer-events-auto transition-[bottom] duration-300 ease-out max-sm:right-4"
      [class]="
        cardKind() !== 'none' ? 'bottom-[108px] max-sm:bottom-[160px]' : 'bottom-6 max-sm:bottom-4'
      "
    >
      <app-utils-icon-cluster
        [cartCount]="cartCount()"
        [showCart]="isLoggedIn()"
        (cartClick)="onCartClick()"
        (searchClick)="openSearch()"
      />
    </div>
  }
</div>
