<div
  class="subscribe-card flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-6 w-full px-4 sm:px-6 py-4 rounded-2xl text-white shadow-lg"
>
  <div class="flex-1 min-w-0 pr-0 sm:pr-8">
    <p class="subscribe-card__title text-base sm:text-lg font-semibold leading-tight">
      {{ title() }}
    </p>
    <p class="subscribe-card__subtitle text-xs sm:text-sm text-white/85 mt-1">
      {{ subtitle() }}
    </p>
  </div>
  <app-button
    variant="ghost"
    class="shrink-0 self-stretch sm:self-auto bg-white text-black rounded-md font-semibold"
    (click)="onCta()"
  >
    {{ ctaLabel() }}
  </app-button>
</div>
