<div
  class="flex bg-linear-135/srgb from-primary to-accent flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-4 w-full px-4 sm:px-6 py-4 rounded-2xl text-white shadow-lg"
>
  <img
    [src]="course().horizontal_thumbnail || course().thumbnail"
    alt=""
    class="continue-learning-card__thumb w-full sm:w-24 h-16 sm:h-14 object-cover rounded-lg shrink-0"
    loading="lazy"
  />

  <div class="flex-1 min-w-0">
    <p class="text-[11px] uppercase tracking-wide text-white/70">Continue Learning</p>
    <p class="text-base sm:text-lg font-semibold leading-tight truncate" [title]="course().title">
      {{ course().title }}
    </p>
    @if (course().instructor_details.first_name) {
      <p class="text-xs text-white/80 mt-0.5 truncate">
        {{ course().instructor_details.first_name }}
        {{ course().instructor_details.last_name }}
      </p>
    }
  </div>

  <app-button variant="default" class="shrink-0 self-stretch sm:self-auto" (click)="onResume()">
    <span class="inline-flex items-center gap-2">
      <ng-icon name="faSolidPlay" class="text-xs" />
      Resume
    </span>
  </app-button>
</div>
