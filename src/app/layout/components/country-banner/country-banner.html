@if (show()) {
  <!-- `top-20` clears the fixed header in both of its states (~68 px at rest, ~76 px as the scrolled
       pill); `z-999` sits under the header's `z-1000` and above page content. -->
  <div
    class="fixed inset-x-0 top-20 z-999 flex justify-center px-3"
    role="region"
    [attr.aria-label]="'country.label' | transloco"
  >
    <div
      class="flex w-full max-w-3xl flex-col gap-3 rounded-2xl border border-white/10 bg-neutral-900/95 p-4 text-sm text-neutral-100 shadow-2xl backdrop-blur sm:flex-row sm:items-center sm:justify-between"
    >
      <p>{{ 'country.appearIn' | transloco: { country: geoName } }}</p>
      <div class="flex shrink-0 flex-wrap gap-2">
        <button
          type="button"
          (click)="switchCountry()"
          class="cursor-pointer rounded-lg bg-white px-4 py-2 font-medium text-black transition-colors hover:bg-neutral-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/60"
        >
          {{ 'country.switchTo' | transloco: { country: geoName } }}
        </button>
        <button
          type="button"
          (click)="stay()"
          class="cursor-pointer rounded-lg border border-white/20 px-4 py-2 font-medium transition-colors hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/60"
        >
          {{ 'country.stayIn' | transloco: { current: currentName() } }}
        </button>
      </div>
    </div>
  </div>
}
