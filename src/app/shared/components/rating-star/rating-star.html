<!-- RatingStar Component -->
<div [class]="containerClass()" role="group" [attr.aria-label]="ariaLabel()">
  @for (star of stars(); track star) {
    <!--
      A real <button> rather than a click-bound <div>: focus order, Enter/Space
      activation and the disabled state all come from the platform. `disabled`
      replaces the old container-level `pointer-events: none`, which blocked the
      mouse but left the control reachable by keyboard.
    -->
    <button
      type="button"
      class="flex justify-center items-center"
      [class]="starClass()"
      [disabled]="isReadonly()"
      [attr.aria-label]="'Rate ' + star + ' out of ' + max()"
      (click)="handleRate(star)"
    >
      <div class="relative inline-block">
        <!-- Base: Outline Star -->
        <ng-icon
          name="heroStar"
          [size]="size()"
          class="text-gray-400 cursor-pointer block"
        ></ng-icon>

        <!-- Overlay: Solid Star (Full or Partial) -->
        @if (getStarState(star, value()) !== 'empty') {
          <div
            class="absolute top-0 left-0 h-full overflow-hidden cursor-pointer text-yellow-400"
            [style.width]="
              getStarState(star, value()) === 'full' ? '100%' : getPartialPercent(star, value())
            "
          >
            <ng-icon name="heroStarSolid" [size]="size()" class="block"></ng-icon>
          </div>
        }
      </div>
    </button>
  }
</div>
