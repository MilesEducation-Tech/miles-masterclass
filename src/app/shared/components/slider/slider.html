<ul
  class="relative m-0 aspect-9/16 w-full list-none p-0 sm:aspect-video"
  role="region"
  aria-label="Image slider"
  aria-roledescription="carousel"
  (keydown)="onKeydown($event)"
  tabindex="0"
>
  @for (item of orderedItems(); track item.id; let i = $index) {
    <li
      [class]="itemClass(i)"
      [attr.aria-hidden]="i !== 1"
      role="group"
      [attr.aria-roledescription]="'slide'"
      [attr.aria-label]="'Slide ' + (i + 1) + ' of ' + totalSlides()"
    >
      <!-- The hero takes the full slot (landscape from md, portrait on phones);
           the rest are the thumbnail strip (portrait from md, landscape on phones).
           Separate elements per branch: NgOptimizedImage rejects a changed
           `priority` after init. Only the hero is priority, because the server
           preloads every priority image and the strip can hold ten. Empty alt:
           the title is the slide's heading, and thumbnail slides are aria-hidden. -->
      @if (i === 1) {
        <div
          class="absolute inset-0 w-full h-full z-1 bg-linear-to-t from-background via-background/60 to-transparent to-50% from-10% via-30%"
        ></div>
        <img [ngSrc]="art(item, isMobile())" [priority]="true" fill class="object-cover" alt="" />
      } @else {
        <div class="relative inset-0 w-full h-full">
          <img [ngSrc]="art(item, !isMobile())" fill class="object-cover" alt="" />
        </div>
      }

      <div [class]="contentClass(i === 1)">
        <app-miles-slug slug="miles masterclass" ngSkipHydration />
        <h2 class="text-2xl font-bold tracking-tight uppercase md:text-4xl">{{ item.title }}</h2>
        @if (item.short_description) {
          <p class="text-sm text-neutral-400 md:text-base">{{ item.short_description }}</p>
        }
        <div class="flex items-center space-x-2">
          <!-- The course total, summed by the API: rendered as sent. -->
          @if (item.total_cpe_credits !== null) {
            <h3
              class="font-semibold tracking-widest text-accent md:text-3xl bg-transparent border border-input rounded-lg px-2 py-1 text-sm!"
            >
              {{ item.total_cpe_credits }} CPE
            </h3>
          }
          <app-caira-credly-badge
            variant="inline"
            [includedForCaira]="item.included_for_caira"
            [hasIndividualBadge]="item.has_individual_badge"
          />
        </div>
        <div class="flex space-x-4 items-center">
          <button
            app-button
            type="button"
            class="bg-white text-black rounded-lg gap-1"
            variant="ghost"
            (click)="watch(item)"
          >
            <ng-icon name="matPlayArrowRound" size="24" aria-hidden="true" />Watch Now
          </button>
          <button
            app-button
            type="button"
            class="bg-input text-white rounded-lg gap-1"
            variant="ghost"
            (click)="info.emit(item)"
          >
            <ng-icon name="matInfoOutline" size="24" aria-hidden="true" />Learn More
          </button>
        </div>
      </div>
    </li>
  }
</ul>

<nav
  class="absolute bottom-8 inset-s-6 z-10 flex gap-2 select-none sm:inset-s-auto sm:left-1/2 sm:-translate-x-1/2"
  aria-label="Slider navigation"
>
  <button
    app-button
    class="nav-btn"
    variant="ghost"
    type="button"
    [disabled]="isAnimating()"
    aria-label="Previous slide"
    (click)="prev()"
  >
    <ng-icon
      name="matArrowBackIosRound"
      class="rtl:-scale-x-100"
      strokeWidth="4"
      aria-hidden="true"
    />
  </button>
  <button
    app-button
    class="nav-btn"
    variant="ghost"
    type="button"
    [disabled]="isAnimating()"
    aria-label="Next slide"
    (click)="next()"
  >
    <ng-icon
      name="matArrowForwardIosRound"
      class="rtl:-scale-x-100"
      strokeWidth="4"
      aria-hidden="true"
    />
  </button>
</nav>
