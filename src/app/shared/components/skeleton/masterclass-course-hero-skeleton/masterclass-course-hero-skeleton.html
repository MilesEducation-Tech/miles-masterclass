<div class="w-full aspect-16/8 relative animate-pulse">
  <div class="w-full h-[calc(100%-80px)] relative flex justify-end">
    <!-- Video/Image skeleton -->
    <div class="absolute left-0 top-0 h-full aspect-video overflow-hidden z-0 bg-muted"></div>

    <!-- Content overlay skeleton -->
    <div
      class="w-1/2 h-full bg-linear-to-l from-background to-transparent via-85% via-background/40 from-40% z-1 flex flex-col space-y-6 items-end justify-end pb-10"
    >
      <div class="flex flex-col space-y-6 items-center justify-end">
        <div class="w-2/3 mx-auto flex flex-col items-center space-y-3">
          <!-- Category skeleton -->
          <div class="h-6 w-32 bg-muted rounded"></div>

          <!-- Divider -->
          <div class="h-1 w-10 bg-muted rounded-full"></div>

          <!-- Title skeleton -->
          <div class="h-12 w-80 bg-muted rounded"></div>

          <!-- Instructor skeleton -->
          <div class="h-6 w-40 bg-muted rounded"></div>

          <!-- Credits badge skeleton -->
          <div class="h-8 w-28 bg-muted rounded-lg"></div>

          <!-- Description skeleton -->
          <div class="flex flex-col space-y-2 items-center w-full">
            <div class="h-4 w-full max-w-md bg-muted rounded"></div>
            <div class="h-4 w-4/5 max-w-md bg-muted rounded"></div>
            <div class="h-4 w-3/5 max-w-md bg-muted rounded"></div>
          </div>

          <!-- Price skeleton -->
          <div class="h-6 w-20 bg-muted rounded"></div>
        </div>

        <!-- Watch Now button skeleton -->
        <div class="flex justify-center items-center">
          <div class="h-10 w-32 bg-muted rounded-lg"></div>
        </div>

        <!-- Date info skeleton -->
        <div class="flex space-x-4">
          <div class="h-4 w-48 bg-muted rounded"></div>
        </div>

        <!-- Action buttons skeleton -->
        <div class="flex space-x-4">
          <div class="flex flex-col items-center space-y-1">
            <div class="h-6 w-6 bg-muted rounded"></div>
            <div class="h-3 w-10 bg-muted rounded"></div>
          </div>
          <div class="flex flex-col items-center space-y-1">
            <div class="h-6 w-6 bg-muted rounded"></div>
            <div class="h-3 w-10 bg-muted rounded"></div>
          </div>
          <div class="flex flex-col items-center space-y-1">
            <div class="h-6 w-6 bg-muted rounded"></div>
            <div class="h-3 w-14 bg-muted rounded"></div>
          </div>
          <div class="flex flex-col items-center space-y-1">
            <div class="h-6 w-6 bg-muted rounded"></div>
            <div class="h-3 w-8 bg-muted rounded"></div>
          </div>
          <div class="flex flex-col items-center space-y-1">
            <div class="h-6 w-6 bg-muted rounded"></div>
            <div class="h-3 w-14 bg-muted rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
