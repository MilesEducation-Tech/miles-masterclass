<div class="animate-pulse" aria-hidden="true">
  <!-- SUB-BAR: back / progress / mode pill -->
  <div class="border-y border-border bg-black/40">
    <div class="mx-auto flex max-w-[1240px] items-center gap-4 px-5 py-2 lg:px-8">
      <div class="h-5 w-32 shrink-0 rounded bg-muted"></div>
      <div class="hidden flex-1 items-center gap-3 sm:flex">
        <div class="h-1.5 min-w-[80px] flex-1 rounded-full bg-muted"></div>
        <div class="h-4 w-24 shrink-0 rounded bg-muted"></div>
      </div>
      <div class="ml-auto h-7 w-36 shrink-0 rounded-full bg-muted"></div>
    </div>
  </div>

  <main class="mx-auto flex max-w-[1240px] flex-col gap-16 px-5 py-8 lg:px-8 lg:py-12">
    <!-- HERO: player card + detail column -->
    <section class="grid gap-8 lg:grid-cols-[1.55fr_1fr] lg:items-start">
      <div class="overflow-hidden rounded-2xl border border-border bg-card">
        <div class="aspect-video w-full border-b border-border bg-muted"></div>
        <!-- Under-player row: progress, percentage, theater toggle -->
        <div class="flex flex-wrap items-center gap-4 px-4 py-3">
          <div class="h-2 min-w-[100px] flex-1 rounded-full bg-muted"></div>
          <div class="h-4 w-20 shrink-0 rounded bg-muted"></div>
          <div class="h-8 w-32 shrink-0 rounded-lg bg-muted"></div>
        </div>
      </div>

      <div class="flex flex-col">
        <div class="h-3 w-48 rounded bg-muted"></div>
        <!-- Title wraps to two lines at every breakpoint the hero supports -->
        <div class="mt-3 flex flex-col gap-2">
          <div class="h-9 w-full rounded bg-muted"></div>
          <div class="h-9 w-3/4 rounded bg-muted"></div>
        </div>

        <!-- Instructor / duration / credits -->
        <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-2">
          <div class="h-4 w-32 rounded bg-muted"></div>
          <div class="h-4 w-16 rounded bg-muted"></div>
          <div class="h-4 w-24 rounded bg-muted"></div>
        </div>

        <div class="mt-4 flex flex-col gap-2">
          <div class="h-4 w-full rounded bg-muted"></div>
          <div class="h-4 w-5/6 rounded bg-muted"></div>
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <div class="h-12 w-44 rounded-lg bg-muted"></div>
          <div class="h-12 w-40 rounded-lg bg-muted"></div>
        </div>
        <div class="mt-3 h-4 w-2/3 rounded bg-muted"></div>

        <!-- Duration / structure / level -->
        <dl
          class="mt-6 grid grid-cols-3 overflow-hidden rounded-xl border border-border bg-black/25"
        >
          @for (cell of [0, 1, 2]; track cell) {
            <div class="p-3.5" [class.border-r]="!$last" [class.border-border]="!$last">
              <div class="h-3 w-16 rounded bg-muted"></div>
              <div class="mt-2 h-5 w-20 rounded bg-muted"></div>
            </div>
          }
        </dl>
      </div>
    </section>

    <!-- DESCRIPTION + LEARNING OBJECTIVES -->
    <section class="grid gap-10 lg:grid-cols-2">
      <div>
        <div class="h-7 w-56 rounded bg-muted"></div>
        <div class="mt-4 flex flex-col gap-2">
          <div class="h-4 w-full rounded bg-muted"></div>
          <div class="h-4 w-full rounded bg-muted"></div>
          <div class="h-4 w-4/5 rounded bg-muted"></div>
        </div>
        <div class="mt-5 flex flex-wrap gap-2">
          @for (topic of [0, 1, 2]; track topic) {
            <div class="h-7 w-24 rounded-md bg-muted"></div>
          }
        </div>
      </div>

      <div>
        <div class="h-7 w-52 rounded bg-muted"></div>
        <ol class="mt-4 flex flex-col gap-4">
          @for (objective of [0, 1, 2]; track objective) {
            <li class="flex gap-4">
              <div class="h-4 w-5 shrink-0 rounded bg-muted"></div>
              <div class="h-4 flex-1 rounded bg-muted"></div>
            </li>
          }
        </ol>
      </div>
    </section>

    <!-- 01 — AI LAB -->
    <section>
      <div class="mb-3 flex items-center gap-3">
        <div class="h-4 w-6 rounded bg-muted"></div>
        <div class="h-7 w-48 rounded bg-muted"></div>
      </div>
      <div class="rounded-2xl border border-border bg-card p-6 lg:p-8">
        <div class="flex flex-col gap-2">
          <div class="h-4 w-full rounded bg-muted"></div>
          <div class="h-4 w-3/4 rounded bg-muted"></div>
        </div>
        <ol class="mt-5 grid gap-x-6 gap-y-2 sm:grid-cols-2">
          @for (step of [0, 1, 2, 3]; track step) {
            <li class="h-4 rounded bg-muted"></li>
          }
        </ol>
        <div class="mt-6 flex flex-wrap items-center gap-4">
          <div class="h-11 w-72 rounded-lg bg-muted"></div>
          <div class="h-4 w-52 rounded bg-muted"></div>
        </div>
      </div>
    </section>
  </main>
</div>
