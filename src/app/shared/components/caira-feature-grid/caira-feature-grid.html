<ul
  class="grid md:grid-cols-[repeat(2,320px)] grid-cols-[repeat(1,320px)] lg:grid-cols-[repeat(3,320px)] gap-6 list-none p-0 m-0"
>
  @for (item of items(); track item.title) {
    <li class="relative w-full rounded-lg overflow-hidden bg-transparent">
      <img
        [src]="item.image"
        [alt]="item.imageAlt ?? item.title"
        loading="lazy"
        decoding="async"
        class="w-full h-auto block"
      />
      <div class="absolute h-2/5 w-full bottom-0 left-0">
        <h3 class="text-white text-center font-semibold text-base px-2">
          {{ item.title }}
        </h3>
        <p
          class="text-[#A8A8A8] text-center font-medium text-sm px-2 mt-2"
          [innerHTML]="item.description"
        ></p>
      </div>
    </li>
  }
</ul>
