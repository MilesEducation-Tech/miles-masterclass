<span>{{ currentLabel() }}</span>
<ng-icon name="heroChevronDown" size="16" class="text-muted-foreground transition-transform" />

<div
  *ngpSelectPortal
  ngpSelectDropdown
  class="min-w-[180px] py-1 rounded-md bg-card border border-border/60 shadow-lg outline-none"
>
  @for (opt of options(); track opt.value) {
    <div
      ngpSelectOption
      [ngpSelectOptionValue]="opt.value"
      class="px-4 py-2 text-sm cursor-pointer select-none text-foreground data-[hover]:bg-secondary/40 data-[selected]:bg-secondary/60 data-[selected]:font-semibold data-[active]:bg-secondary/60 outline-none"
    >
      {{ opt.label }}
    </div>
  }
</div>
