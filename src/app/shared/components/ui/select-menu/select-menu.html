<button
  #triggerEl
  #trigger="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  [attr.aria-haspopup]="'listbox'"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="listboxId"
  (click)="toggle()"
  (keydown.escape)="close()"
  class="inline-flex items-center justify-between gap-2 h-10 min-w-[180px] px-4 rounded-full bg-secondary/60 border border-border/40 backdrop-blur-sm text-sm font-medium text-foreground hover:bg-secondary/80 transition-colors outline-none focus-visible:ring-2 focus-visible:ring-accent"
>
  <span>{{ currentLabel() }}</span>
  <ng-icon
    name="heroChevronDown"
    size="16"
    class="text-muted-foreground transition-transform"
    [class.rotate-180]="isOpen()"
  />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayOffsetY]="6"
  (attach)="onOverlayAttached()"
  (backdropClick)="close()"
  (detach)="close()"
>
  <ul
    #listboxEl
    ngListbox
    [id]="listboxId"
    [value]="[value()]"
    (valueChange)="onListboxValuesChange($event)"
    [multi]="false"
    orientation="vertical"
    selectionMode="follow"
    wrap
    tabindex="0"
    (keydown.escape)="close()"
    class="min-w-[180px] py-1 rounded-md bg-card border border-border/60 shadow-lg outline-none"
  >
    @for (opt of options(); track opt.value) {
      <li
        ngOption
        [value]="opt.value"
        [label]="opt.label"
        class="px-4 py-2 text-sm cursor-pointer select-none text-foreground hover:bg-secondary/40 aria-selected:bg-secondary/60 aria-selected:font-semibold outline-none focus-visible:bg-secondary/60"
      >
        {{ opt.label }}
      </li>
    }
  </ul>
</ng-template>
