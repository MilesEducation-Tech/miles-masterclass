<div [class]="wrapperClasses()">
  <div class="relative">
    <button
      #triggerEl
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
      type="button"
      [id]="inputId()"
      [name]="id()"
      [class]="triggerClasses()"
      [disabled]="disabled()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="listboxId()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-required]="required() || null"
      [attr.aria-describedby]="describedBy()"
      (click)="toggle()"
      (blur)="handleBlur()"
      (keydown.escape)="close()"
    >
      @if (hasSelection()) {
        @for (v of visibleChips(); track v) {
          <span
            class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-secondary text-secondary-foreground text-sm font-medium"
          >
            {{ getLabelFor(v) }}
            <span
              role="button"
              tabindex="0"
              class="rounded-full hover:bg-secondary-foreground/10 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring cursor-pointer"
              (click)="removeChip($event, v)"
              (keydown.enter)="removeChip($event, v)"
              [attr.aria-label]="'Remove ' + getLabelFor(v)"
            >
              <ng-icon [svg]="icons().xMark" class="w-3.5 h-3.5" />
            </span>
          </span>
        }
        @if (overflowCount() > 0) {
          <span
            class="shrink-0 px-1.5 py-0.5 text-xs font-medium rounded bg-accent/15 text-accent border border-accent/20"
          >
            +{{ overflowCount() }} more
          </span>
        }
      } @else {
        <span class="truncate text-muted-foreground">{{ placeholder() || ' ' }}</span>
      }
    </button>

    @if (label()) {
      <label
        [for]="inputId()"
        class="floating-label"
        [class.floating-label-active]="hasSelection() || isOpen()"
      >
        {{ label() }}
        @if (required()) {
          <sup class="text-destructive ml-1" aria-label="required">*</sup>
        }
      </label>
    }

    <div
      class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none transition-transform"
      [class.rotate-180]="isOpen()"
    >
      <ng-icon [svg]="icons().chevronDown" class="w-4 h-4" />
    </div>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      [cdkConnectedOverlayOffsetY]="6"
      [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
      (attach)="onOverlayAttached()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <ul
        #listboxEl
        ngListbox
        [id]="listboxId()"
        [multi]="true"
        [value]="selectedValues()"
        (valueChange)="onListboxValuesChange($event)"
        [disabled]="disabled()"
        tabindex="0"
        wrap
        orientation="vertical"
        selectionMode="explicit"
        (keydown.escape)="close()"
        class="w-full list-none p-1 max-h-60 overflow-y-auto rounded-md border border-border bg-popover text-popover-foreground shadow-lg outline-none focus-visible:ring-2 focus-visible:ring-ring box-border"
      >
        @for (option of renderOptions(); track option.value) {
          <li
            ngOption
            [value]="option.value"
            [label]="option.label"
            [disabled]="option.disabled ?? false"
            class="group/opt flex items-center gap-2 px-3 py-2 text-sm rounded cursor-pointer select-none transition-colors hover:bg-secondary/40 aria-disabled:opacity-50 aria-disabled:cursor-not-allowed outline-none focus-visible:bg-secondary/60"
          >
            <span
              class="size-4 shrink-0 inline-flex items-center justify-center rounded border border-border/60 bg-secondary/30 group-aria-selected/opt:bg-accent group-aria-selected/opt:border-accent transition-colors"
              aria-hidden="true"
            >
              <ng-icon
                [svg]="icons().check"
                strokeWidth="3"
                class="size-3 text-accent-foreground opacity-0 group-aria-selected/opt:opacity-100"
              />
            </span>
            <span class="truncate">{{ option.label }}</span>
          </li>
        }
      </ul>
    </ng-template>
  </div>

  @if (hint() && !displayError()) {
    <p [id]="hintId()" class="text-sm text-muted-foreground mt-1.5">{{ hint() }}</p>
  }
  @if (touched() && displayError()) {
    <div [id]="errorId()" class="error-messages" role="alert">
      @for (error of errors(); track error) {
        <p class="text-sm text-destructive mt-1.5">{{ error.message }}</p>
      }
    </div>
  }
</div>
