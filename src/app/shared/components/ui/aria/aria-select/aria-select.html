<div [class]="wrapperClasses()">
  <div class="relative">
    <button
      #triggerEl
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
      type="button"
      [id]="inputId()"
      [name]="id()"
      [class]="triggerClasses()"
      [disabled]="disabled()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="listboxId()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-required]="required() || null"
      [attr.aria-describedby]="describedBy()"
      (click)="toggle()"
      (blur)="handleBlur()"
      (keydown.escape)="close()"
    >
      <span class="block truncate" [class.text-muted-foreground]="!selectedLabel()">
        {{ selectedLabel() || placeholder() || ' ' }}
      </span>
    </button>

    @if (label()) {
      <label
        [for]="inputId()"
        class="floating-label"
        [class.floating-label-active]="hasSelection() || isOpen()"
      >
        {{ label() }}
        @if (required()) {
          <sup class="text-destructive ml-1" aria-label="required">*</sup>
        }
      </label>
    }

    <div
      class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none transition-transform"
      [class.rotate-180]="isOpen()"
    >
      <ng-icon [svg]="icons().chevronDown" class="w-4 h-4" />
    </div>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      [cdkConnectedOverlayOffsetY]="6"
      [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
      (attach)="onOverlayAttached()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <ul
        #listboxEl
        ngListbox
        [id]="listboxId()"
        [multi]="false"
        [value]="listboxValues()"
        (valueChange)="onListboxValuesChange($event)"
        [disabled]="disabled()"
        tabindex="0"
        wrap
        orientation="vertical"
        selectionMode="explicit"
        (keydown.escape)="close()"
        class="w-full list-none p-1 max-h-60 overflow-y-auto rounded-md border border-border bg-popover text-popover-foreground shadow-lg outline-none focus-visible:ring-2 focus-visible:ring-ring box-border"
      >
        @for (option of renderOptions(); track option.value) {
          <li
            ngOption
            [value]="option.value"
            [label]="option.label"
            [disabled]="option.disabled ?? false"
            class="px-3 py-2 text-sm rounded cursor-pointer select-none transition-colors hover:bg-secondary/40 aria-selected:bg-accent aria-selected:text-accent-foreground aria-disabled:opacity-50 aria-disabled:cursor-not-allowed outline-none focus-visible:bg-secondary/60"
          >
            {{ option.label }}
          </li>
        }
      </ul>
    </ng-template>
  </div>

  @if (hint() && !displayError()) {
    <p [id]="hintId()" class="text-sm text-muted-foreground mt-1.5">{{ hint() }}</p>
  }
  @if (touched() && displayError()) {
    <div [id]="errorId()" class="error-messages" role="alert">
      @for (error of errors(); track error) {
        <p class="text-sm text-destructive mt-1.5">{{ error.message }}</p>
      }
    </div>
  }
</div>
