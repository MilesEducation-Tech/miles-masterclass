<div [class]="wrapperClasses()">
  @if (label()) {
    <label [for]="id()" [class]="labelClasses()">
      {{ label() }}
      @if (required()) {
        <sup class="text-destructive ml-1" aria-label="required">*</sup>
      }
    </label>
  }

  <div
    ngpInputOtp
    [(ngpInputOtpValue)]="value"
    [ngpInputOtpDisabled]="isDisabled()"
    [ngpInputOtpPattern]="otpPattern()"
    [ngpInputOtpInputMode]="inputMode()"
    [ngpInputOtpPlaceholder]="placeholder()"
  >
    <!-- The one real control: hidden, but what the browser autofills and what
         assistive technology reads. The slots below are presentational. -->
    <input
      #otpInput
      ngpInputOtpInput
      [id]="id()"
      [attr.aria-label]="label() || 'One-time code'"
      (blur)="onBlur()"
    />

    <div class="flex flex-wrap gap-2">
      @for (slot of slots(); track slot) {
        <div ngpInputOtpSlot [class]="slotClasses()"></div>
      }
    </div>
  </div>

  @if (description()) {
    <p class="text-sm text-muted-foreground font-normal mt-1">
      {{ description() }}
    </p>
  }
  @if (hint() && !displayError()) {
    <p class="text-sm text-muted-foreground mt-1.5">
      {{ hint() }}
    </p>
  }
  @if (touched()) {
    <div class="error-messages" role="alert">
      @for (error of errors(); track error) {
        <p class="text-sm text-destructive mt-1.5">
          {{ error.message }}
        </p>
      }
    </div>
  }
</div>
