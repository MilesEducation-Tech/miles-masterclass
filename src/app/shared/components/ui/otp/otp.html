<div [class]="wrapperClasses()">
  @if (label()) {
    <label [for]="id() + '-0'" [class]="labelClasses()">
      {{ label() }}
      @if (required()) {
        <sup class="text-destructive ml-1" aria-label="required">*</sup>
      }
    </label>
  }
  <div class="flex flex-wrap gap-2" (paste)="handlePaste($event)">
    @for (i of digitArray(); track i) {
      <input
        #digitInput
        type="text"
        [attr.inputmode]="inputMode()"
        [attr.pattern]="validationPattern()"
        autocomplete="one-time-code"
        [id]="id() + '-' + i"
        [class]="digitInputClasses()"
        [value]="currentValues()[i] || ''"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [attr.aria-label]="'Digit ' + (i + 1)"
        (input)="handleInput($event, i)"
        (keydown)="handleKeyDown($event, i)"
        (blur)="handleBlur()"
        maxlength="1"
      />
    }
  </div>

  @if (description()) {
    <p class="text-sm text-muted-foreground font-normal mt-1">
      {{ description() }}
    </p>
  }
  @if (hint() && !displayError()) {
    <p class="text-sm text-muted-foreground mt-1.5">
      {{ hint() }}
    </p>
  }
  @if (touched()) {
    <div class="error-messages" role="alert">
      @for (error of errors(); track error) {
        <p class="text-sm text-destructive mt-1.5">
          {{ error.message }}
        </p>
      }
    </div>
  }
</div>
