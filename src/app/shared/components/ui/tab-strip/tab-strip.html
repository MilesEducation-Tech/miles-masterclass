<div ngTabs [class]="rootClasses()">
  <ul
    ngTabList
    [selectedTab]="selected() ?? undefined"
    (selectedTabChange)="onSelectedChange($event)"
    orientation="horizontal"
    selectionMode="explicit"
    wrap
    class="inline-flex items-center gap-1 p-1 rounded-full bg-secondary/40 border border-border/40"
  >
    @for (opt of options(); track opt) {
      <li
        ngTab
        [value]="opt"
        [class]="tabClasses()"
        [class.bg-primary]="selected() === opt"
        [class.text-white]="selected() === opt"
        [class.text-muted-foreground]="selected() !== opt"
        [class.hover:text-foreground]="selected() !== opt"
      >
        {{ opt }}
      </li>
    }
  </ul>
</div>
