<div
  class="bg-card text-card-foreground w-[min(480px,92vw)] p-5 md:p-6 flex flex-col gap-4 border border-border"
>
  <div class="flex items-start justify-between gap-4">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl md:text-2xl font-semibold leading-tight">Reserve your seat</h2>
      <p class="text-sm text-muted-foreground">
        Sign up below and we'll save your spot for
        <strong class="text-foreground">"{{ webinar().webinar_title }}"</strong>.
      </p>
    </div>
    <app-button variant="close" size="sm" (clicked)="close()" />
  </div>

  <app-webinar-registration-form
    [webinarId]="webinar().id"
    [webinarDateId]="nextSession()?.id ?? 0"
    [webinarTitle]="webinar().webinar_title"
    (submitted)="onRegistered($event)"
  />

  <p class="text-xs text-muted-foreground">
    Once you're registered, the Zoom link and calendar invite are on their way to your inbox.
  </p>
</div>
