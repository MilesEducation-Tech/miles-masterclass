<div
  class="relative w-[95vw] max-w-3xl overflow-hidden rounded-[24px] border border-[#8b5cf6] bg-[#04101c] shadow-[0px_24px_48px_-12px_rgba(0,0,0,0.4)] backdrop-blur-[12px]"
  role="dialog"
>
  <!-- Orbit hero. The band is the visible slice of a 530x481.5 orbit box that
       Figma positions at card (181, -116) — the top of the box is clipped by the
       card. Every child is positioned in % of that box so the whole hero scales
       with the dialog width instead of breaking below 892px. -->
  <div class="relative w-full aspect-892/365.5" aria-hidden="true">
    <div class="absolute left-[20.29%] top-[-31.74%] w-[59.42%] aspect-530/481.5">
      <!-- inner ellipse; its glow bleeds past the ellipse box, hence the negative
           inset. Stays outside the rotating layer — it's a true circle, so
           spinning it would be invisible anyway. -->
      <div class="absolute left-[9.81%] top-[3.12%] h-[88.47%] w-[80.38%]">
        <img
          [src]="asset + '/orbit-ellipse.svg'"
          alt=""
          class="absolute inset-[-41.35%] h-[182.7%] w-[182.7%] max-w-none"
        />
      </div>

      <!-- Floating app icons. Three of them are crops in Figma (the source image
           is wider than its frame), so those keep an overflow wrapper with the
           designed inner offsets rather than being squashed by object-fit.

           Each icon is three nested layers: the outer box holds the Figma
           position, `ai-orbit-counter` cancels the parent's revolution so the
           glyph stays upright, and `ai-orbit-float` bobs. See the CSS for why
           they can't collapse into one element. -->
      <div class="ai-orbit-spin absolute inset-0">
        <!-- concentric orbit rings — inside the rotating layer with the icons so
             the two can never drift apart -->
        <img
          [src]="asset + '/orbit-rings.svg'"
          alt=""
          class="absolute inset-0 h-full w-full max-w-none"
        />

        <div class="absolute left-[10.75%] top-[21.18%] h-[13.5%] w-[12.26%]">
          <div class="ai-orbit-counter h-full w-full">
            <div class="ai-orbit-float h-full w-full" style="animation-delay: -0.2s">
              <img [src]="asset + '/icon-excel.png'" alt="" class="h-full w-full object-cover" />
            </div>
          </div>
        </div>

        <div class="absolute left-[34.91%] top-[84.53%] h-[8.31%] w-[7.92%]">
          <div class="ai-orbit-counter h-full w-full">
            <div class="ai-orbit-float h-full w-full" style="animation-delay: -1.7s">
              <img
                [src]="asset + '/icon-powerpoint.png'"
                alt=""
                class="h-full w-full object-cover"
              />
            </div>
          </div>
        </div>

        <div class="absolute left-[95.28%] top-[30.53%] h-[8.24%] w-[5.97%]">
          <div class="ai-orbit-counter h-full w-full">
            <div
              class="ai-orbit-float h-full w-full overflow-hidden"
              style="animation-delay: -3.1s"
            >
              <img
                [src]="asset + '/icon-chart.png'"
                alt=""
                class="absolute left-[-61.21%] top-0 h-full w-[223.64%] max-w-none"
              />
            </div>
          </div>
        </div>

        <div class="absolute left-[79.81%] top-[51.92%] h-[10.38%] w-[8.87%]">
          <div class="ai-orbit-counter h-full w-full">
            <div
              class="ai-orbit-float h-full w-full overflow-hidden"
              style="animation-delay: -4.4s"
            >
              <img
                [src]="asset + '/icon-copilot.png'"
                alt=""
                class="absolute left-[-31.69%] top-[-26.4%] h-[155.33%] w-[167.21%] max-w-none"
              />
            </div>
          </div>
        </div>

        <div class="absolute left-[-3.02%] top-[54.83%] h-[8.93%] w-[9.62%]">
          <div class="ai-orbit-counter h-full w-full">
            <div
              class="ai-orbit-float h-full w-full overflow-hidden"
              style="animation-delay: -2.5s"
            >
              <img
                [src]="asset + '/icon-word.png'"
                alt=""
                class="absolute left-[-28.75%] top-0 h-full w-[152.66%] max-w-none"
              />
            </div>
          </div>
        </div>

        <div class="absolute left-[82.45%] top-[81.67%] h-[8.15%] w-[7.4%]">
          <div class="ai-orbit-counter h-full w-full">
            <div
              class="ai-orbit-float flex h-full w-full items-center justify-center"
              style="animation-delay: -5.2s"
            >
              <div class="h-[78.39%] w-[78.39%] rotate-[-19.42deg]">
                <img
                  [src]="asset + '/icon-outlook.png'"
                  alt=""
                  class="h-full w-full object-cover"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Miles Masterclass lockup + kicker, centred in the orbit -->
      <div
        class="absolute left-[34.91%] top-[38.21%] flex w-[30%] flex-col items-center gap-[13px]"
      >
        <!-- aspect-ratio pins the lockup to Figma's 104.29x30.01 instead of
             leaning on the logo SVG's own viewBox ratio. -->
        <ng-icon [svg]="logoSvg" class="block! h-auto! w-[80%]! aspect-[104.29/30.01]" />
        <p class="text-center text-[13px] font-extrabold leading-[1.2] text-white sm:text-[19px]">
          Presents AI LAB
        </p>
      </div>
    </div>
  </div>

  <div class="flex flex-col items-center gap-8 px-[3.59%] pb-[3.59%] sm:gap-[45px]">
    <div class="flex w-full flex-col items-center gap-[12px]">
      <span
        class="rounded-full border border-white/10 bg-white/8 px-[12px] py-[6px] text-[12px] leading-[normal] font-bold whitespace-nowrap text-white backdrop-blur-[6px]"
      >
        🚀 New Feature Launch
      </span>

      <h2
        class="w-full text-center text-2xl leading-[1.2] font-extrabold text-white sm:text-[32px]"
      >
        Build Accounting
        <span class="bg-linear-to-r from-[#8b5cf6] to-[#06b6d4] bg-clip-text text-transparent">
          AI Agents
        </span>
      </h2>

      <p class="w-full text-center text-sm leading-[1.6] text-[#94a3b8] sm:text-[15px]">
        Supercharge your financial operations. Experience the next generation of automated
        accounting and intelligent agents, built right into your workspace.
      </p>
    </div>

    <div class="flex w-full max-w-[348px] flex-col items-center gap-[14px]">
      <app-button class="h-[52px] w-full rounded-[14px] bg-linear-to-r" (clicked)="exploreLab()">
        Explore the Lab
      </app-button>

      <!-- <app-button
        variant="ghost"
        class="h-auto py-[13px] text-[13px] leading-[normal] font-semibold text-[#94a3b8] opacity-90 hover:opacity-100"
        (clicked)="dialogRef.close()"
      >
        Maybe Later
      </app-button> -->
    </div>
  </div>

  <div class="absolute right-[15px] top-[15px]">
    <app-button variant="close" (clicked)="dialogRef.close()" />
  </div>
</div>
