<div class="p-6 text-center sm:p-8">
  <div
    class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-accent/15 text-accent"
  >
    <svg
      class="h-6 w-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
      <path d="M8 16H3v5"></path>
    </svg>
  </div>

  <h2 class="text-lg font-semibold text-dialog-foreground">A new version is available</h2>
  <p class="mt-2 text-sm text-muted-foreground">
    We've shipped an update to Miles Masterclass. Update now to get the latest version.
  </p>

  <button
    type="button"
    [disabled]="updating()"
    (click)="update()"
    class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-md bg-primary px-4 py-2.5 text-sm font-semibold text-accent-foreground transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-60"
  >
    @if (updating()) {
      <span
        class="h-4 w-4 animate-spin rounded-full border-2 border-primary-foreground/40 border-t-primary-foreground"
        aria-hidden="true"
      ></span>
      Updating…
    } @else {
      Update now
    }
  </button>
</div>
