<div
  class="bg-linear-to-b from-[#0f2237] to-[#1a3a5c] flex flex-col md:max-w-[760px] w-[95svw] max-h-[85svh] mx-auto overflow-hidden relative rounded-xl"
  role="dialog"
>
  <!-- Close Button -->
  <app-button
    variant="close"
    [class]="'absolute top-3 right-3 z-10'"
    (clicked)="close()"
    aria-label="Close dialog"
  />

  <!-- Content -->
  <div class="flex-1 overflow-y-auto px-6 py-8 sm:px-10 sm:py-10">
    <!-- Heading -->
    <h2 class="text-2xl sm:text-3xl font-extrabold text-white text-center leading-tight">
      Why Pay If Your Firm Might?
    </h2>

    <!-- Description -->
    <p class="text-sm text-gray-300 text-center mt-4 leading-relaxed max-w-md mx-auto">
      Many professionals get their learning sponsored by their firms. Share your L&D contact and
      we'll do the heavy lifting, from reaching out to positioning the value of sponsoring your
      learning before you subscribe on your own.
    </p>

    <!-- Form -->
    <app-forms type="signal" class="mt-8" (submitted)="submit()">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Company Select -->
        <app-aria-autocomplete
          id="company"
          label="Select Company"
          placeholder="Select Company"
          [options]="companyOptions()"
          [formField]="sponsorshipForm.company"
          (queryChange)="onCompanySearch($event)"
        />

        <!-- SPOC Email -->
        <app-aria-input
          id="spocEmail"
          type="email"
          label="L&D SPOC Email"
          placeholder="Enter Email of your L&D"
          [formField]="sponsorshipForm.spocEmail"
        />
      </div>

      <!-- Consent Checkbox -->
      <div class="mt-6">
        <app-aria-input
          id="firm-sponsorship-consent"
          type="checkbox"
          label="I consent to Miles referencing my name while connecting with my firm's learning team."
          [formField]="sponsorshipForm.consent"
        />
      </div>

      <!-- Buttons -->
      <div class="flex flex-col sm:flex-row gap-3 mt-8 justify-center">
        <app-button variant="secondary" size="lg" (clicked)="subscribeAnyway()">
          Subscribe Anyway
        </app-button>
        <app-button
          variant="default"
          size="lg"
          type="submit"
          [disabled]="sponsorshipForm().invalid()"
        >
          Submit
        </app-button>
      </div>
    </app-forms>
  </div>
</div>
