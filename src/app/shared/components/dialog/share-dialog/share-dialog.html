<div
  class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col md:max-w-[500px] w-[95svw] mx-auto overflow-hidden relative rounded-xl"
  role="dialog"
>
  <div
    class="flex items-center justify-between px-4 py-2 border-b border-border z-10 relative shrink-0"
  >
    <span></span>

    <app-button variant="close" (clicked)="close()" aria-label="Close dialog" />
  </div>

  <div class="p-8 text-center">
    <p class="text-gray-300 mb-2 text-left text-sm">Share this link</p>

    <div
      class="flex items-center justify-between bg-gray-800 p-1.5 rounded-lg border border-gray-700"
    >
      <div class="truncate text-sm text-gray-300 px-2 flex-1 text-left select-all">
        {{ url() }}
      </div>
      <app-button variant="default" size="sm" (clicked)="copy()">
        <div class="flex items-center gap-2">
          @if (copied()) {
            <ng-icon [svg]="icons().check" class="text-lg" />
            <span>Copied</span>
          } @else {
            <ng-icon [svg]="icons().link" class="text-lg" />
            <span>Copy</span>
          }
        </div>
      </app-button>
    </div>
  </div>
</div>
