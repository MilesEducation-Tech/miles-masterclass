@let b = badge();
<section
  class="relative w-[calc(100vw-2rem)] max-w-lg min-w-2xs rounded-3xl bg-[#0E0E10] p-6 text-center text-white shadow-2xl md:p-10"
  role="dialog"
  aria-labelledby="badge-upsell-title"
>
  <app-button variant="close" class="absolute top-4 right-4" (clicked)="onClose()"></app-button>

  @if (b) {
    <div class="relative mx-auto mb-6 h-40 w-40">
      <div
        class="absolute inset-0 rounded-full opacity-60 blur-3xl"
        [style.background-color]="haloHex()"
        aria-hidden="true"
      ></div>
      @if (b.image_url) {
        <img
          [src]="b.image_url"
          [alt]="b.name"
          class="relative h-full w-full object-contain"
          draggable="false"
        />
      }
    </div>

    <h2 id="badge-upsell-title" class="text-2xl font-bold md:text-3xl">
      Subscribe to claim {{ badgeName() }}
    </h2>
    <p class="mt-3 text-sm leading-relaxed text-gray-300">
      Upgrade to an active subscription to claim your Credly badge and showcase your CPE progress on
      LinkedIn.
    </p>
  }

  <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
    <app-button variant="outline" class="w-full sm:w-auto" (clicked)="onClose()">
      Not now
    </app-button>
    <app-button class="w-full sm:w-auto" (clicked)="onConfirm()">Subscribe Now</app-button>
  </div>
</section>
