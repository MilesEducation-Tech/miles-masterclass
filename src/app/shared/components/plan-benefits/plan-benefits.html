<div class="flex max-md:flex-col max-md:gap-10 md:gap-8">
  <div class="md:w-3/5 w-full flex flex-col justify-center max-md:items-center">
    <div class="flex flex-col gap-4 md:w-4/5 w-full">
      <h2 class="md:text-4xl text-2xl font-bold leading-tight!">
        <ng-content select="[slot=heading]">{{ heading() }}</ng-content>
      </h2>
      <ng-content />
    </div>
  </div>
  <div class="md:w-2/5 w-full">
    <div class="flex flex-col space-y-4 w-full">
      @for (point of planPointers(); track point.id) {
        <div class="flex items-start space-x-2 text-foreground">
          <ng-icon
            [svg]="iconSvg(point.planfeature.icon)"
            class="w-5 h-5 my-auto shrink-0"
            aria-hidden="true"
          />
          <p class="text-sm">{{ point.planfeature.name }}</p>
        </div>
        @if (!$last) {
          <hr class="border-white/10" />
        }
      }
    </div>
  </div>
</div>
