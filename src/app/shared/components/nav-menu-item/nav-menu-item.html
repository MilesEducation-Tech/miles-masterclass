@if (item().type === 'link') {
  <a
    [routerLink]="utils.localePath(item().route)"
    [queryParams]="item().queryParams"
    [attr.aria-current]="isActiveRoute(item().route) ? 'page' : null"
    (click)="onLink()"
    class="flex flex-col py-2.5 px-3.5 rounded-lg text-sm text-foreground/90 no-underline hover:bg-white/5 hover:text-accent transition-all duration-200 cursor-pointer outline-none focus:bg-accent/12 focus:text-accent"
  >
    <span>{{ item().label }}</span>
    @if (item().subLabel) {
      <span class="text-xs text-muted-foreground">{{ item().subLabel }}</span>
    }
  </a>
}

@if (item().type === 'button') {
  <button
    type="button"
    (click)="onAction()"
    class="w-full text-start flex flex-col py-2.5 px-3.5 rounded-lg text-sm text-foreground/90 bg-transparent border-0 hover:bg-white/5 hover:text-accent transition-all duration-200 cursor-pointer outline-none focus:bg-accent/12 focus:text-accent"
  >
    <span>{{ item().label }}</span>
  </button>
}

@if (item().type === 'menu' && item().children?.length) {
  <div
    class="relative"
    ngpCollapsible
    [ngpCollapsibleOpen]="subPanelOpen()"
    (ngpCollapsibleOpenChange)="subPanelOpen.set($event)"
  >
    <button
      #triggerBtn
      type="button"
      ngpCollapsibleTrigger
      [class]="
        cn(
          'w-full text-start flex items-center justify-between gap-2 py-2.5 px-3.5 rounded-lg text-sm text-foreground/90 bg-transparent border-0 hover:bg-white/5 hover:text-accent  transition-all duration-200 cursor-pointer outline-none focus:outline-none focus:ring-2 focus:ring-ring/40',
          hasActiveChild(item()) && 'text-accent'
        )
      "
    >
      <span>{{ item().label }}</span>
      <ng-icon name="lucideChevronRight" size="16" class="rtl:-scale-x-100" aria-hidden="true" />
    </button>

    <div
      ngpCollapsibleContent
      [class]="
        cn(
          'mt-1 ms-3 bg-muted rounded-lg p-2 z-1010 animate-[dropdownFadeIn_0.2s_cubic-bezier(0.4,0,0.2,1)] motion-reduce:animate-none',
          'lg:mt-0 lg:ms-0 lg:absolute lg:top-0 lg:min-w-[220px] lg:max-w-[300px] lg:bg-popover lg:rounded-xl lg:p-2 lg:shadow-glass',
          flipped() ? 'lg:end-full lg:me-1' : 'lg:start-full lg:ms-1'
        )
      "
    >
      @for (child of item().children; track child.label) {
        <app-nav-menu-item [item]="child" (navigated)="bubble()" />
      }
    </div>
  </div>
}
