<div class="w-full aspect-9/16 overflow-hidden rounded-lg flex flex-col relative group/card">
  <button
    type="button"
    class="absolute top-3 right-3 z-30 size-9 rounded-full bg-black/50 hover:bg-black/70 text-white flex items-center justify-center pointer-events-auto cursor-pointer transition-colors"
    [attr.aria-label]="card().added_bookmark ? 'Remove bookmark' : 'Add bookmark'"
    (click)="toggleBookmark($event)"
  >
    <ng-icon
      [svg]="card().added_bookmark ? icons().matBookmarkRound : icons().matBookmarkBorderRound"
      class="size-5"
    />
  </button>
  <div
    class="absolute bottom-0 left-1/2 -translate-x-1/2 text-xs px-2 py-0.5 flex items-center justify-center gap-0.5 w-max h-max z-20 rounded-t-lg overflow-hidden text-white group-hover/card:opacity-0 transition-opacity duration-300 opacity-100"
  >
    <app-caira-credly-badge
      [includedForCaira]="card().included_for_caira"
      [hasIndividualBadge]="card().has_individual_badge"
      [cairaLevel]="card().caira_level"
      variant="inline"
    />
  </div>
  <div
    class="absolute inset-0 w-full h-full z-0"
    role="button"
    tabindex="0"
    [attr.aria-label]="card().title"
    (click)="handleCardClick()"
    (keydown.enter)="handleCardClick()"
    (keydown.space)="handleCardClick(); $event.preventDefault()"
  >
    @if (thumbnail(); as src) {
      <img
        [ngSrc]="src"
        [alt]="card().title"
        class="object-cover w-full h-full group-hover/card:scale-105 transition-transform duration-300 relative z-0"
        fill
        draggable="false"
      />
    }
  </div>
  <div
    class="absolute left-0 bottom-0 w-full h-full flex flex-col justify-end bg-linear-to-t from-background from-20% via-background/70 via-30% to-50% to-transparent z-10 group-hover/card:opacity-100 transition-opacity duration-300 opacity-0 p-4 space-y-2 pointer-events-none"
  >
    <div class="flex flex-col items-center justify-end gap-2">
      <app-categories-list
        class="text-white text-xs font-medium w-full"
        align="center"
        [items]="card().fields_of_study ?? []"
      />
      <app-caira-credly-badge
        [includedForCaira]="card().included_for_caira"
        [hasIndividualBadge]="card().has_individual_badge"
        [cairaLevel]="card().caira_level"
        variant="inline"
      />
      <!-- <p class="text-white text-sm font-bold line-clamp-1">
        {{ card().title }}
      </p>
      <p class="text-slate-200 text-xs font-medium line-clamp-1">
        @let instructorName =
          card().instructor_details.first_name + ' ' + card().instructor_details.last_name;
        By {{ instructorName }}
      </p> -->
    </div>
    <p
      class="text-[#B0B0B3] text-xs md:font-medium font-normal line-clamp-2 tracking-[2%]! text-center"
    >
      {{ card().course_short_overview }}
    </p>
    <div class="flex justify-between items-center space-x-2 pointer-events-auto">
      @if (card().has_additional_resources) {
        <!-- Compact icon-only Trailer makes room for the AI Kit CTA -->
        <app-button
          size="icon"
          class="shrink-0 bg-white text-black rounded-full! hover:bg-white hover:text-black"
          ariaLabel="Watch trailer"
          (clicked)="openVideoDialog()"
        >
          <ng-icon [svg]="icons().faSolidPlay" class="size-4" />
        </app-button>
        <div
          class="flex flex-1 rounded-full justify-center items-center bg-linear-to-r from-white to-transparent to-70% p-px overflow-hidden"
          role="button"
          tabindex="0"
          (click)="openAdditionalResources()"
          (keydown.enter)="openAdditionalResources()"
          (keydown.space)="openAdditionalResources(); $event.preventDefault()"
        >
          <app-button variant="ghost" class="w-full bg-background rounded-full! gap-2">
            <ng-icon [svg]="icons().faSolidRobot" class="size-4" />
            AI Kit
          </app-button>
        </div>
      } @else {
        <app-button
          class="w-full bg-white text-black rounded-md hover:bg-white hover:text-black gap-2"
          (clicked)="openVideoDialog()"
        >
          <ng-icon [svg]="icons().faSolidPlay" class="size-4" />
          Trailer
        </app-button>
      }
      <div
        class="flex items-center justify-center size-10 aspect-square bg-secondary rounded-full outline outline-white/40 cursor-pointer shrink-0"
        role="button"
        tabindex="0"
        aria-label="Course information"
        (click)="openCourseInfo()"
        (keydown.enter)="openCourseInfo()"
        (keydown.space)="openCourseInfo(); $event.preventDefault()"
      >
        <ng-icon [svg]="icons().faSolidInfo" class="size-8" />
      </div>
    </div>
  </div>
</div>
