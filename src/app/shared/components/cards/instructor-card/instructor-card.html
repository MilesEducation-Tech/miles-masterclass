@let i = instructor();
@let fullName = i.first_name + ' ' + i.last_name;
<div
  class="w-full aspect-9/16 overflow-hidden rounded-lg flex flex-col relative group/card cursor-pointer"
  role="button"
  tabindex="0"
  [attr.aria-label]="fullName"
  (click)="handleClick()"
  (keydown.enter)="handleClick()"
  (keydown.space)="handleClick(); $event.preventDefault()"
>
  @if (i.profile_image) {
    <img
      [ngSrc]="i.profile_image"
      [alt]="fullName"
      class="object-cover w-full h-full group-hover/card:scale-105 transition-transform duration-300 relative z-0"
      fill
      draggable="false"
    />
  } @else {
    <div
      class="w-full h-full bg-secondary flex items-center justify-center text-muted-foreground text-xs"
      aria-hidden="true"
    >
      {{ i.first_name.charAt(0) }}{{ i.last_name.charAt(0) }}
    </div>
  }
  <div
    class="absolute left-0 bottom-0 w-full flex flex-col justify-end bg-linear-to-t from-black from-50% to-transparent z-10 p-4 space-y-1 pointer-events-none"
  >
    <p class="text-white text-sm font-bold line-clamp-1">{{ fullName }}</p>
    <p class="text-slate-200 text-xs font-medium line-clamp-2">{{ i.designation }}</p>
  </div>
  @if (socials().length) {
    <ul
      class="absolute top-3 right-3 z-20 flex flex-col gap-2 pointer-events-auto"
      [attr.aria-label]="fullName + ' social links'"
    >
      @for (s of socials(); track s.label) {
        <li>
          <a
            [href]="s.url"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="s.label"
            class="inline-flex items-center justify-center size-8 rounded-full bg-white/90 text-black"
            (click)="$event.stopPropagation()"
            (keydown.enter)="$event.stopPropagation()"
            (keydown.space)="$event.stopPropagation()"
          >
            <ng-icon [name]="s.icon" size="16" aria-hidden="true" />
          </a>
        </li>
      }
    </ul>
  }
</div>
