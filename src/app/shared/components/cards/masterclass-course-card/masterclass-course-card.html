@let c = course();

@if (layout() === 'vertical') {
  <!-- The shared `app-vertical` design. -->
  <div class="w-full aspect-9/16 overflow-hidden rounded-lg flex flex-col relative group/card">
    <div
      class="absolute bottom-0 left-1/2 -translate-x-1/2 text-xs px-2 py-0.5 flex items-center justify-center gap-0.5 w-max h-max z-20 rounded-t-lg overflow-hidden text-white group-hover/card:opacity-0 transition-opacity duration-300 opacity-100"
    >
      <app-caira-credly-badge
        [includedForCaira]="c.included_for_caira"
        [hasIndividualBadge]="c.has_individual_badge"
        variant="inline"
      />
    </div>
    <a
      class="absolute inset-0 w-full h-full z-0"
      [routerLink]="courseLink()"
      [attr.aria-label]="c.title"
    >
      @if (thumbnail(); as src) {
        <img
          [ngSrc]="src"
          [alt]="c.title"
          class="object-cover w-full h-full group-hover/card:scale-105 transition-transform duration-300 relative z-0"
          fill
          draggable="false"
        />
      }
    </a>
    <div
      class="absolute start-0 bottom-0 w-full h-full flex flex-col justify-end bg-linear-to-t from-background from-20% via-background/70 via-30% to-50% to-transparent z-10 group-hover/card:opacity-100 transition-opacity duration-300 opacity-0 p-4 space-y-2 pointer-events-none"
    >
      <div class="flex flex-col items-center justify-end gap-2">
        <app-categories-list
          class="text-white text-xs font-medium w-full"
          align="center"
          [items]="c.fields_of_study"
        />
        <app-caira-credly-badge
          [includedForCaira]="c.included_for_caira"
          [hasIndividualBadge]="c.has_individual_badge"
          variant="inline"
        />
      </div>
      <p
        class="text-[#B0B0B3] text-xs md:font-medium font-normal line-clamp-2 tracking-[2%]! text-center"
      >
        {{ c.short_description }}
      </p>
      <div class="flex justify-between items-center space-x-2 pointer-events-auto">
        <button
          app-button
          type="button"
          class="w-full bg-white text-black rounded-md hover:bg-white hover:text-black gap-2"
          (click)="trailer.emit(c)"
        >
          <ng-icon [svg]="icons.faSolidPlay" class="size-4" />
          Trailer
        </button>
      </div>
    </div>
  </div>
} @else {
  <!-- The shared `app-horizontal` design (its course branch, not the webinar one). -->
  <div class="flex flex-col space-y-2 group/card">
    <a
      class="w-full aspect-video overflow-hidden rounded-lg flex flex-col relative"
      [routerLink]="courseLink()"
      [attr.aria-label]="c.title"
    >
      <div class="relative inset-0 w-full h-full z-0">
        @if (thumbnail(); as src) {
          <img
            [ngSrc]="src"
            [alt]="c.title"
            class="object-cover w-full h-full group-hover/card:scale-105 transition-transform duration-300 relative z-0"
            fill
            draggable="false"
          />
        }
      </div>
      <div
        class="absolute inset-0 w-full h-full bg-linear-to-t from-black to-50% to-transparent z-10 group-hover/card:opacity-100 transition-opacity duration-300 opacity-0"
      ></div>
    </a>
    <a
      class="flex flex-col space-y-1"
      [routerLink]="courseLink()"
      [attr.aria-label]="c.title + ' details'"
    >
      <h3 class="text-white text-sm font-medium line-clamp-2">
        {{ c.short_description }}
      </h3>
      <div class="flex items-center justify-between gap-2 min-w-0 min-h-10">
        <app-categories-list
          class="text-muted-foreground text-sm min-w-0 flex-1 truncate"
          [items]="c.fields_of_study"
        />
        <app-caira-credly-badge
          class="shrink-0"
          [includedForCaira]="c.included_for_caira"
          [hasIndividualBadge]="c.has_individual_badge"
          variant="inline"
        />
      </div>
    </a>
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <button
          app-button
          type="button"
          class="bg-white text-black hover:bg-white hover:text-black rounded-md gap-2"
          variant="default"
          (click)="trailer.emit(c)"
        >
          <ng-icon [svg]="icons.faSolidPlay" class="size-4" />
          Trailer
        </button>
      </div>
      @if (c.total_cpe_credits !== null) {
        <button
          app-button
          type="button"
          class="text-accent hover:bg-transparent border-accent rounded-md cursor-default"
          variant="outline"
        >
          {{ c.total_cpe_credits }} CPE
        </button>
      }
    </div>
  </div>
}
