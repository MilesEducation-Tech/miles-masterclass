<!--
  Carousel/section rail title. This is `app-heading`'s only consumer
  (app-carousel), and a content rail is a subsection of the page, so it's an
  <h2> (not <h1>) to sit under the page's single hero <h1>. The subtitle is a
  description, not a heading, so it's a <p> — keeping it out of the heading
  outline (audit: "section titles are H3 without preceding H2").
-->
<h2 class="md:text-2xl text-lg font-bold">{{ heading().text }}</h2>
@if (heading().subText) {
  <p class="md:text-sm text-xs line-clamp-1 font-normal text-muted-foreground">
    {{ heading().subText }}
  </p>
}
