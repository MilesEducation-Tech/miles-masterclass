<div [class.pt-32]="standalone()">
  <div class="container mx-auto">
    <!-- Header with mode toggle -->
    <div class="flex items-center justify-between mb-8">
      <!--
        <h1> only on the standalone /faq route. When embedded in the home page
        (standalone=false) this must be an <h2> so it doesn't hijack the page
        <h1> (audit: "the only <h1> on the home page was the FAQ heading").
      -->
      @if (standalone()) {
        <h1 class="text-2xl md:text-3xl font-bold text-white">Frequently Asked Questions</h1>
      } @else {
        <h2 class="text-2xl md:text-3xl font-bold text-white">Frequently Asked Questions</h2>
      }
      <button
        class="text-sm sr-only px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white transition-all duration-200 flex items-center gap-2"
        (click)="toggleMode()"
        type="button"
      >
        <span class="hidden sm:inline">Mode:</span>
        <span class="font-medium text-white">{{
          accordionMode() === 'single' ? 'Single' : 'Multi'
        }}</span>
      </button>
    </div>

    <!-- FAQ Items -->
    @for (faq of faqs(); track faq.id) {
      <app-faq-item
        [faq]="faq"
        [level]="0"
        [mode]="accordionMode()"
        [openFaqId]="openFaqId()"
        (faqToggled)="handleFaqToggle($event)"
      />
    }
  </div>
</div>
