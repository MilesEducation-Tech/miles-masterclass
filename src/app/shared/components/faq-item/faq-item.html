<div
  class="rounded-lg overflow-hidden mb-3"
  [class.border-l-2]="level() > 0"
  [class.border-gray-600]="level() > 0"
>
  <button
    class="group relative w-full px-5 py-4 bg-gray-800 hover:bg-gray-750 transition-all delay-300 duration-200 flex items-center justify-between gap-4 text-left cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950"
    [class.rounded-t-lg]="!isOpen()"
    [class.rounded-lg]="!isOpen()"
    [class.rounded-b-none]="isOpen()"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="'panel-' + faq().id"
    type="button"
  >
    <div class="flex items-center gap-3 flex-1">
      <span
        class="font-normal text-white text-base md:text-lg transition-colors duration-200"
        [class.text-gray-300]="level() > 0"
      >
        {{ faq().question }}
      </span>
    </div>
    <ng-icon
      [svg]="icons().matKeyboardArrowDownRound"
      class="w-6! h-6! text-white shrink-0 transition-transform duration-300 ease-out origin-center"
      [class.rotate-180]="isOpen()"
      aria-hidden="true"
    />
  </button>

  <div
    [id]="'panel-' + faq().id"
    class="grid overflow-hidden transition-[grid-template-rows] duration-350 ease-[cubic-bezier(0.4,0,0.2,1)]"
    [class.grid-rows-[0fr]]="!isOpen()"
    [class.grid-rows-[1fr]]="isOpen()"
    role="region"
  >
    <div class="overflow-hidden">
      <div class="bg-gray-900 border-t border-gray-700">
        <div class="px-5 py-5">
          <app-faq-content [content]="faq().content" />

          @if (faq().children?.length) {
            <div class="mt-6 space-y-3">
              @for (child of faq().children ?? []; track child.id; let i = $index) {
                <app-faq-item
                  class="block animate-fade-in"
                  [style.animation-delay.ms]="i * 50"
                  [faq]="child"
                  [level]="level() + 1"
                  [mode]="mode()"
                  [openFaqId]="openChildId()"
                  (faqToggled)="handleChildToggle($event)"
                />
              }
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
