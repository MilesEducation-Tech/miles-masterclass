<div class="relative w-full aspect-square group">
  <!-- Record Disk -->
  <div
    class="absolute inset-0 z-0 transition-transform duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] rounded-full will-change-transform shadow-[0_0_20px_rgba(0,0,0,0.8)]"
    [style.transform]="diskTransformStyle()"
  >
    <!-- Vinyl Grooves -->
    <div
      class="relative w-full h-full rounded-full overflow-hidden bg-black border-[3px] border-[#222] shadow-inner"
      [class.record-spin]="isAnimating()"
      [style.--spin-duration]="spinDuration()"
    >
      <!-- Realism Grooves -->
      <div
        class="absolute inset-[12%] rounded-full border border-white/5 pointer-events-none"
      ></div>
      <div
        class="absolute inset-[18%] rounded-full border border-white/10 opacity-50 pointer-events-none"
      ></div>
      <div
        class="absolute inset-[24%] rounded-full border border-white/5 opacity-80 pointer-events-none"
      ></div>
      <div
        class="absolute inset-[30%] rounded-full border-[1.5px] border-white/8 pointer-events-none"
      ></div>
      <div
        class="absolute inset-[36%] rounded-full border border-white/5 pointer-events-none"
      ></div>
      <div
        class="absolute inset-[42%] rounded-full border shadow-[inset_0_0_8px_rgba(0,0,0,0.5)] border-[#1a1a1a] pointer-events-none"
      ></div>

      <!-- Center Label Graphic -->
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[36%] aspect-square rounded-full border-4 border-[#2a2a2a] overflow-hidden bg-white shadow-md"
      >
        @if (diskImage() || coverImage()) {
          <img
            [src]="diskImage() || coverImage()"
            class="w-full h-full object-cover opacity-90 brightness-90 saturate-150"
            alt="Record label"
          />
        }
      </div>

      <!-- Spindle Hole -->
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[4%] aspect-square rounded-full bg-zinc-950 shadow-[inset_0_2px_4px_rgba(0,0,0,0.8)] border-[0.5px] border-zinc-700/50"
      ></div>

      <!-- Vinyl Gloss / Reflection -->
      <div
        class="absolute inset-0 rounded-full bg-linear-to-tr from-transparent via-white/8 to-transparent mix-blend-overlay pointer-events-none"
      ></div>
      <div
        class="absolute inset-0 rounded-full bg-[conic-gradient(from_0deg,transparent_0deg,rgba(255,255,255,0.1)_45deg,transparent_90deg,transparent_180deg,rgba(255,255,255,0.1)_225deg,transparent_270deg)] mix-blend-overlay pointer-events-none"
      ></div>
    </div>
  </div>

  <!-- Cover Sleeve -->
  @if (!diskOnly()) {
    <div
      class="absolute inset-0 z-10 shadow-2xl rounded-sm overflow-hidden bg-zinc-900 border border-white/10 ring-1 ring-black/30 transition-transform duration-300"
    >
      @if (coverImage()) {
        <img [src]="coverImage()" class="w-full h-full object-cover" alt="Album Cover" />
      }
      <!-- Sleeve highlight/shadow for realism -->
      <div
        class="absolute inset-0 bg-linear-to-br from-white/10 via-transparent to-black/60 pointer-events-none mix-blend-overlay"
      ></div>
      <div
        class="absolute inset-y-0 left-0 w-[4%] bg-linear-to-r from-black/20 via-white/10 to-transparent pointer-events-none mix-blend-overlay border-r border-white/5"
      ></div>
      <div
        class="absolute inset-0 ring-1 ring-inset ring-white/5 rounded-sm pointer-events-none"
      ></div>
    </div>
  }
</div>
