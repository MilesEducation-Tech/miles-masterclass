<div class="grid items-center gap-10 md:grid-cols-2 md:gap-6">
  <div class="flex flex-col items-start">
    <h2 class="text-3xl leading-tight font-bold md:text-[42px]">Learning on the go</h2>
    <p class="text-muted-foreground mt-3 text-sm md:text-base">
      Everything on desktop, built for your phone.
    </p>

    <ul class="mt-8 space-y-4 text-sm font-medium md:text-base">
      @for (point of points; track point) {
        <li class="flex items-center gap-4">
          <span class="size-1 shrink-0 rounded-full bg-white" aria-hidden="true"></span>
          {{ point }}
        </li>
      }
    </ul>

    <!-- Phones scan nothing; the QR only earns its space on desktop. -->
    <div class="mt-10 flex w-40 flex-col items-center gap-2 max-md:hidden">
      <img
        [ngSrc]="qrSrc"
        alt="QR code — scan to download the Miles Masterclass app"
        width="173"
        height="173"
        class="size-40"
        draggable="false"
      />
      <p class="text-[11px] text-neutral-300">Scan to download</p>
    </div>

    <ul class="mt-8 flex w-full max-w-[340px] gap-4">
      @for (store of storeLinks; track store.url) {
        <li class="flex-1">
          <a
            [href]="store.url"
            target="_blank"
            rel="noopener noreferrer"
            draggable="false"
            class="flex h-[46px] items-center gap-2 rounded-lg bg-neutral-700 px-2 transition-colors hover:bg-neutral-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/60"
          >
            <ng-icon [svg]="store.icon" class="size-8! shrink-0" aria-hidden="true" />
            <span class="flex flex-col gap-0.5 leading-none">
              <span class="text-[8px]">Get it on</span>
              <span class="text-base font-medium">{{ store.label }}</span>
            </span>
          </a>
        </li>
      }
    </ul>
  </div>

  <div class="relative flex justify-center md:justify-end md:pr-[6%]">
    <!-- The design's oversized, near-invisible download mark behind the phone:
         the arrow fades in, then a ring draws itself from 12 o'clock and loops.
         Inline SVG (not ng-icon) so the ring's stroke can be animated; the
         keyframes are the @theme tokens in styles.css. -->
    <svg
      viewBox="-2 -2 28 28"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="pointer-events-none absolute top-[8%] left-[2%] size-[16rem] text-white/8 md:size-[24rem]"
      aria-hidden="true"
    >
      <path
        class="animate-download-arrow-in motion-reduce:animate-none"
        d="M12 5v14m7-7-7 7-7-7"
        stroke-width="2"
      />
      <!-- pathLength=1 makes the dash maths unitless; -90° starts it at the top. -->
      <circle
        class="animate-download-ring-draw stroke-accent [stroke-dasharray:1] [stroke-dashoffset:1] motion-reduce:animate-none motion-reduce:[stroke-dashoffset:0]"
        cx="12"
        cy="12"
        r="13"
        stroke-width="1"
        pathLength="1"
        transform="rotate(-90 12 12)"
      />
    </svg>
    <img
      [ngSrc]="phoneSrc"
      alt="Miles Masterclass app open on a phone"
      width="687"
      height="788"
      class="relative w-3/4 max-w-[687px] mask-b-from-70% md:w-[85%]"
      draggable="false"
    />
  </div>
</div>
