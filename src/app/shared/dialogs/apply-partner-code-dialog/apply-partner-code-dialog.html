<div
  class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[95svw] md:w-[480px] mx-auto overflow-visible relative rounded-xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="apply-partner-code-title"
>
  <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 shrink-0">
    <h2 id="apply-partner-code-title" class="text-xl font-bold text-white">Apply partner code</h2>
    <app-button variant="close" size="sm" (clicked)="close()" aria-label="Close dialog" />
  </div>

  <div class="flex flex-col gap-4 px-6 py-6">
    <p class="text-sm text-white/70">
      Choose the partner code to apply to
      <span class="font-medium text-white break-all">{{ data.userEmail }}</span
      >.
    </p>

    <app-aria-autocomplete
      id="apply-partner-code"
      label="Partner code"
      placeholder="Search partner codes"
      emptyMessage="No partner codes found"
      [options]="data.options()"
      [(value)]="selected"
    />
  </div>

  <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-white/10 bg-white/3">
    <app-button variant="outline" size="default" class="text-white" (clicked)="close()">
      Cancel
    </app-button>
    <app-button variant="primary" size="default" [disabled]="!selected()" (clicked)="submit()">
      Apply code
    </app-button>
  </div>
</div>
