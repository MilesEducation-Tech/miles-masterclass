<div
  class="bg-linear-to-br from-[#0d1a2d] to-[#1a2332] shadow-2xl flex flex-col w-[90svw] max-w-[360px] mx-auto overflow-hidden relative rounded-xl"
  role="dialog"
>
  <div class="flex items-center justify-between px-4 py-2 z-10 relative shrink-0">
    <span></span>
    <app-button variant="close" (clicked)="close()" aria-label="Close dialog" />
  </div>

  <div class="px-6 pb-8 pt-2 text-center flex flex-col items-center gap-2">
    <h2 class="text-xl text-white font-semibold">Get the Miles Masterclass app</h2>
    <p class="text-muted-foreground text-sm mb-4">
      Watch this course on the go with the best mobile experience.
    </p>

    <div class="flex flex-col gap-3 w-full items-center">
      @for (link of storeLinks; track link.label) {
        <a
          draggable="false"
          target="_blank"
          rel="noopener noreferrer"
          [href]="link.url"
          (click)="close()"
        >
          <div class="bg-[#39434f] px-4 py-2 flex items-center rounded-md text-base gap-2 w-44">
            <ng-icon draggable="false" [svg]="link.icon" class="w-8! h-auto!" />
            <div class="flex flex-col justify-center text-left text-white">
              <p class="text-[10px] leading-none">Download on the</p>
              <p class="text-base font-bold">{{ link.label }}</p>
            </div>
          </div>
        </a>
      }
    </div>

    <button
      type="button"
      class="text-sm text-muted-foreground underline mt-3 cursor-pointer"
      (click)="close()"
    >
      Not now
    </button>
  </div>
</div>
