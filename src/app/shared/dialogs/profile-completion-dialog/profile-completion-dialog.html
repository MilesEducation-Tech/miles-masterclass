<app-dialog-shell maxWidth="95vw" ariaLabel="Complete your profile" [dismissible]="false">
  <div
    class="bg-linear-to-b from-[#0f2237] to-[#1a3a5c] flex flex-col md:max-w-[640px] w-[95svw] max-h-[85svh] mx-auto overflow-hidden relative rounded-xl"
  >
    <div class="absolute right-2 top-2">
      <app-button variant="close" (clicked)="dialogRef.close()"></app-button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-8 sm:px-10 sm:py-10">
      <h2 class="text-2xl sm:text-3xl font-extrabold text-white text-center leading-tight">
        Help us personalize your learning
      </h2>

      <p class="text-sm text-gray-300 text-center mt-4 leading-relaxed max-w-md mx-auto">
        Tell us where you work and what you do. We'll use this to recommendMaster Classes, podcasts
        and reels that match your day-to-day.
      </p>

      <app-forms type="signal" class="mt-8" (submitted)="submit()">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <app-aria-autocomplete
            id="profile-sector"
            label="Sector"
            placeholder="Select your sector"
            [options]="sectorOptions()"
            [formField]="profileForm.sector_id"
          />

          <app-aria-autocomplete
            id="profile-job-role"
            label="Job Role"
            placeholder="Select your role"
            [options]="jobRoleOptions()"
            [formField]="profileForm.job_role_id"
          />
        </div>

        <div class="flex justify-center mt-8">
          <app-button
            variant="default"
            size="lg"
            type="submit"
            [disabled]="profileForm().invalid() || loading()"
          >
            {{ loading() ? 'Saving…' : 'Save' }}
          </app-button>
        </div>
      </app-forms>
    </div>
  </div>
</app-dialog-shell>
