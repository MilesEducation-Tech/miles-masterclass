<div
  class="flex flex-col items-center justify-center gap-4 p-8 text-center bg-[#151F2B] rounded-lg max-w-md mx-auto"
>
  <div class="size-16 rounded-full bg-red-500/10 flex items-center justify-center">
    <svg
      class="size-8 text-red-400"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
      />
    </svg>
  </div>

  <h3 class="text-lg font-semibold text-gray-200">{{ title() }}</h3>
  <p class="text-sm text-gray-400">{{ message() }}</p>

  @if (showRetry()) {
    <app-button variant="default" (clicked)="retry.emit()">
      {{ retryLabel() }}
    </app-button>
  }
</div>
