@if (label()) {
  <label [for]="id()" class="label">
    {{ label() }}
    @if (required()) {
      <sup class="text-destructive ml-1" aria-hidden="true">*</sup>
    }
  </label>
}

<div
  ngpInputOtp
  class="group"
  [(ngpInputOtpValue)]="value"
  [ngpInputOtpDisabled]="isDisabled()"
  [ngpInputOtpPattern]="otpPattern()"
  [ngpInputOtpInputMode]="inputMode()"
  [ngpInputOtpPlaceholder]="placeholder()"
  (ngpInputOtpComplete)="completed.emit($event)"
>
  <!-- The one real control: visually hidden, but what the browser autofills and
       what assistive technology reads. The visible <label for> names it; the
       slots below are role="presentation". Required is announced here via
       aria-required, so the visual asterisk is aria-hidden. -->
  <input
    #otpInput
    ngpInputOtpInput
    [id]="id()"
    [name]="name() || id()"
    [attr.aria-label]="label() ? null : 'One-time code'"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="displayError() || null"
    [attr.aria-describedby]="describedBy()"
    (blur)="onBlur()"
  />

  <div class="flex gap-2">
    @for (slot of slots(); track slot) {
      <div ngpInputOtpSlot [class]="slotClasses()"></div>
    }
  </div>
</div>

@if (description()) {
  <p [id]="descriptionId()" class="text-sm text-muted-foreground font-normal mt-1">
    {{ description() }}
  </p>
}
@if (hint() && !displayError()) {
  <p [id]="hintId()" class="text-sm text-muted-foreground mt-1.5">
    {{ hint() }}
  </p>
}
@if (displayError()) {
  <div [id]="errorId()" role="alert">
    @for (error of errors(); track error.kind) {
      <p class="text-sm text-destructive mt-1.5">{{ error.message }}</p>
    }
  </div>
}
