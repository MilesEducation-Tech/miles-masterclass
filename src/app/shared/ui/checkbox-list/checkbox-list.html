<ul
  ngpListbox
  ngpListboxMode="multiple"
  [ngpListboxValue]="mutableSelected()"
  (ngpListboxValueChange)="onValuesChange($event)"
  class="flex flex-col gap-1 outline-none max-h-72 overflow-y-auto pr-1"
>
  @for (opt of options(); track opt.value) {
    <li
      ngpListboxOption
      #option="ngpListboxOption"
      [ngpListboxOptionValue]="opt.value"
      [attr.aria-selected]="option.selected()"
      class="group/opt flex items-center gap-2 px-2 py-1.5 rounded-md text-sm cursor-pointer select-none text-foreground data-[hover]:bg-secondary/40 data-[active]:bg-secondary/60 outline-none"
    >
      <span
        class="size-4 shrink-0 inline-flex items-center justify-center rounded border border-border/60 bg-secondary/30 group-data-[selected]/opt:bg-accent group-data-[selected]/opt:border-accent transition-colors"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 16 16"
          class="size-3 text-white opacity-0 group-data-[selected]/opt:opacity-100"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3.5 8.5l3 3 6-6" />
        </svg>
      </span>
      <span class="truncate">{{ opt.label }}</span>
    </li>
  }
</ul>
