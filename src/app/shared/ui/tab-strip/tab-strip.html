<div
  ngpTabset
  [ngpTabsetValue]="selected() ?? undefined"
  (ngpTabsetValueChange)="onSelectedChange($event)"
  [class]="rootClasses()"
>
  <div
    ngpTabList
    class="inline-flex items-center gap-1 p-1 rounded-full bg-secondary/40 border border-border/40"
  >
    @for (opt of options(); track opt) {
      <button ngpTabButton type="button" [ngpTabButtonValue]="opt" [class]="tabClasses()">
        {{ opt }}
      </button>
    }
  </div>
</div>
