<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Miles Masterclass - AI-Powered CPE Training for Accounting Professionals</title>
    <base href="/" />
    <!--
      Brand-default SEO tags. The `data-seo-default` flag pins these as a
      permanent floor: SeoManager.removePreviousTags skips them on route
      change so a page lacking (e.g.) og:image never inherits an empty slot
      between two SeoManager calls. SeoManager.updateTag still overwrites
      the `content` of these nodes in place — only deletion is suppressed.
    -->
    <meta
      name="description"
      data-seo-default="1"
      content="Finally, CPE that's all about AI in Accounting.Master Classes, Podcasts, Reels & Live Premieres."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" data-seo-default="1" content="website" />
    <meta property="og:url" data-seo-default="1" content="https://www.milesmasterclass.com/" />
    <meta
      property="og:title"
      data-seo-default="1"
      content="Miles Masterclass - AI-Powered CPE Training for Accounting Professionals"
    />
    <meta
      property="og:description"
      data-seo-default="1"
      content="Finally, CPE that's all about AI in Accounting.Master Classes, Podcasts, Reels & Live Premieres."
    />
    <meta
      property="og:image"
      data-seo-default="1"
      content="https://d1pp0977rsxmiq.cloudfront.net/static-assests/web-app/commons/index.webp"
    />
    <meta property="og:site_name" data-seo-default="1" content="Miles Masterclass" />

    <!-- Twitter -->
    <meta name="twitter:card" data-seo-default="1" content="summary_large_image" />
    <meta name="twitter:site" data-seo-default="1" content="@MilesEducation" />
    <meta name="twitter:creator" data-seo-default="1" content="@MilesEducation" />
    <meta
      name="twitter:title"
      data-seo-default="1"
      content="Miles Masterclass - AI-Powered CPE Training for Accounting Professionals"
    />
    <meta
      name="twitter:description"
      data-seo-default="1"
      content="Finally, CPE that's all about AI in Accounting.Master Classes, Podcasts, Reels & Live Premieres."
    />
    <meta
      name="twitter:image"
      data-seo-default="1"
      content="https://d1pp0977rsxmiq.cloudfront.net/static-assests/web-app/commons/index.webp"
    />
    <meta
      name="twitter:image:alt"
      data-seo-default="1"
      content="Miles Masterclass - AI-Powered CPE Training Platform"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Asset CDNs that serve the hero poster/video, images and media. Establishing
      the TLS connection early shaves the round-trip off the LCP image fetch
      (audit: "no dns-prefetch for asset CDNs").
    -->
    <link rel="preconnect" href="https://d1pp0977rsxmiq.cloudfront.net" crossorigin />
    <link rel="preconnect" href="https://asset.milesmasterclass.com" crossorigin />
    <link rel="dns-prefetch" href="https://d1pp0977rsxmiq.cloudfront.net" />
    <link rel="dns-prefetch" href="https://asset.milesmasterclass.com" />
    <!--
      Analytics / engagement origins (production only). Warming the TLS
      connection early means a consent-accepted tag doesn't pay the full
      handshake on its first beacon. Harmless in non-prod (no requests are made
      until consent + prod gating in the Analytics service).
    -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" crossorigin />
    <link rel="preconnect" href="https://cdnt.netcoresmartech.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://assets.calendly.com" />
    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  </head>
  <body class="antialiased">
    <svg style="position: absolute; width: 0; height: 0">
      <filter id="glass">
        <feTurbulence
          type="turbulence"
          baseFrequency="0.02"
          numOctaves="3"
          seed="2"
          result="turb"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="turb"
          scale="20"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <app-root></app-root>
  </body>
</html>
