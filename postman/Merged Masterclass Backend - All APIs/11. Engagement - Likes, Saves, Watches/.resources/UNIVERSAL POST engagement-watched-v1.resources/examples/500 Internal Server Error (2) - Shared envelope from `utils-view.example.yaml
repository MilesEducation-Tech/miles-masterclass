  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "target_kind": "homepage_content_item",
        "target_id": "00000000-0000-0000-0000-000000000000",
        "value": false
      }
