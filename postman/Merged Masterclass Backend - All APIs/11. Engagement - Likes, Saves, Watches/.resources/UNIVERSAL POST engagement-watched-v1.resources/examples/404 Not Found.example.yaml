$kind: http-example
request:
  url: "{{base_url}}/api/v1/engagement/watched/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "target_kind": "homepage_content_item",
        "target_id": "00000000-0000-0000-0000-000000000000",
        "value": false
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "target_not_found",
        "message": "<f\"No active {target_kind} with id '{target_id}'.\">"
      }
order: 5000
