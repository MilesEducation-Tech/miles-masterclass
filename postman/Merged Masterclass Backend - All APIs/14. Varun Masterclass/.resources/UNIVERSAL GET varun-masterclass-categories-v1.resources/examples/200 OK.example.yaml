$kind: http-example
request:
  url: "{{base_url}}/api/v1/varun-masterclass/categories/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Categories retrieved successfully!",
        "count": 0,
        "data": "<async_cache_get_or_set(VARUN_CATEGORIES_CACHE_KEY, self._build_categories, _CACHE_TTL, request=request)>"
      }
order: 1000
