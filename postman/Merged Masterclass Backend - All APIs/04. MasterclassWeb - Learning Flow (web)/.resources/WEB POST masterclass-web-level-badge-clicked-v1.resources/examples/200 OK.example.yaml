$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass-web/level-badge-clicked/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "credly_assertion_id": ""
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": true,
        "data": {
          "claimed": true,
          "credly_accept_url": "<self._CREDLY_ASSERTION_URL_TEMPLATE.format(assertion_id=assertion_id)>"
        }
      }
order: 1000
