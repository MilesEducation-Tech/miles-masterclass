$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass-web/assessment-questions/{{course_id}}/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "<str(course.id)>",
        "questions_to_show": "<config.questions_to_show>",
        "pass_threshold_percent": "<config.pass_threshold_percent>",
        "exam_rules": "<course.exam_rules>",
        "previous_attempts": "<UserFinalAssessmentAttempt.objects.filter(user=request.user, course=course).acount()>",
        "questions": "<sync_to_async(lambda: dict(serializer.data))()>"
      }
order: 1000
