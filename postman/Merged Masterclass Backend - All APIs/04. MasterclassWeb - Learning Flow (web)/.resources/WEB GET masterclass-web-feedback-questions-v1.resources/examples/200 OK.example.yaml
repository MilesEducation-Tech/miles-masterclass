$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass-web/feedback-questions/{{course_id}}/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "<str(course.id)>",
        "questions": "<sync_to_async(lambda: dict(serializer.data))()>"
      }
order: 1000
