$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass-web/course-progress-update/{{course_id}}/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "chapter_id": "00000000-0000-0000-0000-000000000000",
        "last_watched_position_seconds": 0,
        "max_watched_duration_seconds": 0,
        "updates": [
          {
            "chapter_id": "00000000-0000-0000-0000-000000000000",
            "last_watched_position_seconds": 0,
            "max_watched_duration_seconds": 0
          }
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Unable to save your progress."
      }
order: 9000
