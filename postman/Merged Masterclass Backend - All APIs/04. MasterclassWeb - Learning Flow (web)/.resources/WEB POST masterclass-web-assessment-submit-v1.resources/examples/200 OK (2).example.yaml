$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass-web/assessment-submit/{{course_id}}/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "answers": [
          {
            "question_id": "00000000-0000-0000-0000-000000000000",
            "selected_option_ids": [
              "00000000-0000-0000-0000-000000000000"
            ]
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "passed": true,
        "score_percent": "<round(correct_count / total * 100, 1)>",
        "answers": [],
        "next_step": "feedback"
      }
order: 2000
