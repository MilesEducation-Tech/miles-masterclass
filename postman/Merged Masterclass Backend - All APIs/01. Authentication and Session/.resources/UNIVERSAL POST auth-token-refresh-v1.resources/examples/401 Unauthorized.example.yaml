$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/auth-token-refresh/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "{{refresh_token}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Session could not be refreshed. Please sign in again."
      }
order: 2000
