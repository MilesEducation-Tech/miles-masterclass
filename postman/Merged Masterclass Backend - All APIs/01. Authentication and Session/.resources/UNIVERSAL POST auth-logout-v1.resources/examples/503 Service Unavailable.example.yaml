$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/auth-logout/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Sign-in is not configured on this environment."
      }
order: 3000
