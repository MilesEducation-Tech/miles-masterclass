$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/auth-logout/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Authorization header with a Bearer token is required."
      }
order: 1000
