$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/auth-otp-send/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "identifier": "{{login_identifier}}"
      }
response:
  statusCode: 502
  statusText: Bad Gateway
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Sign-in is temporarily unavailable. Please try again."
      }
order: 2000
