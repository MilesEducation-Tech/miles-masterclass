$kind: http-example
request:
  url: "{{base_url}}/api/v1/events/register-via-zoom/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "webinar_id": "00000000-0000-0000-0000-000000000000"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "code": "unsupported_webinar_type",
        "detail": "<f'This endpoint registers webinars and offline events only; this row is a {webinar.webinar_type!r}.'>"
      }
order: 9000
