$kind: http-example
name: 500 Internal Server Error (2) - Shared envelope from `utils/view_errors
request:
  url: "{{base_url}}/app-api/v1/account/lms-logout/{{course}}/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Unable to reach the LMS session store."
      }
order: 5000
