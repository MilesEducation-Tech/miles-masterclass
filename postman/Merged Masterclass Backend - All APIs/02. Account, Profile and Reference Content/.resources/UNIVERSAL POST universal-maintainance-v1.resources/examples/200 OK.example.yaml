$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/universal/maintainance-status/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "value": false,
        "ttl_seconds": 0
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "override_active": false,
        "override_value": null,
        "cleared": true,
        "app": {
          "is_maintenance": false,
          "source": "env"
        },
        "web": {
          "is_maintenance": false,
          "source": "env"
        }
      }
order: 1000
