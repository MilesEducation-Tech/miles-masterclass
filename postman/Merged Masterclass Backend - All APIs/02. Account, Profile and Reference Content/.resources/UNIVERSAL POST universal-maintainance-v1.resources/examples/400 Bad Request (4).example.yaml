$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/universal/maintainance-status/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "value": false,
        "ttl_seconds": 0
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Invalid request.",
        "details": "<payload.errors>"
      }
order: 6000
