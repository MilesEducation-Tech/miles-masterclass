$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/universal/maintainance-status/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "value": false,
        "ttl_seconds": 0
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "You do not have permission to perform this action."
      }
order: 8000
