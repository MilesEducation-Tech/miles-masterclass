$kind: http-example
name: 500 Internal Server Error (2) - Shared envelope from `utils/view_errors
request:
  url: "{{base_url}}/api/v1/account/enquiry/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": 0
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Could not record your enquiry."
      }
order: 5000
