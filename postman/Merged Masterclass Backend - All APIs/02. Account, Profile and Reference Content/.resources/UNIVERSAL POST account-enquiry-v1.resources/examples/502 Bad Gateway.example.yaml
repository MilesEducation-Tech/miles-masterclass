$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/enquiry/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": 0
      }
response:
  statusCode: 502
