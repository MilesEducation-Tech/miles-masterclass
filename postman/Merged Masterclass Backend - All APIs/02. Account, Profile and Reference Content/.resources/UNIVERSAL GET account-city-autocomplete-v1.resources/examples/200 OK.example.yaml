$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/city-autocomplete/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "suggestions": "<suggest_cities(serializer.validated_data.get('query'), alog=alog)>"
      }
order: 1000
