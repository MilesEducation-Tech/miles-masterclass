$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/name/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "firstName": "",
        "lastName": ""
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "User not found.",
        "status": "Failed"
      }
order: 4000
