$kind: http-example
request:
  url: "{{base_url}}/api/v1/account/name/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "firstName": "",
        "lastName": ""
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "<message>"
      }
order: 5000
