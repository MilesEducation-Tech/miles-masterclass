$kind: http-example
request:
  url: "{{base_url}}/app-api/v1/account/lms-login/{{course}}/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "",
        "uid": ""
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "That course identifier is not valid.",
        "status": "Failed"
      }
order: 5000
