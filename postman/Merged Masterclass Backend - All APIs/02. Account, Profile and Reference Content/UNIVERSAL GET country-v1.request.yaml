description: |-
  **Surface:** UNIVERSAL  
  **View:** `GetCountryDetailsViewV1`  
  **Module:** `Accounts.views`  
  **Route name:** `country-v1`  
  **Methods on this view:** GET  
  **Authentication:** none  
