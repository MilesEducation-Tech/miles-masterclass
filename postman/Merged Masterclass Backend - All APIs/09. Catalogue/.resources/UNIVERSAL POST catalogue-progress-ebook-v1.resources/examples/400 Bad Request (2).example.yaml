$kind: http-example
request:
  url: "{{base_url}}/api/v1/catalogue/progress/ebook/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "lms_subject_id": 0,
        "completed": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_query",
        "errors": "<pydantic_error_list(exc)>"
      }
order: 3000
