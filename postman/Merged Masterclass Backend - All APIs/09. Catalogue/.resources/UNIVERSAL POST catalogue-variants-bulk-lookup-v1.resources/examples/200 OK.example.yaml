$kind: http-example
request:
  url: "{{base_url}}/api/v1/catalogue/variants/bulk-lookup/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "variant_ids": [
          "00000000-0000-0000-0000-000000000000"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "count": 0,
        "results": "<[found[str(v)] for v in body.variant_ids if str(v) in found]>",
        "missing_ids": "<[str(v) for v in body.variant_ids if str(v) not in found]>"
      }
order: 1000
