$kind: http-example
request:
  url: "{{base_url}}/api/v1/catalogue/progress/video/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "youtube_video_id": "",
        "watched": false
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Authentication credentials were not provided."
      }
order: 5000
