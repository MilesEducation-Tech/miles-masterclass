$kind: http-example
name: 400 Bad Request (2) - Shared envelope from `utils/view_errors
request:
  url: "{{base_url}}/api/v1/catalogue/collections/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_query",
        "errors": [
          "<one entry per rejected query parameter>"
        ]
      }
order: 3000
