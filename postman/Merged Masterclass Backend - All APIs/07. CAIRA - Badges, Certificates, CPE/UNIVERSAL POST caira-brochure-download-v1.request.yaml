description: |-
  **Surface:** UNIVERSAL  
  **View:** `CAIRABrochureDownloadViewV1`  
  **Module:** `Accounts.views`  
  **Route name:** `caira-brochure-download-v1`  
  **Methods on this view:** POST  
  **Authentication:** JWTAuthentication  
