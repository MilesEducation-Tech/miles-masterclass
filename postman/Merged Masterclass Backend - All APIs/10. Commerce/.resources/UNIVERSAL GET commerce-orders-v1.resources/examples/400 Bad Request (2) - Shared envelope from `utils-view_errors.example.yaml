$kind: http-example
name: 400 Bad Request (2) - Shared envelope from `utils/view_errors
request:
  url: "{{base_url}}/api/v1/commerce/orders/"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: order_status
      value: ""
      disabled: true
    - key: page
      value: ""
      disabled: true
    - key: page_size
      value: ""
      disabled: true
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_query",
        "errors": [
          "<one entry per rejected query parameter>"
        ]
      }
order: 3000
