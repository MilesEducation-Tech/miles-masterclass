$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/cart/lines/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "product_variant_id": "00000000-0000-0000-0000-000000000000",
        "quantity": 0,
        "token_amount_selected": false
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "<message>"
      }
order: 6000
