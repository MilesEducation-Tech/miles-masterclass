$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/cart/line/{{line_id}}/"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "quantity": 0,
        "token_amount_selected": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "No fields to update."
      }
order: 3000
