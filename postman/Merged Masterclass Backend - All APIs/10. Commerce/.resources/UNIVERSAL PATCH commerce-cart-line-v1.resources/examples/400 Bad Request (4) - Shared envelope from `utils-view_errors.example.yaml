$kind: http-example
name: 400 Bad Request (4) - Shared envelope from `utils/view_errors
request:
  url: "{{base_url}}/api/v1/commerce/cart/line/{{line_id}}/"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "quantity": 0,
        "token_amount_selected": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_query",
        "errors": [
          "<one entry per rejected query parameter>"
        ]
      }
order: 5000
