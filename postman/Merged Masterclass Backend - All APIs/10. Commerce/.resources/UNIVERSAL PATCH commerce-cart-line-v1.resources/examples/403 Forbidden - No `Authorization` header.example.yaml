$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/cart/line/{{line_id}}/"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "quantity": 0,
        "token_amount_selected": false
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Authentication credentials were not provided."
      }
order: 6000
