$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/addresses/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "line1": "",
        "city": "",
        "state": "",
        "postal_code": "",
        "country": "",
        "label": "",
        "name": "",
        "phone": "",
        "line2": "",
        "landmark": "",
        "is_default": false
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Authentication credentials were not provided."
      }
order: 5000
