$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/addresses/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "count": 0,
        "results": "<[shape_address(r) async for r in Address.objects.filter(user_id=request.user.pk).order_by('-is_default', '-updated_at').values(*ADDRESS_FIELDS)]>"
      }
order: 1000
