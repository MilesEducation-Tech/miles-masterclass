$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/address/{{address_id}}/"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "line1": "",
        "city": "",
        "state": "",
        "postal_code": "",
        "country": "",
        "label": "",
        "name": "",
        "phone": "",
        "line2": "",
        "landmark": "",
        "is_default": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_query",
        "errors": "<pydantic_error_list(exc)>"
      }
order: 4000
