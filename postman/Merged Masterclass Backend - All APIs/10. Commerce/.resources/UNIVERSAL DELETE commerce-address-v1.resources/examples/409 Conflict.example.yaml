$kind: http-example
request:
  url: "{{base_url}}/api/v1/commerce/address/{{address_id}}/"
  method: DELETE
  headers:
    Accept: application/json
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "This address is used by an order and cannot be deleted. Add a new address instead."
      }
order: 4000
