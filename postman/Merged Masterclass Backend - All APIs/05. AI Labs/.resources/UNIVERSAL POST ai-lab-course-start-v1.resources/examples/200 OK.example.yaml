$kind: http-example
request:
  url: "{{base_url}}/api/v1/ai-labs/course-start/{{ai_lab_course_id}}/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "ai_lab_course_id": "<str(ai_lab_course_id)>",
        "enrollment_id": "<str(existing['id'])>",
        "enrollment_created": false,
        "started_at": "<existing['ai_lab_enrollment_started_at']>",
        "expires_at": "<existing['ai_lab_enrollment_expires_at']>",
        "is_course_closed": false
      }
order: 1000
