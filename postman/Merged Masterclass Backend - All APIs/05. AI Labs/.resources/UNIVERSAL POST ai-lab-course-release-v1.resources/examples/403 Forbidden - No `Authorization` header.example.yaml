$kind: http-example
request:
  url: "{{base_url}}/api/v1/ai-labs/course-release/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ai_lab_course_id": "00000000-0000-0000-0000-000000000000",
        "reason": "abandoned",
        "external_ref": ""
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Authentication credentials were not provided."
      }
order: 4000
