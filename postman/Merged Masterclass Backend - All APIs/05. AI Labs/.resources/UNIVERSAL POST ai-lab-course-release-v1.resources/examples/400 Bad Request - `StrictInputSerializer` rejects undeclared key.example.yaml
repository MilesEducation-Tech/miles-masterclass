$kind: http-example
name: 400 Bad Request - `StrictInputSerializer` rejects undeclared keys instead of dropping them silently
request:
  url: "{{base_url}}/api/v1/ai-labs/course-release/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ai_lab_course_id": "00000000-0000-0000-0000-000000000000",
        "reason": "abandoned",
        "external_ref": ""
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "<field you did not declare>": "Unrecognised field for this endpoint. Each endpoint declares its own fields; a field accepted elsewhere is not accepted here."
      }
order: 2000
