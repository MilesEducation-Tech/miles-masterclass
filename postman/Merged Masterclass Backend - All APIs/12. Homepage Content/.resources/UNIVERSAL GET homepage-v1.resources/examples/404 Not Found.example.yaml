$kind: http-example
request:
  url: "{{base_url}}/api/v1/homepage-content/homepage/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "page_not_configured",
        "message": "<f\"No active content page '{self.PAGE_SLUG}' in vertical '{self.VERTICAL_SLUG}'.\">",
        "data": []
      }
order: 3000
