  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: ""
      disabled: true
    - key: page_size
      value: ""
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "next": "<self._page_link(request, page + 1, page_size)>",
        "previous": "<self._page_link(request, page - 1, page_size)>",
        "<REELS_PAYLOAD_KEY>": "<[self._shape(row, liked, watched) for row in rows]>"
      }
order: 1000
