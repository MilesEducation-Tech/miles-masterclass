$kind: http-example
request:
  url: "{{base_url}}/api/v1/homepage-content/item/{{item_id}}/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "item_not_found",
        "message": "<f\"No active content item '{item_id}'.\">"
      }
order: 3000
