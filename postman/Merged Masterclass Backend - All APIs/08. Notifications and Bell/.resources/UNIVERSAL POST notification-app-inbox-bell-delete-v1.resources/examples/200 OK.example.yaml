$kind: http-example
request:
  url: "{{base_url}}/api/v1/notification/app-inbox-bell/delete/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "notification_id": "00000000-0000-0000-0000-000000000000"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "Success",
        "message": "Notification soft-deleted successfully.",
        "notification_id": "<sync_to_async(_soft_delete)()>"
      }
order: 1000
