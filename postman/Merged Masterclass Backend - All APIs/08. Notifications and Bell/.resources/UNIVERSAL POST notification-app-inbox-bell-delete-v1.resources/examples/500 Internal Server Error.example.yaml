$kind: http-example
request:
  url: "{{base_url}}/api/v1/notification/app-inbox-bell/delete/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "notification_id": "00000000-0000-0000-0000-000000000000"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "Failed",
        "message": "Error deleting notification.",
        "error": "<str(exc)>"
      }
order: 5000
