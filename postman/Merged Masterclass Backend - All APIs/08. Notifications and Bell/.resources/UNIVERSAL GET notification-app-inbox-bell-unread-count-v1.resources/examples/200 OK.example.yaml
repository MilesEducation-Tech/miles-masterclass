$kind: http-example
request:
  url: "{{base_url}}/api/v1/notification/app-inbox-bell/unread-count/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "Success",
        "unread_count": "<sync_to_async(_count)()>"
      }
order: 1000
