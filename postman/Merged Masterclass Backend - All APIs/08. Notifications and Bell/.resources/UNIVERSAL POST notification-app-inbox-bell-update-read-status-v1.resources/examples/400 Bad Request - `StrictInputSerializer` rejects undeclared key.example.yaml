$kind: http-example
name: 400 Bad Request - `StrictInputSerializer` rejects undeclared keys instead of dropping them silently
request:
  url: "{{base_url}}/api/v1/notification/app-inbox-bell/update-read-status/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "notification_id": "00000000-0000-0000-0000-000000000000",
        "is_read": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "<field you did not declare>": "Unrecognised field for this endpoint. Each endpoint declares its own fields; a field accepted elsewhere is not accepted here."
      }
order: 2000
