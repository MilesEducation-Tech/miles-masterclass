$kind: http-example
request:
  url: "{{base_url}}/api/v1/notification/app-inbox-bell/mark-all-read/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "Failed",
        "message": "An error occurred while marking all notifications as read.",
        "error": "<str(exc)>"
      }
order: 3000
