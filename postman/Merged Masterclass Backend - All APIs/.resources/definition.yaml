scripts:
  - type: http:beforeRequest
    code: |-
      /* Merged Masterclass Backend - collection pre-request. Runs before EVERY request here.
       *
       * It does two things and deliberately nothing else: it refuses to send a
       * request into an unconfigured environment, and it renews the access token
       * BEFORE it expires.
       *
       * WHY BEFORE EXPIRY AND NOT ON A 401. `AuthTokenRefreshViewV1` states it in its
       * own docstring - the access token is short on purpose and cannot be revoked
       * once issued, so the documented client behaviour is to rotate ahead of time.
       * Retrying after a 401 would also mean re-sending the original request, which
       * is wrong for a POST that has already taken effect.
       *
       * REFRESH TOKENS ROTATE AND THE OLD ONE DIES ABOUT TEN SECONDS AFTER USE, so
       * the rotated pair is stored the moment it arrives and two refreshes must never
       * run at once. Postman sends one request at a time and waits for this script's
       * `pm.sendRequest` callback before sending the real one, so exactly one refresh
       * is ever in flight - do not "improve" this into a parallel send.
       *
       * Set `auto_refresh` to `off` in the environment to disable it.
       */
      var REFRESH_PATH = "/api/v1/account/auth-token-refresh/";

      // The five auth routes are excluded: refreshing before the call that MINTS the
      // session is nonsense, and refreshing before the refresh is recursion.
      var AUTH_REQUESTS = [
          "auth-identify-v1", "auth-otp-send-v1", "auth-otp-verify-v1",
          "auth-token-refresh-v1", "auth-logout-v1"
      ];

      function isAuthRequest() {
          var name = pm.info.requestName || "";
          for (var i = 0; i < AUTH_REQUESTS.length; i += 1) {
              if (name.indexOf(AUTH_REQUESTS[i]) !== -1) { return true; }
          }
          return false;
      }

      function decodeSegment(segment) {
          // Postman has shipped `Buffer` in every sandbox version and `atob` only in
          // recent ones, so both are tried rather than either being assumed. `typeof`
          // on an undeclared name is safe in JavaScript; a bare reference is not.
          var padded = segment.replace(/-/g, "+").replace(/_/g, "/");
          while (padded.length % 4 !== 0) { padded += "="; }
          if (typeof atob === "function") { return atob(padded); }
          return Buffer.from(padded, "base64").toString("utf8");
      }

      function jwtExpiry(token) {
          // Returns the `exp` claim in epoch seconds, or null if this is not a JWT.
          // The signature is NOT checked and must not be - the server does that, and
          // a client that verifies its own token is only checking its own arithmetic.
          var parts = String(token || "").split(".");
          if (parts.length !== 3) { return null; }
          try {
              var claims = JSON.parse(decodeSegment(parts[1]));
              return typeof claims.exp === "number" ? claims.exp : null;
          } catch (err) {
              return null;
          }
      }

      var baseUrl = pm.environment.get("base_url");
      if (!baseUrl) {
          // Thrown, not logged. A request sent to a literal "{{base_url}}" fails with
          // an invalid-URL error that says nothing about the cause.
          throw new Error(
              "base_url is empty. Import Merged_Masterclass_Backend_LOCAL / UAT / PROD" +
              ".postman_environment.json and select one from the environment picker."
          );
      }

      var autoRefresh = String(pm.environment.get("auto_refresh") || "on").toLowerCase();
      var skew = parseInt(pm.environment.get("token_refresh_skew_seconds") || "120", 10);
      var accessToken = pm.environment.get("token");
      var refreshToken = pm.environment.get("refresh_token");
      var expiresAt = jwtExpiry(accessToken);
      var now = Math.floor(Date.now() / 1000);

      if (autoRefresh === "on" && refreshToken && expiresAt !== null &&
              expiresAt - now <= skew && !isAuthRequest()) {
          pm.sendRequest({
              url: baseUrl + REFRESH_PATH,
              method: "POST",
              header: { "Content-Type": "application/json", "Accept": "application/json" },
              body: { mode: "raw", raw: JSON.stringify({ refreshToken: refreshToken }) }
          }, function (err, res) {
              if (err) {
                  console.log("[auth] refresh could not be sent: " + err);
                  return;
              }
              if (res.code !== 200) {
                  // Left for the tester rather than cleared. An expired refresh token
                  // needs a new OTP, and silently blanking the session would present
                  // that as "the collection lost my login".
                  console.log("[auth] refresh refused with " + res.code + " - run POST " +
                              "auth-otp-verify-v1 again to mint a new session.");
                  return;
              }
              var body = res.json();
              if (body.accessToken) { pm.environment.set("token", body.accessToken); }
              // Store the ROTATED refresh token. Keeping the old one is the single
              // most expensive mistake here: it dies seconds later and every
              // subsequent refresh then fails against a token that looks valid.
              if (body.refreshToken) { pm.environment.set("refresh_token", body.refreshToken); }
              console.log("[auth] access token renewed with " + (expiresAt - now) + "s left.");
          });
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      /* Merged Masterclass Backend - collection test script. Runs after EVERY request here.
       *
       * Three jobs: assert the baseline every endpoint owes regardless of what it
       * does, explain a 401 instead of leaving it as a bare code, and harvest path
       * parameters out of responses so the collection can be run end to end without
       * pasting UUIDs between requests.
       *
       * Set `auto_capture` to `off` in the environment to disable the harvesting.
       */
      var CAPTURE_KEYS = ["address_id", "ai_lab_course_id", "attempt_id", "chapter_id", "collection_id", "course", "course_id", "instructor_id", "item_id", "line_id", "order_id", "product_id", "subject_id", "variant_id", "video_id"];

      var MAX_DEPTH = 6;

      pm.test("No server error", function () {
          pm.expect(pm.response.code).to.be.below(500);
      });

      var contentType = pm.response.headers.get("Content-Type") || "";
      var isJson = contentType.indexOf("application/json") !== -1;

      if (isJson) {
          pm.test("Body parses as JSON", function () {
              pm.response.json();
          });
      }

      // NOT AN ASSERTION. Response time is a property of the machine the run is on,
      // so failing a test on it would make the collection red on a laptop and green
      // in a datacentre for the same code. It is recorded so a regression is visible.
      console.log("[timing] " + pm.info.requestName + " " + pm.response.responseTime + "ms");

      if (pm.response.code === 403 || pm.response.code === 401) {
          /* A BAD OR EXPIRED TOKEN ANSWERS 403 HERE, NOT 401. Both contracts state it
           * and it is true of every authenticated route in this backend: DRF
           * downgrades an authentication failure to 403 when the authenticator does
           * not implement `authenticate_header()`, and this one does not. So the
           * usual reading - 401 means signed out, 403 means not allowed - is exactly
           * inverted on this API, and the note below says so rather than letting a
           * tester chase a permission problem that is really an expired token.
           *
           * The 401s that DO occur are a different case: `privacy-policy/`,
           * `terms-and-conditions/` and the QR routes check the caller inside the
           * handler, so an ANONYMOUS request to those gets a real 401.
           */
          var hasToken = !!pm.environment.get("token");
          if (!hasToken) {
              console.log("[auth] " + pm.response.code + " and `token` is empty - " +
                          "run POST auth-otp-verify-v1 first.");
          } else if (pm.response.code === 403) {
              console.log("[auth] 403 with a token set. On this API that usually " +
                          "means EXPIRED, not forbidden - 403 is what a failed " +
                          "authentication returns. Run POST auth-token-refresh-v1, " +
                          "and only suspect permissions if that does not fix it. For " +
                          "a webhook request check the secret header instead.");
          } else {
              console.log("[auth] 401 with a token set - this route checks the caller " +
                          "inside its handler, so the token was not read at all.");
          }
      }

      function capture(value, key) {
          // ONLY AN EMPTY SLOT IS FILLED. A tester who pinned a specific course to
          // work against must not have it overwritten by whatever the next list
          // endpoint happened to return first - that turns a deliberate run into a
          // random one, and it is impossible to notice from the request pane.
          if (pm.environment.get(key)) { return; }
          if (typeof value !== "string" && typeof value !== "number") { return; }
          var text = String(value);
          if (!text) { return; }
          pm.environment.set(key, text);
          console.log("[capture] " + key + " = " + text);
      }

      function walk(node, depth) {
          if (depth > MAX_DEPTH || node === null || typeof node !== "object") { return; }
          if (Array.isArray(node)) {
              // The FIRST element only. Walking the whole list would set each key
              // from the last row that carried it, which is the least predictable of
              // the available choices; the first row is at least the one on screen.
              if (node.length > 0) { walk(node[0], depth + 1); }
              return;
          }
          Object.keys(node).forEach(function (key) {
              if (CAPTURE_KEYS.indexOf(key) !== -1) {
                  capture(node[key], key);
              } else {
                  walk(node[key], depth + 1);
              }
          });
      }

      if (isJson && pm.response.code < 300 &&
              String(pm.environment.get("auto_capture") || "on").toLowerCase() === "on") {
          try {
              walk(pm.response.json(), 0);
          } catch (err) {
              console.log("[capture] response was not walkable: " + err);
          }
      }
    language: text/javascript
