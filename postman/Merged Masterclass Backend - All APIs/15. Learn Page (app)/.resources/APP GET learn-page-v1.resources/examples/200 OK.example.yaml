$kind: http-example
request:
  url: "{{base_url}}/app-api/v1/learn/page/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Data fetched successfully",
        "status": "Success",
        "status_code": "<status.HTTP_200_OK>",
        "lms_enrollment_details": [
          "<payload['lms_tokens']>"
        ],
        "user_enrollment_details": [
          "<payload['user_enrolment']>"
        ],
        "enrollment_data": "<payload['sections']>"
      }
order: 1000
