$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/{{course_id}}/enrollment/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "<str(course.id)>",
        "is_enrolled": true,
        "is_course_closed": false,
        "started_at": "<enrollment.started_at>",
        "expires_at": "<enrollment.expires_at>",
        "days_remaining": null,
        "is_expired": false
      }
order: 2000
