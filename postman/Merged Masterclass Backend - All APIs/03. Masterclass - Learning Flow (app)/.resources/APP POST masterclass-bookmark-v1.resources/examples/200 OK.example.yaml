$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/{{course_id}}/bookmark/"
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "message": "Bookmarked successfully.",
        "bookmarked": "<existing_bookmark.active>"
      }
order: 1000
