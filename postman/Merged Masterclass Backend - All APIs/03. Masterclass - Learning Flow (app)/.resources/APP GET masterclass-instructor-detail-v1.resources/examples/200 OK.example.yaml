$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/instructor/{{instructor_id}}/"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "<body>": "<sync_to_async(lambda: MasterclassInstructorDetailSerializer(instructor).data)()>"
      }
order: 1000
