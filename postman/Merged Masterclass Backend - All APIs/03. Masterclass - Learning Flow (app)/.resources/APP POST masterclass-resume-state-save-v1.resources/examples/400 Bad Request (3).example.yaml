$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/resume-state/save/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "00000000-0000-0000-0000-000000000000",
        "chapters": [
          {
            "chapter_id": "00000000-0000-0000-0000-000000000000",
            "current_progress_seconds": 0,
            "show_quiz": false,
            "show_final_assessment": false
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "invalid_show_final_assessment",
        "message": "show_final_assessment=true rejected: not all chapters are completed.",
        "chapter_id": "<str(item.chapter_id)>",
        "chapters_completed": 0,
        "chapters_total": 0
      }
order: 4000
