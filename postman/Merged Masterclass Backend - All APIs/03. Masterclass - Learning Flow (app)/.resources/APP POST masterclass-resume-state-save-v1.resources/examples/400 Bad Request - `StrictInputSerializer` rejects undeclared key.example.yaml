$kind: http-example
name: 400 Bad Request - `StrictInputSerializer` rejects undeclared keys instead of dropping them silently
request:
  url: "{{base_url}}/api/v1/masterclass/resume-state/save/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "00000000-0000-0000-0000-000000000000",
        "chapters": [
          {
            "chapter_id": "00000000-0000-0000-0000-000000000000",
            "current_progress_seconds": 0,
            "show_quiz": false,
            "show_final_assessment": false
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "<field you did not declare>": "Unrecognised field for this endpoint. Each endpoint declares its own fields; a field accepted elsewhere is not accepted here."
      }
order: 2000
