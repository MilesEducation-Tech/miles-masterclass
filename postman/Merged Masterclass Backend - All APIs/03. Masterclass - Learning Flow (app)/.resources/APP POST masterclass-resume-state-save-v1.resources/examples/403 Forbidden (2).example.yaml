$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/resume-state/save/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course_id": "00000000-0000-0000-0000-000000000000",
        "chapters": [
          {
            "chapter_id": "00000000-0000-0000-0000-000000000000",
            "current_progress_seconds": 0,
            "show_quiz": false,
            "show_final_assessment": false
          }
        ]
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "reason": "chapter_locked",
        "message": "Cannot save state for a locked chapter. Complete the previous chapter first.",
        "locked_chapter_id": "<str(ch_id)>"
      }
order: 9000
