$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/{{course_id}}/feedback/submit/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "responses": [
          {
            "question_id": "00000000-0000-0000-0000-000000000000",
            "rating": 0,
            "text_response": ""
          }
        ],
        "optional_feedback_text": ""
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "feedback_submitted": true,
        "cpe_awarded": "<closure_result['cpe_awarded']>",
        "badge_issued": "<closure_result['badge_issued']>",
        "certificate_triggered": "<closure_result['certificate_triggered']>"
      }
order: 1000
