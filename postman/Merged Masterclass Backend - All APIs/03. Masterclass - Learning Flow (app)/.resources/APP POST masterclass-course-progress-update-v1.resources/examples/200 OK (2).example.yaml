$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/course-progress/{{course_id}}/update/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "chapter_id": "00000000-0000-0000-0000-000000000000",
        "last_watched_position_seconds": 0,
        "max_watched_duration_seconds": 0,
        "updates": [
          {
            "chapter_id": "00000000-0000-0000-0000-000000000000",
            "last_watched_position_seconds": 0,
            "max_watched_duration_seconds": 0
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "reset_required": false,
        "badge_url": null,
        "badge_image_url": null,
        "badge_allocated": false,
        "badge_status": null,
        "badge_claimed": false,
        "certificate_url": null
      }
order: 2000
