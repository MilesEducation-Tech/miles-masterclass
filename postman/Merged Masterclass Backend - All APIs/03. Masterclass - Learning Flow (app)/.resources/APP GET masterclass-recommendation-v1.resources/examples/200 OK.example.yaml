$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/recommendation/"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: course_type
      value: ""
      disabled: true
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "<body>": "<_envelope('Recommended courses returned successfully!', data, pagination_data=pagination_data)>"
      }
order: 1000
