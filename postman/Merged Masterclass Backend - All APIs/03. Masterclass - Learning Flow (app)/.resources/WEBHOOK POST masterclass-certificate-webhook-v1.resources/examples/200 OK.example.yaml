$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/webhooks/certificate/{{id}}/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "event": "certificate.created",
        "certificate": {},
        "timestamp": ""
      }
