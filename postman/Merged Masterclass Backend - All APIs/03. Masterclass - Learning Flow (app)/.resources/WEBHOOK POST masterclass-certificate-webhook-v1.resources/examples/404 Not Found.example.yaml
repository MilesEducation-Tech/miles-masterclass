$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/webhooks/certificate/{{id}}/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "event": "certificate.created",
        "certificate": {},
        "timestamp": ""
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Record not found."
      }
order: 4000
