$kind: http-example
request:
  url: "{{base_url}}/api/v1/masterclass/progress/video/update/"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "chapter_id": "00000000-0000-0000-0000-000000000000",
        "last_watched_position_seconds": 0,
        "watched_duration_seconds": 0
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "reset_required": false,
        "chapter_id": "<str(chapter.id)>",
        "is_video_completed": false,
        "is_video_seekable": false,
        "is_chapter_completed": false,
        "last_watched_position_seconds": "<progress.last_watched_position_seconds>",
        "current_watched_duration_seconds": "<progress.current_watched_duration_seconds>",
        "max_watched_duration_seconds": "<progress.max_watched_duration_seconds>",
        "enrollment": {
          "started_at": "<enrollment.started_at>",
          "expires_at": "<enrollment.expires_at>",
          "days_remaining": "<max(0, (enrollment.expires_at - timezone.now()).days)>"
        }
      }
order: 1000
